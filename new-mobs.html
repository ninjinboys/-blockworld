<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e2428">
<title>NEXACRAFT | モブ・ボス 3D図鑑</title>
<style>
:root{
 color-scheme:dark;
 --glass:rgba(9,23,27,.93);--border:rgba(113,225,208,.50);
 --aqua:#9de6d3;--cream:#effbf5;
 font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
 color:var(--cream);background:#0c1b20
}
*{box-sizing:border-box}
html{min-height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;min-height:100dvh;background:#0c1b20;isolation:isolate}
body::before{
 content:"";position:fixed;inset:0;z-index:-2;
 background:linear-gradient(180deg,rgba(5,14,22,.43),rgba(5,18,21,.66)),
  url("assets/nexacraft-title.webp?v=20261011titleHD1672") center center/cover no-repeat;
}
body::after{
 content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
 background:radial-gradient(ellipse at 50% 38%,transparent 10%,rgba(1,11,18,.34) 100%)
}
header{
 position:relative;display:flex;align-items:center;gap:18px;
 margin:0;padding:16px max(15px,calc((100vw - 1460px)/2 + 18px));
 background:rgba(8,20,25,.88);border-bottom:1px solid var(--border);
 box-shadow:0 8px 28px rgba(0,0,0,.35)
}
header a{
 text-decoration:none;color:#ebfff9;border:2px solid #427f78;
 border-radius:7px;background:#255850;box-shadow:inset 2px 2px 0 #538f85,inset -2px -2px 0 #123c3a,0 3px 0 #061e20;
 padding:10px 14px;white-space:nowrap;font-size:13px;font-weight:850;
 touch-action:manipulation
}
header a:hover,header a:focus-visible{background:#33776c;outline:2px solid #bcf7e3;outline-offset:2px}
header h1{margin:0;font-weight:900;font-size:clamp(20px,2.8vw,32px);letter-spacing:.085em;line-height:1.1;
 text-shadow:0 0 22px rgba(43,236,208,.34)}
header h1 span{color:#b2e6be}
header small{display:block;margin-top:6px;color:#aad2c6;font-size:11px;letter-spacing:.16em}
main{
 position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) 292px;
 max-width:1460px;margin:22px auto 34px;gap:16px;padding:0 18px;align-items:start
}
main>section{min-width:0}
#stage{
 position:relative;overflow:hidden;height:min(73vh,780px);min-height:370px;
 background:linear-gradient(#203e47,#13262d);
 border:2px solid var(--border);border-radius:12px;
 box-shadow:0 22px 65px rgba(0,0,0,.55),0 0 26px rgba(9,212,193,.15),inset 0 0 25px #071b20;
 touch-action:none
}
#stage::after{
 content:"";position:absolute;inset:0;pointer-events:none;
 background:radial-gradient(ellipse at center,transparent 47%,rgba(4,14,20,.40) 100%);
}
#stage canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#stage canvas:active{cursor:grabbing}
#overlay{
 position:absolute;z-index:1;top:17px;left:17px;pointer-events:none;
 max-width:calc(100% - 34px);padding:15px 18px;
 background:rgba(7,21,26,.91);border:1px solid rgba(138,229,211,.52);
 border-left:4px solid #71ccb8;border-radius:8px;
 box-shadow:0 10px 35px rgba(0,0,0,.26),0 0 23px rgba(30,215,198,.10)
}
#overlay::before{
 content:"NEXACRAFT  /  CREATURE ARCHIVE";display:block;
 font:700 10px/1.4 ui-monospace,monospace;letter-spacing:.12em;color:#9ad6c4;margin-bottom:7px
}
#name{font-size:clamp(19px,3vw,34px);font-weight:900;line-height:1.2;text-shadow:0 0 15px rgba(101,224,199,.16)}
#desc{color:#c4dcd4;font-size:12px;white-space:pre-line;line-height:1.65;margin-top:6px}
#controls{position:absolute;z-index:2;left:14px;right:14px;bottom:14px;display:flex;gap:8px;align-items:center;pointer-events:none}
#controls button{
 pointer-events:auto;min-height:45px;padding:10px 13px;cursor:pointer;
 background:#2d6c63;border:2px solid #21544f;border-radius:7px;color:#f5fffb;
 font-size:13px;font-weight:850;box-shadow:inset 2px 2px 0 #6aa69a,inset -2px -2px 0 #184740,0 3px 0 #07191b;
 touch-action:manipulation
}
#controls button:hover{background:#3b857a}
#controls button:active{transform:translateY(2px);box-shadow:inset 2px 2px 0 #184740}
#controls .right{margin-left:auto}
#helper{padding:12px 9px;margin:0;text-align:center;font-size:11px;color:#d4eee6;text-shadow:0 2px 5px #07181b}
aside{
 overflow:hidden;background:var(--glass);border:2px solid var(--border);border-radius:12px;
 box-shadow:0 20px 65px rgba(0,0,0,.55),0 0 28px rgba(9,212,193,.12);padding:15px;
}
aside h2{font-size:17px;color:#effff8;letter-spacing:.04em;margin:3px 0 8px;text-shadow:0 0 15px rgba(43,236,208,.20)}
aside .note{color:#96cbbc;line-height:1.5;font-size:11px;margin:0 0 12px}
#mobList{
 display:grid;grid-template-columns:1fr;gap:9px;overflow-y:auto;
 max-height:min(69vh,700px);padding:2px 5px 4px 1px;scrollbar-color:#427f74 #10292a;
}
#mobList button{
 position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:56px;
 text-align:left;background:#193934;color:#f4fdfa;border:2px solid #326a60;border-radius:8px;
 padding:9px 10px;cursor:pointer;font-size:13px;
 box-shadow:inset 2px 2px 0 rgba(131,214,192,.15),inset -2px -2px 0 #112f2d,0 3px 0 #06181a;
 touch-action:manipulation
}
#mobList button:hover,#mobList button:focus-visible{background:#245a52;outline:none;border-color:#75c9b4}
#mobList button.active{background:#337b70;border-color:#98e8d4;box-shadow:0 0 18px rgba(55,240,207,.21),inset 2px 2px 0 rgba(235,255,246,.26)}
#mobList button strong{display:block;font-size:14px;line-height:1.3}
#mobList button small{display:block;margin-top:4px;font-size:10px;color:#aad6c9;line-height:1.3}
#mobList button .num{
 flex:none;min-width:30px;text-align:center;padding:7px 5px;border-radius:5px;
 background:#102922;color:#bdebdc;font:800 12px/1 ui-monospace,monospace;
}
#mobList button .badge{
 margin-left:auto;flex:none;padding:4px 6px;border-radius:4px;
 font:850 9px/1.2 ui-monospace,monospace;color:#e7cfff;background:#594577
}
#mobList button.boss{border-color:#a88bc5;background:#3a3045}
#mobList button.boss.active{background:#654f75;border-color:#efceff}
#mobList button.boss .num{color:#f1d0ff;background:#291f33}
#mobList button.pending{opacity:.7;border-style:dashed}
#mobList button .badge.pending{background:#46595a;color:#d4e8df}
#mobList .section-title{
 margin:10px 0 3px;padding:8px 1px 6px;border-bottom:1px solid rgba(210,171,232,.46);
 color:#e5c5ff;letter-spacing:.18em;font-size:11px;font-weight:850
}
#status{font-size:11px;line-height:1.65;color:#acd5c9;margin:13px 2px 1px}
#message{padding:16px;color:#e4f7ee;text-align:center}
@media(max-width:780px){
 header{gap:10px;padding:11px 10px}
 header a{font-size:11px;padding:9px 8px}
 header h1{font-size:clamp(17px,4vw,26px)}header small{font-size:9px}
 main{grid-template-columns:1fr;margin:10px auto 24px;gap:11px;padding:0 9px}
 #stage{height:54dvh;min-height:320px}
 #overlay{top:10px;left:10px;padding:9px 10px;max-width:80%}
 #overlay::before{font-size:8px;margin-bottom:4px}
 #desc{font-size:10px}
 #controls{left:9px;right:9px;bottom:10px}
 #controls button{font-size:12px;min-height:42px;padding:8px 9px}
 aside{padding:12px}
 #mobList{grid-template-columns:repeat(2,minmax(0,1fr));max-height:none;overflow:visible;gap:8px}
 #mobList button{min-height:50px;padding:8px 7px;gap:7px}
 #mobList button strong{font-size:12px}
 #mobList button small{font-size:9px}
 #mobList .section-title{grid-column:1/-1}
 #mobList button .num{min-width:24px;padding:6px 3px;font-size:10px}
}
@media(max-width:440px){
 #stage{height:51dvh;min-height:295px}
 #mobList button .badge{display:none}
 #mobList button{gap:6px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><a href="./">← ゲームへ戻る</a><div><h1>NEXACRAFT <span>MOB ARCHIVE</span></h1><small>CREATURE ENCYCLOPEDIA / モブ・ボス 3D図鑑</small></div></header>
<main>
<section>
 <div id="stage" aria-label="選択したモブの3Dモデルを回転させて見る">
  <div id="overlay"><div id="name">読み込み中…</div><div id="desc"></div></div>
  <div id="controls"><button id="prev" aria-label="前のモブ">◀ 前</button><button id="next" aria-label="次のモブ">次 ▶</button><button id="rotate" class="right" aria-pressed="true">↻ 自動回転 ON</button></div>
 </div>
 <p id="helper">👆 画面を指で左右に動かすと回転 / 上下で角度変更。ピンチ操作で拡大・縮小できます。</p>
</section>
<aside><h2>◆ モブ・ボス図鑑</h2><p class="note">通常モブはゲームに登場した順。キメラは特別枠。</p><div id="mobList"></div>
<p id="status">これまで登場した生物・敵・村人をすべて3Dで確認できます。新しいモブとボスもここに追加します。</p></aside>
</main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/+esm';
import {CREATURE_CATALOG,createCreatureCatalogue} from './creature-catalog.js?v=20261018allMobsArchive01';
const $=id=>document.getElementById(id);
const descriptions={
 sheep:'柔らかな羊毛・小さな蹄',
 pig:'ピンクの鼻・丸い体・くるんとした尻尾',
 cow:'まだらの毛皮・短い角・牛の顔',
 zombie:'緑色の体・前に伸ばした腕',
 horse:'たてがみ・長い脚・騎乗できる馬',
 bison:'黒い巨体・白い角・赤く光る目',
 lion:'立派なたてがみ・鋭い牙',
 anaconda:'長い一体型の蛇体・黄色い目',
 skeleton:'骨の体・弓を持つ夜の敵',
 deer:'枝分かれした大きな角・長い脚・白い腹',
 wolf:'立ち耳・長い口先・太い尻尾',
 bear:'大きな肩・重厚な前脚・鋭い爪',
 boar:'背中の剛毛・大きな鼻・左右の牙',
 spider:'8本の脚が別々に動く・赤い目',
 eagle:'大きな羽・白い頭・黄色い鉤状のくちばし',
 crocodile:'長い口・背中の鱗板・しなる尾',
 shark:'背びれ・胸びれ・左右に動く尾びれ',
 elephant:'大きな耳・長く動く鼻・左右の牙',
 golem:'ゴツゴツした岩の体・苔・光る胸の核',
 chimera:'ライオンのたてがみ・巻き上がる角・巨大なアナコンダの尾'
};
const stage=$('stage');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x1b363e);
scene.fog=new THREE.Fog(0x1b363e,19,43);
const camera=new THREE.PerspectiveCamera(48,1,.06,90);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.7));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
stage.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdbfff4,0x244447,2.65));
const sun=new THREE.DirectionalLight(0xffefdb,3.5);
sun.position.set(5,11,8);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-12;sun.shadow.camera.right=12;
sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;
sun.shadow.bias=-.001;scene.add(sun);
const rim=new THREE.DirectionalLight(0x54cfbd,1.2);rim.position.set(-7,6,-7);scene.add(rim);
const podium=new THREE.Group();scene.add(podium);
const groundMat=new THREE.MeshLambertMaterial({color:0x284646});
const ground=new THREE.Mesh(new THREE.BoxGeometry(24,.3,24),groundMat);
ground.position.y=-.25;ground.receiveShadow=true;podium.add(ground);
const grid=new THREE.GridHelper(24,24,0x6bb4a3,0x2d6c68);
grid.position.y=-.093;grid.material.transparent=true;grid.material.opacity=.27;podium.add(grid);
const factory=createCreatureCatalogue(THREE),cache=new Map();
const display=new THREE.Group();scene.add(display);
let current=0,camYaw=Math.PI+.45,camPitch=.28,distance=7,targetY=1.5,auto=true,lastTime=0;
function choose(index){
 current=(index+CREATURE_CATALOG.length)%CREATURE_CATALOG.length;
 const entry=CREATURE_CATALOG[current];
 display.clear();
 let cached=cache.get(entry.id);
 if(!cached){
  const model=factory.build(entry.id);
  if(entry.boss)model.userData.galleryBossType=entry.id;
  const bounds=new THREE.Box3().setFromObject(model);
  const dims=new THREE.Vector3();bounds.getSize(dims);
  model.position.y=-bounds.min.y;
  model.userData.baseY=model.position.y;
  cached={model,height:dims.y,width:Math.max(dims.x,dims.z)};
  cache.set(entry.id,cached);
 }
 display.add(cached.model);
 targetY=Math.max(.85,cached.height*.46);
 distance=Math.max(5.4,Math.min(26,(3.6+Math.max(cached.height,cached.width)*1.35)*
   Math.max(1,1/Math.sqrt(Math.max(.5,camera.aspect)))));
 $('name').textContent=(entry.boss?'⚔️ ':'')+entry.name;
 $('desc').textContent=entry.kind+' ／ '+entry.height+' ／ '+entry.status+'\n'+
  (entry.description||descriptions[entry.id]||'');
 for(const b of $('mobList').querySelectorAll('button[data-index]')){
  const selected=Number(b.dataset.index)===current;
  b.classList.toggle('active',selected);
  b.setAttribute('aria-pressed',String(selected));
 }
}
CREATURE_CATALOG.forEach((m,i)=>{
 if(m.boss&&!$('mobList').querySelector('.section-title')){
  const heading=document.createElement('div');heading.className='section-title';
  heading.textContent='◆ SPECIAL BOSS';$('mobList').append(heading);
 }
 const b=document.createElement('button');b.type='button';b.dataset.index=String(i);
 if(m.boss)b.classList.add('boss');
 if(m.status!=='実装済')b.classList.add('pending');
 const n=document.createElement('span');n.className='num';
 n.textContent=m.boss?'◆':String(m.order||i+1).padStart(2,'0');
 const label=document.createElement('span'),strong=document.createElement('strong'),small=document.createElement('small');
 strong.textContent=m.name;small.textContent=m.kind;label.append(strong,small);b.append(n,label);
 if(m.boss||m.status!=='実装済'){
  const badge=document.createElement('span');badge.className='badge'+(m.boss?'':' pending');
  badge.textContent=m.boss?'BOSS':'準備中';b.appendChild(badge);
 }
 b.addEventListener('click',()=>choose(i));$('mobList').append(b);
});
$('prev').addEventListener('click',()=>choose(current-1));
$('next').addEventListener('click',()=>choose(current+1));
$('rotate').addEventListener('click',()=>{
 auto=!auto;$('rotate').textContent='↻ 自動回転 '+(auto?'ON':'OFF');
 $('rotate').setAttribute('aria-pressed',String(auto));
});
function resize(){
 const w=Math.max(1,stage.clientWidth),h=Math.max(1,stage.clientHeight);
 renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);resize();
const fingers=new Map();let pinch=0;
renderer.domElement.addEventListener('pointerdown',e=>{
 fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 renderer.domElement.setPointerCapture(e.pointerId);auto=false;
 $('rotate').textContent='↻ 自動回転 OFF';$('rotate').setAttribute('aria-pressed','false');
});
renderer.domElement.addEventListener('pointermove',e=>{
 if(!fingers.has(e.pointerId))return;
 const prev=fingers.get(e.pointerId),dx=e.clientX-prev.x,dy=e.clientY-prev.y;
 fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(fingers.size===1){
  camYaw-=dx*.010;camPitch=Math.max(-.07,Math.min(1.13,camPitch+dy*.007));
 }else if(fingers.size===2){
  const pts=[...fingers.values()],spread=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
  if(pinch)distance=Math.max(3.5,Math.min(16,distance*pinch/spread));
  pinch=spread;
 }
});
for(const evt of ['pointerup','pointercancel','lostpointercapture'])
 renderer.domElement.addEventListener(evt,e=>{fingers.delete(e.pointerId);pinch=0});
renderer.domElement.addEventListener('wheel',e=>{
 e.preventDefault();distance=Math.max(3.5,Math.min(16,distance*Math.exp(e.deltaY*.001)));
},{passive:false});
window.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft')choose(current-1);
 if(e.key==='ArrowRight')choose(current+1);
});
choose(0);
function frame(now){
 requestAnimationFrame(frame);
 const dt=Math.min(.07,Math.max(0,(now-lastTime)/1000));lastTime=now;
 if(auto)camYaw+=dt*.25;
 const t=now*.001;
 for(const [id,c]of cache)if(id===CREATURE_CATALOG[current].id)factory.animate(c.model,t,true);
 camera.position.set(Math.sin(camYaw)*Math.cos(camPitch)*distance,
  targetY+Math.sin(camPitch)*distance,
  Math.cos(camYaw)*Math.cos(camPitch)*distance);
 camera.lookAt(0,targetY,0);
 renderer.render(scene,camera);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
