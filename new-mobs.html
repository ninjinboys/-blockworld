<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172a2b">
<title>NEXACRAFT | 新モブ 3D 図鑑</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:#102023;color:#f3f6f2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;background:radial-gradient(ellipse at 50% 0%,#365c53 0%,#172a2c 54%,#10191f 100%)}
header{display:flex;align-items:center;gap:14px;padding:13px max(14px,env(safe-area-inset-left));background:#101b1eea;border-bottom:2px solid #638273}
header a{color:#c4f1d4;text-decoration:none;font-size:13px;border:1px solid #77998a;border-radius:7px;padding:9px 11px;white-space:nowrap;font-weight:800}
header h1{font-size:clamp(17px,2.5vw,26px);margin:0;letter-spacing:.06em}
header small{font-size:11px;color:#a8c7b9;display:block;margin-top:2px}
main{display:grid;grid-template-columns:minmax(0,1fr) 248px;max-width:1350px;margin:auto;gap:12px;padding:12px;align-items:start}
#stage{position:relative;height:min(72vh,740px);min-height:360px;background:linear-gradient(#506b76,#92b6aa);overflow:hidden;border:2px solid #8eb1a0;border-radius:11px;touch-action:none}
#stage canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none}#stage canvas:active{cursor:grabbing}
#overlay{position:absolute;top:12px;left:12px;background:#102225db;padding:10px 12px;border:1px solid #c0d8cc66;border-radius:8px;pointer-events:none;max-width:78%}
#name{font-size:clamp(18px,3vw,31px);font-weight:900;line-height:1.2}#desc{font-size:12px;color:#d7e9df;margin-top:5px}
#controls{position:absolute;bottom:12px;left:12px;right:12px;display:flex;gap:7px;align-items:center;pointer-events:none}
#controls button{pointer-events:auto;border:2px solid #b2c4b4;border-radius:8px;padding:9px 12px;min-height:43px;background:#253e37e9;color:#fff;font-size:14px;font-weight:800;cursor:pointer}
#controls button:active{background:#385f49}#controls .right{margin-left:auto}
#helper{font-size:11px;color:#d8ebdc;padding:8px 11px;margin:0;text-align:center}
aside{background:#132423dd;border:1px solid #668475;border-radius:11px;padding:12px}
aside h2{font-size:16px;margin:2px 0 10px;color:#e4f3e4}
#mobList{display:grid;grid-template-columns:1fr;gap:7px}
#mobList button{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid #567566;border-radius:8px;background:#243a32;color:#f6f4e9;padding:10px;font-size:13px;cursor:pointer;min-height:48px}
#mobList button strong{display:block;font-size:14px}#mobList button small{font-size:10px;color:#a9cbb7;display:block;margin-top:1px}#mobList button.active{border:2px solid #d5f8bc;background:#3a6547}#mobList .num{font:800 12px monospace;background:#10251d;border-radius:5px;padding:5px 7px;color:#bde2c5}
#status{font-size:11px;color:#bed6ca;line-height:1.6;margin:12px 1px 2px}
#message{padding:15px;text-align:center;color:#d4e6db}
@media(max-width:780px){
header{padding:9px 12px;gap:9px}header a{padding:9px 8px;font-size:12px}
main{grid-template-columns:1fr;padding:8px;gap:9px}
#stage{height:53dvh;min-height:280px}
#mobList{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
aside{padding:9px}#mobList button{padding:7px;gap:6px;min-height:42px}
#mobList button strong{font-size:12px}#mobList button small{font-size:9px}
#mobList .num{padding:4px;font-size:10px}
#helper{padding:6px 9px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><a href="./">← ゲームへ戻る</a><div><h1>NEXACRAFT <span style="color:#b9e2b4">NEW MOBS</span></h1><small>新モブ10体 · 3Dモデル試作ギャラリー</small></div></header>
<main>
<section>
 <div id="stage" aria-label="選択したモブの3Dモデルを回転させて見る">
  <div id="overlay"><div id="name">読み込み中…</div><div id="desc"></div></div>
  <div id="controls"><button id="prev" aria-label="前のモブ">◀ 前</button><button id="next" aria-label="次のモブ">次 ▶</button><button id="rotate" class="right" aria-pressed="true">↻ 自動回転 ON</button></div>
 </div>
 <p id="helper">👆 画面を指で左右に動かすと回転 / 上下で角度変更。ピンチ操作で拡大・縮小できます。</p>
</section>
<aside><h2>🐾 モブ一覧</h2><div id="mobList"></div>
<p id="status">シカ・オオカミ・ヒグマ・イノシシ・巨大クモ・ワシ・ワニ・サメ・ゾウの9体がワールドに登場します。クモは夜のみ出現、ワシは空を飛ぶ中立モブ。ストーンゴーレムは村の実装後に登場予定です。</p></aside>
</main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/+esm';
import {NEW_MOBS,createNewMobModels} from './new-mob-models.js?v=20261017mobRelease02';
const $=id=>document.getElementById(id);
const descriptions={
 deer:'枝分かれした大きな角・長い脚・白い腹',
 wolf:'立ち耳・長い口先・太い尻尾',
 bear:'大きな肩・重厚な前脚・鋭い爪',
 boar:'背中の剛毛・大きな鼻・左右の牙',
 spider:'8本の脚が別々に動く・赤い目',
 eagle:'大きな羽・白い頭・黄色い鉤状のくちばし',
 crocodile:'長い口・背中の鱗板・しなる尾',
 shark:'背びれ・胸びれ・左右に動く尾びれ',
 elephant:'大きな耳・長く動く鼻・左右の牙',
 golem:'ゴツゴツした岩の体・苔・光る胸の核'
};
const stage=$('stage');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x506a73);
scene.fog=new THREE.Fog(0x506a73,19,43);
const camera=new THREE.PerspectiveCamera(48,1,.06,90);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.7));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
stage.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xfff2dd,0x385c4f,2.3));
const sun=new THREE.DirectionalLight(0xffefcc,3.2);
sun.position.set(5,11,8);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-12;sun.shadow.camera.right=12;
sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;
sun.shadow.bias=-.001;scene.add(sun);
const podium=new THREE.Group();scene.add(podium);
const groundMat=new THREE.MeshLambertMaterial({color:0x52724d});
const ground=new THREE.Mesh(new THREE.BoxGeometry(24,.3,24),groundMat);
ground.position.y=-.25;ground.receiveShadow=true;podium.add(ground);
const grid=new THREE.GridHelper(24,24,0xbad5b3,0x6a997a);
grid.position.y=-.093;grid.material.transparent=true;grid.material.opacity=.23;podium.add(grid);
const factory=createNewMobModels(THREE),cache=new Map();
const display=new THREE.Group();scene.add(display);
let current=0,camYaw=.72,camPitch=.33,distance=7,targetY=1.5,auto=true,lastTime=0;
function choose(index){
 current=(index+NEW_MOBS.length)%NEW_MOBS.length;
 const entry=NEW_MOBS[current];
 display.clear();
 let cached=cache.get(entry.id);
 if(!cached){
  const model=factory.build(entry.id);
  const bounds=new THREE.Box3().setFromObject(model);
  const dims=new THREE.Vector3();bounds.getSize(dims);
  model.position.y=-bounds.min.y;
  model.userData.baseY=model.position.y;
  cached={model,height:dims.y,width:Math.max(dims.x,dims.z)};
  cache.set(entry.id,cached);
 }
 display.add(cached.model);
 targetY=Math.max(.85,cached.height*.46);
 distance=Math.max(5.4,Math.min(12.5,3.6+Math.max(cached.height,cached.width)*1.13));
 $('name').textContent=entry.name;
 $('desc').textContent=entry.kind+' ／ '+entry.height+'\n'+descriptions[entry.id];
 for(const [i,b]of [...$('mobList').children].entries()){
  b.classList.toggle('active',i===current);
  b.setAttribute('aria-pressed',String(i===current));
 }
}
NEW_MOBS.forEach((m,i)=>{
 const b=document.createElement('button');b.type='button';
 const n=document.createElement('span');n.className='num';n.textContent=String(i+1).padStart(2,'0');
 const label=document.createElement('span'),strong=document.createElement('strong'),small=document.createElement('small');
 strong.textContent=m.name;small.textContent=m.kind;label.append(strong,small);b.append(n,label);
 b.addEventListener('click',()=>choose(i));$('mobList').append(b);
});
$('prev').addEventListener('click',()=>choose(current-1));
$('next').addEventListener('click',()=>choose(current+1));
$('rotate').addEventListener('click',()=>{
 auto=!auto;$('rotate').textContent='↻ 自動回転 '+(auto?'ON':'OFF');
 $('rotate').setAttribute('aria-pressed',String(auto));
});
function resize(){
 const w=Math.max(1,stage.clientWidth),h=Math.max(1,stage.clientHeight);
 renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);resize();
const fingers=new Map();let pinch=0;
renderer.domElement.addEventListener('pointerdown',e=>{
 fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 renderer.domElement.setPointerCapture(e.pointerId);auto=false;
 $('rotate').textContent='↻ 自動回転 OFF';$('rotate').setAttribute('aria-pressed','false');
});
renderer.domElement.addEventListener('pointermove',e=>{
 if(!fingers.has(e.pointerId))return;
 const prev=fingers.get(e.pointerId),dx=e.clientX-prev.x,dy=e.clientY-prev.y;
 fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(fingers.size===1){
  camYaw-=dx*.010;camPitch=Math.max(-.07,Math.min(1.13,camPitch+dy*.007));
 }else if(fingers.size===2){
  const pts=[...fingers.values()],spread=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
  if(pinch)distance=Math.max(3.5,Math.min(16,distance*pinch/spread));
  pinch=spread;
 }
});
for(const evt of ['pointerup','pointercancel','lostpointercapture'])
 renderer.domElement.addEventListener(evt,e=>{fingers.delete(e.pointerId);pinch=0});
renderer.domElement.addEventListener('wheel',e=>{
 e.preventDefault();distance=Math.max(3.5,Math.min(16,distance*Math.exp(e.deltaY*.001)));
},{passive:false});
window.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft')choose(current-1);
 if(e.key==='ArrowRight')choose(current+1);
});
choose(0);
function frame(now){
 requestAnimationFrame(frame);
 const dt=Math.min(.07,Math.max(0,(now-lastTime)/1000));lastTime=now;
 if(auto)camYaw+=dt*.25;
 const t=now*.001;
 for(const [id,c]of cache)if(id===NEW_MOBS[current].id)factory.animate(c.model,t,true);
 camera.position.set(Math.sin(camYaw)*Math.cos(camPitch)*distance,
  targetY+Math.sin(camPitch)*distance,
  Math.cos(camYaw)*Math.cos(camPitch)*distance);
 camera.lookAt(0,targetY,0);
 renderer.render(scene,camera);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
