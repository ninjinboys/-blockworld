<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ペナント・レジェンズ</title><style>body{font-family:system-ui;background:#101c2c;color:#eef5ff;margin:0;padding:18px}main{max-width:780px;margin:auto}.box{background:#20314a;padding:17px;border-radius:14px;margin:12px 0}button{padding:11px;border:0;border-radius:8px;background:#36b7a3;color:#071a26;font-weight:bold;margin:3px}button:disabled{opacity:.4}nav button{background:#344b67;color:white}.muted{color:#aabbd0}.item{border-bottom:1px solid #46556a;padding:9px 0}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px 3px;border-bottom:1px solid #46556a;text-align:right}td:first-child,th:first-child{text-align:left}</style><main><h1>⚾ ペナント・レジェンズ</h1><p class="muted">架空12球団・ガチャ・選手編成・143試合</p><div id="stats"></div><nav><button onclick="tab='home';render()">試合</button><button onclick="tab='gacha';render()">ガチャ</button><button onclick="tab='roster';render()">編成</button><button onclick="tab='rank';render()">順位</button></nav><div id="view"></div></main><script>
const names=['東京フェニックス','大阪タイタンズ','広島レッドスターズ','名古屋ブレイバーズ','横浜マリナーズ','神戸ブルズ','札幌ウルブズ','福岡ホークウィンズ','仙台イーグルズ','千葉シャークス','埼玉ライオンズ','新潟スノーズ'],family=['佐伯','高瀬','宮原','藤堂','三浦','黒川','北条','桐生','水野','朝倉','神谷','森下','早川','川島','立花'],first=['悠真','蓮','翔太','大和','拓海','健人','颯太','陸','一輝','直樹','隼人','雄大'],positions=['捕','一','二','三','遊','左','中','右','投'];let tab='home',result='';const rnd=n=>Math.floor(Math.random()*n);function player(){let x=rnd(100),rar=x<1?'UR':x<8?'SSR':x<30?'SR':x<70?'R':'N',base={UR:90,SSR:79,SR:67,R:55,N:43}[rar];return{id:Math.random().toString(36).slice(2),name:family[rnd(family.length)]+' '+first[rnd(first.length)],pos:positions[rnd(9)],rar,age:18+rnd(18),power:Math.min(99,base+rnd(19)-9),hit:Math.min(99,base+rnd(19)-9),pitch:Math.min(99,base+rnd(19)-9)}}let s;try{s=JSON.parse(localStorage.getItem('pennant-legends-v1'))}catch{}if(!s){s={year:2026,games:0,coins:3000,players:Array.from({length:24},player),active:[],w:Array(12).fill(0),l:Array(12).fill(0),d:Array(12).fill(0),log:[]};auto()}function save(){localStorage.setItem('pennant-legends-v1',JSON.stringify(s))}function rating(p){return p.pos==='投'?p.pitch:Math.round((p.hit+p.power)/2)}function auto(){let used=new Set;s.active=positions.map(pos=>{let p=s.players.filter(x=>x.pos===pos&&!used.has(x.id)).sort((a,b)=>rating(b)-rating(a))[0]||s.players.filter(x=>!used.has(x.id)).sort((a,b)=>rating(b)-rating(a))[0];used.add(p.id);return p.id});save()}function strength(){return s.active.reduce((v,id)=>v+rating(s.players.find(p=>p.id===id)),0)/Math.max(1,s.active.length)}function play(n){for(let z=0;z<n&&s.games<143;z++){let opp=1+rnd(11),a=Math.max(0,Math.round(4+(strength()-60)/14+(Math.random()+Math.random()+Math.random()-1.5)*6)),b=Math.max(0,Math.round(4+(rnd(35)-15)/14+(Math.random()+Math.random()+Math.random()-1.5)*6));if(a>b){s.w[0]++;s.l[opp]++}else if(a<b){s.l[0]++;s.w[opp]++}else{s.d[0]++;s.d[opp]++}for(let j=1;j<12;j++){if(j===opp)continue;let k=1+rnd(11);if(k===j||k===opp)continue;if(Math.random()<.5)s.w[j]++;else s.l[j]++}s.log.unshift('第'+(s.games+1)+'戦 '+names[opp]+' '+a+' - '+b+' '+(a>b?'勝':a<b?'負':'分'));s.games++;s.coins+=80+(a>b?60:0)}save();render()}function draw(n){let cost=n===10?2700:300;if(s.coins<cost)return alert('コイン不足です');s.coins-=cost;let a=Array.from({length:n},player);s.players.push(...a);result=a.map(p=>p.rar+' '+p.name+' ('+p.pos+') 能力'+rating(p)).join('<br>');save();render()}function next(){s.year++;s.games=0;s.coins+=1500;s.w.fill(0);s.l.fill(0);s.d.fill(0);s.log=[];s.players.forEach(p=>{p.age++;let diff=p.age<27?rnd(4):p.age>33?-rnd(5):rnd(3)-1;p.hit=Math.max(10,Math.min(99,p.hit+diff));p.power=Math.max(10,Math.min(99,p.power+diff));p.pitch=Math.max(10,Math.min(99,p.pitch+diff))});save();render()}function render(){document.getElementById('stats').innerHTML='<div class="box">'+s.year+'年 ・ '+s.games+'/143試合 ・ '+s.w[0]+'勝 '+s.l[0]+'敗 '+s.d[0]+'分 ・ 🪙'+s.coins+'</div>';let h='';if(tab==='home'){h='<div class="box"><h2>'+names[0]+'</h2><p>チーム戦力 '+strength().toFixed(1)+'</p><button onclick="play(1)">1試合</button><button onclick="play(10)">10試合</button><button onclick="play(143)">シーズン終了まで</button>'+(s.games===143?'<button onclick="next()">翌シーズンへ</button>':'')+'</div><div class="box"><h3>試合結果</h3>'+s.log.slice(0,12).map(x=>'<div class="item">'+x+'</div>').join('')+'</div>'}if(tab==='gacha'){h='<div class="box"><h2>🎰 選手ガチャ</h2><p>UR 1% / SSR 7% / SR 22% / R 40% / N 30%</p><button onclick="draw(1)">1回 300🪙</button><button onclick="draw(10)">10回 2700🪙</button><p>'+result+'</p></div>'}if(tab==='roster'){h='<div class="box"><h2>選手編成</h2><button onclick="auto();render()">最強編成</button><p>起用中の選手は試合の戦力に反映されます。</p>'+s.players.slice().sort((a,b)=>Number(s.active.includes(b.id))-Number(s.active.includes(a.id))||rating(b)-rating(a)).map(p=>'<div class="item">'+(s.active.includes(p.id)?'✅ ':'')+p.rar+' '+p.name+'　'+p.pos+'　'+rating(p)+' <small>('+p.age+'歳)</small></div>').join('')+'</div>'}if(tab==='rank'){let rows=names.map((name,i)=>({name,w:s.w[i],l:s.l[i],d:s.d[i],pct:s.w[i]/(s.w[i]+s.l[i])||0})).sort((a,b)=>b.pct-a.pct);h='<div class="box"><h2>順位表</h2><table><tr><th>球団</th><th>勝</th><th>敗</th><th>分</th><th>勝率</th></tr>'+rows.map((r,i)=>'<tr><td>'+(i+1)+'. '+r.name+'</td><td>'+r.w+'</td><td>'+r.l+'</td><td>'+r.d+'</td><td>'+r.pct.toFixed(3)+'</td></tr>').join('')+'</table></div>'}document.getElementById('view').innerHTML=h}render();</script></html>
