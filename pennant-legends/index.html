.mr-requirement strong{display:block;color:#164a7d;font-size:13px;margin-bottom:4px;border-bottom:1px solid #9dbddd;padding-bottom:4px}
.mr-mission-card button{margin-top:3px}

/* Match the catalog search controls to the adjacent game-choice filters. */
.catalog-filters{align-items:flex-end;gap:16px 18px}
.catalog-search-group{display:flex;flex-direction:column;gap:7px;flex:0 1 330px;min-width:0;max-width:100%}
.catalog-filters .catalog-search-group label{display:block;font-size:14px;font-weight:900;letter-spacing:.03em;color:#e4f3ff}
.catalog-search-row{display:flex;align-items:center;gap:8px;min-width:0}
html body #catalogSearch{-webkit-appearance:none;appearance:none;box-sizing:border-box;min-width:0;max-width:none;width:100%;flex:1 1 160px;height:54px;min-height:54px;margin:0;padding:10px 13px;background:#e6f3ff;color:#123b70;border:3px solid #6bafee;border-radius:8px;font:800 16px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,sans-serif;box-shadow:inset 0 2px 4px #123b7029,0 5px 0 #053b7b;outline:none}
html body #catalogSearch::placeholder{color:#52779c;opacity:1}
html body #catalogSearch:focus{border-color:#ffda4a;box-shadow:0 0 0 2px #ffda4a44,0 5px 0 #053b7b}
#catalogSearch::-webkit-search-decoration{-webkit-appearance:none}
html body .catalog-search-row button{box-sizing:border-box;flex:0 0 auto;min-height:54px!important;height:54px;padding:10px 16px!important;white-space:nowrap;font-size:16px!important;align-self:flex-end}
@media(max-width:600px){.catalog-search-group{flex:1 1 100%;width:100%}.catalog-search-row{width:100%}.catalog-filters .game-choice{flex:1 1 135px;min-width:0}.catalog-search-row button{padding-inline:12px!important}}

/* On-device profile accounts */
.profile-strip{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;padding:12px 14px;background:#0b3977;border:2px solid #73b7ee;border-radius:7px;color:#e6f3ff}
.profile-strip strong{color:#ffe37a;overflow-wrap:anywhere}
.profile-strip button{min-height:44px!important;padding:8px 13px!important;font-size:13px!important}
.profile-dialog[hidden]{display:none!important}
.profile-dialog{position:fixed;inset:0;z-index:650;background:#031b3de8;display:flex;justify-content:center;align-items:center;padding:18px;overflow:auto}
.profile-panel{width:min(100%,470px);max-height:90vh;overflow:auto;padding:22px;background:#10498c;border:3px solid #79baff;border-radius:12px;box-shadow:0 9px 0 #062553,0 18px 45px #0008}
.profile-panel form{display:grid;gap:13px;margin:14px 0}
.profile-panel label{display:grid;gap:6px;font-weight:800;color:#e1efff}
.profile-panel input:not([type=checkbox]){appearance:none;-webkit-appearance:none;max-width:none;width:100%;min-height:50px;padding:10px 12px;border:2px solid #73b7ee;background:#e5f4ff;color:#123b70;border-radius:6px;font:800 16px system-ui}
.profile-panel .profile-check{display:flex;gap:9px;align-items:flex-start;font-size:14px}
.profile-check input{width:20px;height:20px;flex:none;accent-color:#ffd43b}
.profile-panel .profile-actions{display:flex;gap:10px;flex-wrap:wrap}
.profile-panel .profile-actions button{flex:1;min-width:0;min-height:48px!important}
.profile-hint{font-size:13px;color:#d1e8ff;line-height:1.6}
#profileError{color:#ffe0ae;min-height:1.4em;overflow-wrap:anywhere}

.team-rank{display:inline-block;min-width:50px;padding:3px 9px;text-align:center;background:#16477d;color:#f4faff;border:2px solid #316da6;border-radius:6px;font-weight:1000;line-height:1.3;text-shadow:none}
.team-rank.rank-A,.team-rank.rank-B{background:#f7d36b;color:#543600;border-color:#bb8a25}
.team-rank.rank-S,.team-rank.rank-SS{background:#9ce5ff;color:#093d70;border-color:#3689c4}
.team-rank.rank-SSS{background:#e7b4ff;color:#5b186f;border-color:#a546c2}
.stat .rank-rule{display:block;color:#164572;font-size:11px;margin-top:7px;font-weight:700}
.friend-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:18px}
.friend-fields textarea{display:block;width:100%;min-height:108px;margin:14px 0;padding:12px;resize:vertical;border:3px solid #6bafee;border-radius:8px;color:#123b70;background:#e6f3ff;font:16px/1.4 system-ui}
.friend-versus{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;text-align:center}
.friend-versus .stat{overflow-wrap:anywhere}
.friend-score{font-size:clamp(20px,4vw,32px);font-weight:900;color:#fff2a1;padding:12px 0;overflow-wrap:anywhere}
@media(max-width:600px){.friend-versus{gap:6px}.friend-versus .stat{font-size:13px}.tabs .menu-label{font-size:9px!important}.tabs .menu-icon{width:21px!important;height:21px!important}}
.friend-fields input.friend-six-code{display:block;width:min(100%,270px);max-width:none;height:66px;margin:14px 0;padding:9px 12px;border:3px solid #6bafee;border-radius:8px;background:#e6f3ff;color:#123b70;text-align:center;font:900 28px/1.3 ui-monospace,monospace;letter-spacing:.20em;box-shadow:inset 0 2px 4px #123b7030,0 4px 0 #053b7b}.friend-six-code::placeholder{color:#7492af}.friend-legacy{margin-top:20px}.friend-legacy summary{cursor:pointer;color:#d1e8ff;font-size:14px}.friend-legacy textarea{display:block;width:100%;min-height:85px;margin:12px 0;padding:9px;background:#e6f3ff;color:#123b70;border:2px solid #6bafee;border-radius:6px;font-size:16px}.profile-strip[hidden]{display:none!important}.account-management{padding-bottom:16px;border-bottom:2px solid #5b9bd9;margin-bottom:17px}

function setCatalogInitialAbilities(p){

 const overall=.58+random()*.25;
 const boosts={捕:'field',一:'power',二:'contact',三:'arm',遊:'field',左:'power',中:'speed',右:'arm',投:'control'};
 const traitBoost={'チャンス◎':'contact','対左◎':'contact','広角打法':'contact','パワーヒッター':'power','盗塁巧者':'speed','守備職人':'field','奪三振':'break','対ピンチ◎':'control','球持ち◎':'break','回復◎':'stamina'}[p.trait];
 for(const k of ABILITIES){

function rosterPower(c){let b=c.order.map(id=>c.roster.find(p=>p.id===id)).filter(Boolean),p=c.rotation.map(id=>c.roster.find(x=>x.id===id)).filter(Boolean);return (b.reduce((a,x)=>a+batScore(x),0)/Math.max(1,b.length))*.65+(p.reduce((a,x)=>a+armScore(x),0)/Math.max(1,p.length))*.35}

function battlePlayer(p,kind,i){
 const rar=Object.hasOwn(CAPS,p.rar)?p.rar:null;
 if(!rar)throw Error('選手のレアリティが不正です。');
 const pos=String(p.pos||'');
 if(kind==='pitch'&&pos!=='投'||kind==='bat'&& !['捕','一','二','三','遊','左','中','右','投'].includes(pos))throw Error('選手の守備位置が不正です。');
 const out={id:kind+i,name:String(p.name||'選手').slice(0,40),pos,rar,condition:3,fatigue:0};
 for(const k of ABILITIES){if(!Number.isFinite(p[k])||p[k]<1||p[k]>CAPS[rar])throw Error('選手能力が規定範囲外です。');out[k]=Math.round(p[k])}
 if(!Number.isFinite(p.velocity)||p.velocity<100||p.velocity>180)throw Error('球速が規定範囲外です。');
 out.velocity=Math.round(p.velocity);return out;
}
function battleSnapshot(team,club){
 const bats=club.order.map(id=>club.roster.find(p=>p.id===id)).filter(Boolean);
 const pitchers=club.rotation.map(id=>club.roster.find(p=>p.id===id)).filter(Boolean);
 if(!bats.length||!pitchers.length)throw Error('打順と先発投手を設定してください。');
 return {v:1,team:String(team).slice(0,24),bats:bats.slice(0,9).map((p,i)=>battlePlayer(p,'bat',i)),pitchers:pitchers.slice(0,5).map((p,i)=>battlePlayer(p,'pitch',i))};
}
function snapshotPower(t){return displayTeamPower(rosterPower({roster:[...t.bats,...t.pitchers],order:t.bats.map(p=>p.id),rotation:t.pitchers.map(p=>p.id)}))}
function encodeFriend(t){const bytes=new TextEncoder().encode(JSON.stringify(t));return 'PL1-'+btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decodeFriend(code){
 const raw=code.trim();if(raw.length>40000||!/^PL1-[A-Za-z0-9_-]+$/.test(raw))throw Error('正しい対戦コードを入力してください。');
 let o;try{o=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(atob(raw.slice(4).replace(/-/g,'+').replace(/_/g,'/')),ch=>ch.charCodeAt(0))))}catch(e){throw Error('対戦コードを読み込めません。')}
 if(o?.v!==1||typeof o.team!=='string'||!o.team.trim()||!Array.isArray(o.bats)||o.bats.length<1||o.bats.length>9||!Array.isArray(o.pitchers)||o.pitchers.length<1||o.pitchers.length>5)throw Error('球団データが不正です。');
 return {v:1,team:o.team.trim().slice(0,24),bats:o.bats.map((p,i)=>battlePlayer(p,'bat',i)),pitchers:o.pitchers.map((p,i)=>battlePlayer(p,'pitch',i))};
}
function friendHalf(bats,pitch,turn,record=null,edge=0){
 let runs=0,outs=0,bases=[false,false,false],attempts=0;
 while(outs<3&&attempts++<120){
  const batter=bats[turn.i++%bats.length],res=resolvePlate(batter,pitch,edge),before=runs;
  if(res==='OUT'||res==='SO'){if(res==='SO')turn.k=(turn.k||0)+1;outs++}
  else if(res==='BB'){
   if(bases[0]){if(bases[1]){if(bases[2])runs++;bases[2]=true}bases[1]=true}bases[0]=true;
  }else{
   const n=res==='HR'?4:res==='3B'?3:res==='2B'?2:1,next=[false,false,false];
   for(let j=2;j>=0;j--)if(bases[j]){if(j+n>=3)runs++;else next[j+n]=true}
   if(n===4)runs++;else next[n-1]=true;bases=next;
  }
  if(record)record(batter,res,runs-before);
 }
 return runs;
}
function simulateFriend(a,b){
 const pa=a.pitchers[0],pb=b.pitchers[0],ta={i:0},tb={i:0};let my=0,opp=0;const innings=[];
 for(let i=1;i<=12;i++){
  const x=friendHalf(a.bats,pb,ta);my+=x;
  if(i>=9&&opp>my){innings.push([x,null]);break}
  const y=friendHalf(b.bats,pa,tb);opp+=y;innings.push([x,y]);
  if(i>=9&&my!==opp)break;
 }
 return {team:a.team,opponent:b.team,my,opp,innings,stamp:new Date().toISOString()};
}
async function friendAction(action){
 if(friendBusy)return;
 const request=async(options={},query='')=>{
  const response=await fetch('/api/pennant-friend'+query,{...options,signal:AbortSignal.timeout(12000)});
  let data;try{data=await response.json()}catch(e){throw Error('6桁コード用の対戦サーバーはまだ接続されていません。')}
  if(!response.ok)throw Error(data.error||'対戦サーバーに接続できません。');
  return data;
 };
 try{
  if(action==='friendGenerate'){
   friendBusy=true;const status=$('friendError');if(status)status.textContent='コードを発行中…';
   const data=await request({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(battleSnapshot(clubs[0],me()))});
   if(!/^[0-9]{6}$/.test(data.code))throw Error('コードの発行に失敗しました。');
   friendCode=data.code;friendExpiry=data.expires;notice='6桁の対戦コードを発行しました。';render();return;
  }
  if(action==='friendLegacyGenerate'){
   const input=$('friendLegacyShare');if(input)input.value=encodeFriend(battleSnapshot(clubs[0],me()));return;
  }
  if(action==='friendLegacyLoad'){friendOpponent=decodeFriend($('friendLegacyInput').value);friendLast=null;notice='相手球団を読み込みました。';render();return}
  if(action==='friendCopy'){
   const input=$('friendShare');if(!input?.value)return;input.focus();input.select();
   if(navigator.clipboard?.writeText)navigator.clipboard.writeText(input.value).then(()=>{$('friendCopyStatus').textContent='コピーしました'}).catch(()=>{$('friendCopyStatus').textContent='選択したコードを手動でコピーしてください'});
   else $('friendCopyStatus').textContent='選択したコードを手動でコピーしてください';return;
  }
  if(action==='friendLoad'){
   const code=$('friendInput').value.trim();if(!/^[0-9]{6}$/.test(code))throw Error('対戦コードは6桁の数字です。');
   friendBusy=true;const status=$('friendError');if(status)status.textContent='相手球団を検索中…';
   const data=await request({},'?code='+encodeURIComponent(code));
   friendOpponent=decodeFriend(encodeFriend(data.snapshot));friendLast=null;notice='相手球団を読み込みました。';render();return;
  }
  if(action==='friendPlay'){
   if(!friendOpponent)throw Error('先に相手の対戦コードを読み込んでください。');
   friendLast=simulateFriend(battleSnapshot(clubs[0],me()),friendOpponent);
   s.friendHistory=[friendLast,...(Array.isArray(s.friendHistory)?s.friendHistory:[])].slice(0,30);
   save();notice='フレンド対戦終了！';render();return;
  }
 }catch(e){const error=$('friendError');if(error)error.textContent=e.message||'処理に失敗しました。'}finally{friendBusy=false}
}

function batting(p){return p.stats[s.year]||(p.stats[s.year]={g:0,ab:0,h:0,hr:0,rbi:0,bb:0,so:0,ip:0,er:0,win:0,loss:0,sv:0,k:0})}
function addStat(p,k,n=1){batting(p)[k]+=n;p.career[k]+=n}
function season(p){return batting(p)}
function average(p){let x=season(p);return x.ab?(x.h/x.ab).toFixed(3):'.---'}
function isTwoWay(p){return p.rar==='MR'&&p.trait?.includes('二刀流')}
function skillLabel(p){
 const batting='ミート'+p.contact+' パワー'+p.power+' 走力'+p.speed+' 守備'+p.field+' 肩'+p.arm;
 const pitching='球速'+p.velocity+' 制球'+p.control+' 変化'+p.break+' 体力'+p.stamina;
 return isTwoWay(p)?batting+' / '+pitching:isPitch(p)?pitching:batting;
}

const cpuCapColors=['','#ae354c','#d89c32','#327a67','#3878b8','#954542','#526da0','#bd8b39','#a14271','#467c84','#4a629d','#b46b34'];
function playerPortrait(p,clubIndex){
 const match=/^catalog-([0-9]{4})$/.exec(p.id);

 if(!drafted&&(id<1||id>3000||!['N','R','SR','SSR','UR'].includes(p.rar)))return '';
 const index=drafted?p.portrait:((id-1)*29)%72,x=(index%6)*48,y=Math.floor(index/6)*48;
 const pitcher=p.pos==='投'?' pitcher':'';

function day(){return new Date().toISOString().slice(0,10)}
function draw(n,type='normal',free=false){let cost=free?0:n===10?2700:300;if(!free&&s.coins<cost){notice='コインが足りません';render();return}if(free&&s.daily===day()){notice='本日の無料ガチャは使用済みです';render();return}if(free)s.daily=day();s.coins-=cost;drawn=[];for(let i=0;i<n;i++){let forced=null;if(type==='limited'&&rand(100)<10)forced='SSR';if(s.pity>=99)forced='UR';if(n===10&&i===9&&!drawn.some(p=>['SR','SSR','UR','LR'].includes(p.rar)))forced='SR';let position=type==='pitcher'?'投':type==='fielder'?'野手':null,p=newPlayer(forced,position);if(!p)break;drawn.push(p);me().roster.push(p);s.pity=['UR','LR'].includes(p.rar)?0:s.pity+1}if(!drawn.length){s.coins+=cost;if(free)s.daily='';notice='選手データベースに獲得可能な選手がいません'}else{if(drawn.length<n)s.coins+=Math.round(cost*(n-drawn.length)/n);notice=drawn.length+'人獲得！'+(drawn.length<n?'（残りの選手が不足）':'')}save();render()}
function chooseOrder(slot,id){let c=me();if(c.order.includes(id)){let prev=c.order.indexOf(id);[c.order[prev],c.order[slot]]=[c.order[slot],c.order[prev]]}else c.order[slot]=id;save();render()}

function draftRarity(p){

 const average=values.reduce((sum,n)=>sum+n,0)/values.length;
 const meetsMinimums=rarity=>values.every((value,i)=>value>=RARITY_ROLE_MINIMUMS[rarity][i<2?0:1]);
 if(average>=5200&&meetsMinimums('UR'))return 'UR';
 if(average>=3950&&meetsMinimums('SSR'))return 'SSR';

}

function draftPointsLeft(draft){

function draftProspect(draft,index){

  for(const k of draftSkills(p))p[k]+=draft.points[k]||0;

  if(draft.custom===index)return;

 }else if(action==='sign'){
  const player=draftProspect(draft,index);
  const history=s.draftHistory||(s.draftHistory=[]);
  if(history.some(p=>p.draftYear===s.year)||usedCatalogIds().has(player.id))return;

 }else{

   draft.points={};

   const portrait=Number(button.dataset.draftPortrait);

const randomHex=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>b.toString(16).padStart(2,'0')).join('');
async function profileHash(password,salt){
 const encoder=new TextEncoder(),key=await crypto.subtle.importKey('raw',encoder.encode(password),'PBKDF2',false,['deriveBits']);
 const bytes=await crypto.subtle.deriveBits({name:'PBKDF2',salt:encoder.encode(salt),iterations:210000,hash:'SHA-256'},key,256);
 return Array.from(new Uint8Array(bytes),b=>b.toString(16).padStart(2,'0')).join('');
}
function activateProfile(id,data){
 const old=s,oldId=activeProfile;
 if(!save())throw Error('現在の球団を保存できません。');
 try{
  if(data){localStorage.setItem(profileSaveKey(id),JSON.stringify(data));s=data;activeProfile=id}
  else{s=null;activeProfile=id;clubs[0]='広島レッドスターズ';init();if(!localStorage.getItem(profileSaveKey(id)))throw Error('新しい球団を保存できません。')}
  if(id)localStorage.setItem(ACTIVE_KEY,id);else localStorage.removeItem(ACTIVE_KEY);
 }catch(e){s=old;activeProfile=oldId;clubs[0]=s.teamName||'広島レッドスターズ';throw e}
 clubs[0]=s.teamName||'広島レッドスターズ';
 const growthMigrated=initializeClubGrowth(),raisedSavedAbilities=initializeTraining();
 if(balanceCPUClubs()||raisedSavedAbilities||growthMigrated)save();
 facilityPreview='';
 friendCode='';friendExpiry=0;friendOpponent=null;friendLast=null;
 setupMode=!s.teamConfigured;tab='home';notice='';drawn=[];pendingGames=0;watchQueue=[];watchActive=false;watchInning=0;
 $('matchViewer').hidden=true;$('skipChoice').hidden=true;
 $('setup').hidden=!setupMode;$('view').hidden=setupMode;$('summary').hidden=setupMode;$('tabs').hidden=setupMode;
}
async function submitProfile(){
 if(profileBusy)return;
 const id=$('profileID').value.trim().toLowerCase(),password=$('profilePassword').value,register=profileMode==='register',error=$('profileError');
 const carry=register&&$('profileCarry').checked;
 if(!/^[a-z0-9_-]{3,24}$/.test(id)||['__proto__','constructor','prototype'].includes(id)){error.textContent='IDは半角英数字・_・- の3〜24文字にしてください。';return}
 if(password.length<8||password.length>128){error.textContent='パスワードは8〜128文字です。';return}
 if(register&&password!==$('profileConfirm').value){error.textContent='確認用パスワードが一致しません。';return}
 profileBusy=true;$('profileSubmit').disabled=true;error.textContent='処理中…';
 try{
  if(!crypto.subtle)throw Error('このブラウザではアカウント機能を利用できません。');
  const records=profiles();
  if(register){
   if(Object.hasOwn(records,id)||localStorage.getItem(profileSaveKey(id))!==null)throw Error('このユーザーIDはすでに使用されています。');
   const salt=randomHex(16),hash=await profileHash(password,salt);
   const latest=profiles();if(Object.hasOwn(latest,id))throw Error('このユーザーIDはすでに使用されています。');
   latest[id]={salt,hash};
   localStorage.setItem(PROFILE_KEY,JSON.stringify(latest));
   try{activateProfile(id,carry?structuredClone(s):null)}catch(e){delete latest[id];localStorage.setItem(PROFILE_KEY,JSON.stringify(latest));localStorage.removeItem(profileSaveKey(id));throw e}
  }else{
   const account=Object.hasOwn(records,id)?records[id]:null;
   if(!account||await profileHash(password,account.salt)!==account.hash)throw Error('IDまたはパスワードが正しくありません。');
   const data=readSave(id);if(!data)throw Error('このアカウントの保存データがありません。');
   activateProfile(id,data);
  }
  $('profileDialog').hidden=true;notice=register?'アカウントを作成しました！':'ログインしました！';render();
 }catch(e){error.textContent=e.message||'処理に失敗しました。'}finally{profileBusy=false;const button=$('profileSubmit');if(button)button.disabled=false}
}
function logoutProfile(){

}

function catalogRoleTable(players,assigned,role){

 if(!players.length)return '<section data-catalog-list="'+role+'">'+heading+'<p>条件に合う選手がいません。</p></section>';
 const start=page*pageSize,pagePlayers=players.slice(start,start+pageSize);
 const showMission=pagePlayers.some(p=>p.rar==='MR');

 const rows=pagePlayers.map(p=>{

  return [id,name,isTwoWay(p)?'投（二刀流）':p.pos,p.rar,p.age,...values,safeText(club?.name||'未所属'),...(showMission?[mission]:[])];
 });

}

function showWatch(){
 if(!watchQueue.length){watchActive=false;$('matchViewer').hidden=true;render();return}
 watchActive=true;watchInning=0;$('matchViewer').hidden=false;updateWatch();
}
function updateWatch(){
 const r=watchQueue[0],played=Math.min(9,watchInning);
 const my=r.inning.slice(0,played).reduce((a,v)=>a+v[0],0),enemy=r.inning.slice(0,played).reduce((a,v)=>a+v[1],0);
 const complete=played>=9;
 $('matchScoreboard').textContent=clubs[0]+' '+(complete?r.my:my)+' － '+(complete?r.enemy:enemy)+' '+clubs[r.opp];
 $('matchCommentary').textContent=complete?'試合終了。'+(r.my>r.enemy?'勝利しました。':r.my<r.enemy?'敗戦しました。':'引き分けです。'):'第'+(played+1)+'回の攻防。'+(played?'ここまで '+my+' 対 '+enemy+'。':'プレーボール！');
 const b=document.querySelector('[data-action="nextInning"]');
 if(b)b.textContent=complete?'次の試合へ':'次のイニング';
}
function advanceWatch(){
 if(!watchActive)return;
 if(watchInning<9){watchInning++;updateWatch();return}
 watchQueue.shift();
 if(watchQueue.length){watchInning=0;updateWatch()}else{watchActive=false;$('matchViewer').hidden=true;render()}
}
function finishWatch(){
 watchQueue=[];watchActive=false;$('matchViewer').hidden=true;render();
}

e('register');return}if(a==='profileClose'){closeProfile();return}if(a==='profileLogout'){logoutProfile();return}if(a==='catalogSearchApply'){catalogSearch=$('catalogSearch')?.value||'';resetCatalogPages();render();return}if(a==='draft'){openDraft();return}if(a==='promoteClub'){promoteClub();return}if(a==='clearFacilityPreview'){facilityPreview='';render();return}if(a==='resetGame'){resetGame();return}if(a==='week'){advanceWeek();return}if(a==='month'||a==='seasonEnd'){autoAdvance(a==='seasonEnd');return}if(a==='editTeam'){showSetup(true);return}if(a==='play'||a==='play10'||a==='playall'){pendingGames=a==='play'?1:a==='play10'?10:Math.max(0,143-s.game);$('skipChoiceDetail').textContent=pendingGames+'試合を進行します。現在はどちらを選んでも結果と進行方法は同じです。';$('skipChoice').hidden=false;return}else if(a==='cancelSkip'){$('skipChoice').hidden=true;pendingGames=0;return}else if(a==='confirmSkip'||a==='confirmWatch'){$('skipChoice').hidden=true;let n=pendingGames;pendingGames=0;watchQueue=[];for(let i=0;i<n;i++){let previous=s.game;simulateGame();if(a==='confirmWatch'&&s.game>previous&&s.lastResult)watchQueue.push({...s.lastResult,inning:s.lastResult.inning.map(x=>x.slice())})}if(a==='confirmWatch'&&watchQueue.length)showWatch()}else if(a==='nextInning'){advanceWatch();return}else if(a==='watchToEnd'){if(watchActive){watchInning=9;updateWatch()}return}else if(a==='closeWatch'){finishWatch();return}else if(a==='auto')optimize();else if(a==='next')nextYear();else if(a==='coach'){if(me().finance>=3000){me().finance-=3000;me().coach++;notice='コーチLvアップ'}}else if(a==='foreign')signForeign();else if(a==='fa')fa();else if(a==='trade')trade();save();render()});
