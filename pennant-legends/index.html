function rosterPower(c){let b=c.order.map(id=>c.roster.find(p=>p.id===id)).filter(Boolean),p=c.rotation.map(id=>c.roster.find(x=>x.id===id)).filter(Boolean);return (b.reduce((a,x)=>a+batScore(x),0)/Math.max(1,b.length))*.65+(p.reduce((a,x)=>a+armScore(x),0)/Math.max(1,p.length))*.35}

function day(){return new Date().toISOString().slice(0,10)}
function draw(n,type='normal',free=false){let cost=free?0:n===10?2700:300;if(!free&&s.coins<cost){notice='コインが足りません';render();return}if(free&&s.daily===day()){notice='本日の無料ガチャは使用済みです';render();return}if(free)s.daily=day();s.coins-=cost;drawn=[];for(let i=0;i<n;i++){let forced=null;if(type==='limited'&&rand(100)<10)forced='SSR';if(s.pity>=99)forced='UR';if(n===10&&i===9&&!drawn.some(p=>['SR','SSR','UR'].includes(p.rar)))forced='SR';let position=type==='pitcher'?'投':type==='fielder'?'野手':null,p=newPlayer(forced,position);if(!p)break;drawn.push(p);me().roster.push(p);s.pity=p.rar==='UR'?0:s.pity+1}if(!drawn.length){s.coins+=cost;if(free)s.daily='';notice='選手データベースに獲得可能な選手がいません'}else{if(drawn.length<n)s.coins+=Math.round(cost*(n-drawn.length)/n);notice=drawn.length+'人獲得！'+(drawn.length<n?'（残りの選手が不足）':'')}save();render()}
function chooseOrder(slot,id){let c=me();if(c.order.includes(id)){let prev=c.order.indexOf(id);[c.order[prev],c.order[slot]]=[c.order[slot],c.order[prev]]}else c.order[slot]=id;save();render()}
function chooseRotation(slot,id){let c=me();if(c.rotation.includes(id)){let prev=c.rotation.indexOf(id);[c.rotation[prev],c.rotation[slot]]=[c.rotation[slot],c.rotation[prev]]}else c.rotation[slot]=id;save();render()}
function optimize(){let c=me(),batters=c.roster.filter(p=>!isPitch(p)).sort((a,b)=>batScore(b)-batScore(a));c.order=batters.slice(0,8).map(p=>p.id);c.rotation=c.roster.filter(isPitch).sort((a,b)=>armScore(b)-armScore(a)).slice(0,5).map(p=>p.id);save();render()}
function event(){if(rand(10)>1)return;let p=pick(all()),kind=rand(3);if(kind===0){p.condition=5;notice=p.name+'が絶好調に！'}else if(kind===1){p.fatigue=clamp(p.fatigue+20,0,100);notice=p.name+'が軽い疲労を訴えています'}else{p.exp+=30;notice=p.name+'が練習で手応えをつかみました'}s.events.unshift(s.year+'年 第'+s.game+'戦：'+notice);s.events=s.events.slice(0,35)}
function resolvePlate(batter,pitcher){let fatigue=pitcher?pitcher.fatigue:20,atk=(batter.contact-50)*.0016+(batter.condition-3)*.012-batter.fatigue*.00045,def=pitcher?(pitcher.control+pitcher.break-110)*.00045-fatigue*.00045:0,walk=Math.random()<clamp(.08+(batter.contact-50)*.00035,0.03,.15);if(walk)return 'BB';let strike=Math.random()<clamp(.19+(pitcher?pitcher.break-55:0)*.0012-atk*.25,.08,.36);if(strike)return 'SO';let hit=Math.random()<clamp(.255+atk-def,.09,.47);if(!hit)return 'OUT';let hrChance=clamp(.018+(batter.power-50)*.0011,0.003,.095);if(Math.random()<hrChance)return 'HR';let x=Math.random();return x<.72?'1B':x<.94?'2B':'3B'}
function simulateGame(){if(s.phase!=='regular')return;if(s.game>=143){finishSeason();return}let opp=1+rand(11),c=me(),other=s.clubs[opp],batters=c.order.map(id=>find(id)).filter(Boolean),pitcher=find(c.rotation[s.game%Math.max(1,c.rotation.length)]),enemyPitch=other.roster.find(p=>p.pos==='投')||other.roster[0];if(!batters.length||!pitcher){notice='打順と先発投手を設定してください';return}let inning=[],my=0,enemy=0,box=[],at=0;for(let inn=1;inn<=9;inn++){let runs=0,outs=0,bases=[false,false,false];while(outs<3){let b=batters[at++%batters.length],res=resolvePlate(b,enemyPitch);addStat(b,'g',0);if(res==='BB'){addStat(b,'bb');if(bases.every(Boolean))runs++;bases=[true,bases[0],bases[1]]}else{addStat(b,'ab');if(res==='SO'){addStat(b,'so');outs++}else if(res==='OUT')outs++;else{addStat(b,'h');let advance=res==='HR'?4:res==='3B'?3:res==='2B'?2:1;if(advance===4){runs+=1+bases.filter(Boolean).length;bases=[false,false,false];addStat(b,'hr')}else{let next=[false,false,false];for(let j=2;j>=0;j--)if(bases[j]){let dest=j+advance;if(dest>=3)runs++;else next[dest]=true}next[advance-1]=true;bases=next}addStat(b,'rbi',advance===4?1:Math.max(0,advance-1))}}if(outs>30)break}my+=runs;let e=Math.max(0,Math.round((other.roster.reduce((a,p)=>a+batScore(p),0)/other.roster.length-50)/15+3+(Math.random()+Math.random()-1)*4));let theirRuns=Math.max(0,Math.round(e/9+(Math.random()-.5)*3));enemy+=theirRuns;inning.push([runs,theirRuns]);box.push({inn,runs,theirRuns})}
if(my===enemy){if(Math.random()<.65)my++;else enemy++}if(my>enemy){c.w++;other.l++;addStat(pitcher,'win')}else if(my<enemy){c.l++;other.w++;addStat(pitcher,'loss')}else{c.d++;other.d++}addStat(pitcher,'ip',9);addStat(pitcher,'er',enemy);addStat(pitcher,'k',rand(8)+2);pitcher.fatigue=clamp(pitcher.fatigue+35,0,100);
batters.forEach(p=>{addStat(p,'g');p.exp+=3+rand(8);p.fatigue=clamp(p.fatigue+rand(8),0,100);if(p.exp>=100){p.exp-=100;p.level++;let k=pick(['contact','power','speed','field','arm']);p[k]=clamp(p[k]+(p.growth==='晩成'&&p.age>26?3:1)+c.coach);}});
for(let j=1;j<12;j++){if(j===opp)continue;let k=1+rand(11);if(j===k||k===opp)continue;if(Math.random()<.5)s.clubs[j].w++;else s.clubs[j].l++}
s.clubs.forEach(cl=>cl.roster.forEach(p=>{p.fatigue=clamp(p.fatigue-(p===pitcher?0:rand(5)),0,100);if(rand(6)===0)p.condition=clamp(p.condition+rand(3)-1,1,5)}));
s.game++;s.coins+=100+(my>enemy?100:0);c.finance+=40+(my>enemy?70:0);s.lastResult={opp,inning,my,enemy};s.logs.unshift({year:s.year,game:s.game,opp,my,enemy,inning});s.logs=s.logs.slice(0,30);event();if(s.game===143)finishSeason();save()}
function standings(start,end){return clubs.map((name,i)=>({name,i,c:s.clubs[i],pct:s.clubs[i].w/Math.max(1,s.clubs[i].w+s.clubs[i].l)})).slice(start,end).sort((a,b)=>b.pct-a.pct||b.c.w-a.c.w)}
function finishSeason(){s.phase='postseason';s.awards=(s.awards||[]);let leaders=me().roster.filter(p=>p.career.ab>0);if(leaders.length){let topH=leaders.slice().sort((a,b)=>batting(b).h-batting(a).h)[0],topHR=leaders.slice().sort((a,b)=>batting(b).hr-batting(a).hr)[0];s.awards.push({year:s.year,hit:topH.name,hr:topHR.name})}let a=standings(0,6),b=standings(6,12);let champA=postLeague(a),champB=postLeague(b),winner=rosterPower(s.clubs[champA])+rand(30)>rosterPower(s.clubs[champB])+rand(30)?champA:champB;s.champions.push({year:s.year,a:champA,b:champB,winner});s.clubs.forEach((c,i)=>{c.history.push({year:s.year,w:c.w,l:c.l,d:c.d,rank:standings(i<6?0:6,i<6?6:12).findIndex(x=>x.i===i)+1,champion:i===winner});});notice='シーズン終了！ 日本一：'+clubs[winner];}

const skillNames={contact:'ミート',power:'パワー',speed:'走力',field:'守備',arm:'肩力',control:'制球',break:'変化球',stamina:'スタミナ',velocity:'球速'};
function train(id,stat){let p=find(id),cost=250,skills=isPitch(p)?['control','break','stamina','velocity']:['contact','power','speed','field','arm'];if(!p||!skills.includes(stat))return;if(me().finance<cost)return alert('球団資金が不足');let before=p[stat],max=stat==='velocity'?165:99,gain=stat==='velocity'?1:2+me().coach;if(before>=max){notice=p.name+'の'+skillNames[stat]+'は上限です';render();return}me().finance-=cost;p[stat]=Math.min(max,before+gain);p.fatigue=clamp(p.fatigue+8,0,100);notice=p.name+'の'+skillNames[stat]+'が '+before+' → '+p[stat]+' に上昇！';save();render()}

if(tab==='lineup'){let batters=all().filter(p=>!isPitch(p)),pitchers=all().filter(isPitch);h+='<div class="box row"><h2>打順・投手ローテーション</h2><button data-action="auto">戦力優先で自動編成</button></div><div class="box"><h3>打順・守備位置</h3>'+c.order.map((id,i)=>{let p=find(id);return '<div class="line row">'+(i+1)+'番 '+(p?nameCell(p):'未設定')+'<select data-order="'+i+'">'+batters.map(x=>'<option value="'+x.id+'" '+(id===x.id?'selected':'')+'>'+x.name+' / '+x.pos+'</option>').join('')+'</select></div>'}).join('')+'</div><div class="box"><h3>先発5人ローテーション</h3>'+c.rotation.map((id,i)=>'<div class="line row">第'+(i+1)+'先発 '+(find(id)?.name||'未設定')+'<select data-rotation="'+i+'">'+pitchers.map(x=>'<option value="'+x.id+'" '+(id===x.id?'selected':'')+'>'+x.name+' / 疲労'+x.fatigue+'</option>').join('')+'</select></div>').join('')+'</div>'}

if(tab==='players'){h+='<div class="box"><h2>選手育成・能力</h2><p class="muted">二軍の選手も育成可能。コーチLvが成長量に影響します。1回250資金。</p></div><div class="box">'+all().slice().sort((a,b)=>Number(c.order.includes(b.id)||c.rotation.includes(b.id))-Number(c.order.includes(a.id)||c.rotation.includes(a.id))||batScore(b)-batScore(a)).map(p=>line(p,'<div class="training-controls"><span class="muted small">Lv'+p.level+' 経験'+p.exp+'</span><div class="training-buttons">'+(isPitch(p)?['control','break','stamina','velocity']:['contact','power','speed','field','arm']).map(k=>'<button data-train="'+p.id+':'+k+'" '+(p[k]>=(k==='velocity'?165:99)?'disabled':'')+'>'+skillNames[k]+' +</button>').join('')+'</div></div>')).join('')+'</div>'}
if(tab==='catalog'){
const assigned=new Map();s.clubs.forEach((club,i)=>{(club.roster||[]).forEach(p=>assigned.set(p.id,clubs[i]));(club.retired||[]).forEach(p=>assigned.set(p.id,'引退'))});
const normalizedSearch=catalogSearch.replace(/[\s　]/g,'').toLowerCase();const filtered=PLAYER_CATALOG.filter(p=>(!normalizedSearch||p.name.replace(/[\s　]/g,'').toLowerCase().includes(normalizedSearch))&&(catalogPosition==='all'||(catalogPosition==='pitcher'?p.pos==='投':p.pos!=='投'))&&(catalogRarity==='all'||p.rar===catalogRarity));
const pageSize=50,pages=Math.max(1,Math.ceil(filtered.length/pageSize));catalogPage=Math.min(catalogPage,pages-1);
h+='<div class="box"><h2> 選手名鑑（全1,000人）</h2><p class="muted">登録済みの固定選手データ。育成後の能力ではなく、初期能力を表示します。</p><div class="catalog-filters"><label> 名前検索<input id="catalogSearch" type="search" placeholder="例：田中" value="'+safeText(catalogSearch)+'" autocomplete="off"></label><button type="button" data-action="catalogSearchApply">検索する</button><label>ポジション<select id="catalogPosition"><option value="all">全選手</option><option value="pitcher">投手</option><option value="fielder">野手</option></select></label><label>レアリティ<select id="catalogRarity"><option value="all">すべて</option><option value="N">N</option><option value="R">R</option><option value="SR">SR</option><option value="SSR">SSR</option><option value="UR">UR</option></select></label></div><p>'+filtered.length+'人中 '+(filtered.length?catalogPage*pageSize+1:0)+'〜'+Math.min(filtered.length,(catalogPage+1)*pageSize)+'人を表示（'+(catalogPage+1)+' / '+pages+'ページ）</p>'+
table(['ID','選手名','守備','レア','年齢','ミート','パワー','走力','守備','肩','球速','制球','変化','スタミナ','所属'],filtered.slice(catalogPage*pageSize,(catalogPage+1)*pageSize).map(p=>[p.id.replace('catalog-',''),safeText(p.name),p.pos,p.rar,p.age,p.contact,p.power,p.speed,p.field,p.arm,p.velocity,p.control,p.break,p.stamina,safeText(assigned.get(p.id)||'未所属')]))+
'<div class="catalog-pages"><button data-catalog-page="prev" '+(catalogPage===0?'disabled':'')+'>前の50人</button><button data-catalog-page="next" '+(catalogPage===pages-1?'disabled':'')+'>次の50人</button></div></div>';

}
if(tab==='league'){let standingsTable=(a,b)=>table(['順位','球団','勝','敗','分','勝率'],standings(a,b).map((x,i)=>[i+1,x.name,x.c.w,x.c.l,x.c.d,x.pct.toFixed(3)]));let hitters=all().filter(p=>season(p).ab>0).sort((a,b)=>season(b).h-season(a).h);h+='<div class="box"><h2>リーグA</h2>'+standingsTable(0,6)+'</div><div class="box"><h2>リーグB</h2>'+standingsTable(6,12)+'</div><div class="box"><h2>年度別打撃成績</h2>'+table(['選手','試合','打率','本塁打','打点','通算安打'],hitters.map(p=>[p.name,season(p).g,average(p),season(p).hr,season(p).rbi,p.career.h]))+'</div><div class="box"><h2>投手成績</h2>'+table(['投手','投球回','防御率','勝','敗','奪三振'],all().filter(isPitch).map(p=>{let x=season(p);return[p.name,x.ip,x.ip?(x.er*9/x.ip).toFixed(2):'-.--',x.win,x.loss,x.k]}))+'</div>'}
if(tab==='office'){h+='<div class="box"><h2>マイチーム</h2><p>球団名：<b>'+safeText(clubs[0])+'</b></p><button data-action="editTeam">チーム名・カラー変更</button></div><div class="box"><h2>データ管理</h2><p class="muted">全データを削除して、チーム作成からやり直します。削除したデータは復元できません。</p><button data-action="resetGame"> 全データを削除</button></div>';h+='<div class="box"><h2>球団運営</h2><p>球団資金：'+fmt(c.finance)+' / コーチLv：'+c.coach+'</p><div class="grid"><button data-action="coach">コーチ強化 3000</button><button data-action="foreign">外国人選手 2500</button><button data-action="fa">FA補強 4500</button><button data-action="trade">トレード</button><button data-action="draft" '+(s.drafted?'disabled':'')+'>新人ドラフト（年1回）</button></div><p class="muted small">ドラフトは年1回、FA・外国人は球団資金を消費。トレードは自動交渉の簡易版です。</p></div><div class="box"><h2>二軍・控え選手</h2>'+all().filter(p=>!c.order.includes(p.id)&&!c.rotation.includes(p.id)).map(p=>line(p)).join('')+'</div><div class="box"><h2>選手年俸</h2>'+table(['選手','年俸'],all().slice().sort((a,b)=>b.salary-a.salary).map(p=>[p.name,fmt(p.salary)]))+'</div>'}
if(tab==='legacy'){h+='<div class="box"><h2>年度表彰（自球団）</h2>'+(s.awards||[]).map(x=>'<div class="line">'+x.year+'年 最多安打：'+x.hit+' / 本塁打王：'+x.hr+'</div>').join('')+'</div>';h+='<div class="box"><h2> 歴代日本一・CS</h2>'+s.champions.map(x=>'<div class="line">'+x.year+'年 CS勝者：'+clubs[x.a]+' / '+clubs[x.b]+'　日本一：<b>'+clubs[x.winner]+'</b></div>').join('')+'</div><div class="box"><h2>球団の歴史</h2>'+table(['年','勝','敗','順位','日本一'],c.history.map(x=>[x.year,x.w,x.l,x.rank,x.champion?'':'—']))+'</div><div class="box"><h2>引退・殿堂入り・永久欠番</h2>'+c.retired.map(p=>line(p,'<div><button data-hof="'+p.id+'" '+(p.hof?'disabled':'')+'>殿堂入り</button><button data-number="'+p.id+'">永久欠番</button></div>')).join('')+'<p class="muted">永久欠番：'+(c.numbers.map(x=>x.number+' '+x.name).join('、')||'なし')+'</p></div><div class="box"><h2>選手イベント</h2>'+s.events.slice(0,20).map(x=>'<div class="line">'+x+'</div>').join('')+'</div>'}
$('view').innerHTML=h;if(tab==='catalog'){$('catalogPosition').value=catalogPosition;$('catalogRarity').value=catalogRarity}}
document.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.catalogPage){catalogPage+=t.dataset.catalogPage==='next'?1:-1;catalogPage=Math.max(0,catalogPage);render();return}if(t.dataset.tab){tab=t.dataset.tab;notice='';render();if(tab==='home')window.scrollTo({top:0,behavior:'smooth'});return}if(t.dataset.draw){let [n,type]=t.dataset.draw.split(':');draw(+n,type,type==='free');return}if(t.dataset.train){let [id,k]=t.dataset.train.split(':');train(id,k);return}if(t.dataset.hof){hof(t.dataset.hof);return}if(t.dataset.number){permanent(t.dataset.number);return}let a=t.dataset.action;if(!a)return;if(a==='catalogSearchApply'){catalogSearch=$('catalogSearch')?.value||'';catalogPage=0;render();return}if(a==='resetGame'){resetGame();return}if(a==='editTeam'){showSetup(true);return}if(a==='play'||a==='play10'||a==='playall'){let n=a==='play'?1:a==='play10'?10:143-s.game;for(let i=0;i<n;i++)simulateGame()}else if(a==='auto')optimize();else if(a==='next')nextYear();else if(a==='coach'){if(me().finance>=3000){me().finance-=3000;me().coach++;notice='コーチLvアップ'}}else if(a==='foreign')signForeign();else if(a==='fa')fa();else if(a==='trade')trade();else if(a==='draft')draft();save();render()});
document.addEventListener('submit',e=>{if(e.target.id==='teamSetupForm'){e.preventDefault();finishSetup()}});document.addEventListener('input',e=>{if(e.target.id==='teamNameInput')updateTeamPreview();if(e.target.id==='catalogSearch'){catalogSearch=e.target.value;return}});document.addEventListener('keydown',e=>{if(e.target.id==='catalogSearch'&&e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();catalogSearch=e.target.value;catalogPage=0;render()}});
document.addEventListener('change',e=>{if(e.target.id==='teamColorInput')updateTeamPreview();if(e.target.id==='catalogSearch'){catalogSearch=e.target.value;catalogPage=0;render();return}if(e.target.id==='catalogPosition'){catalogPosition=e.target.value;catalogPage=0;render();return}if(e.target.id==='catalogRarity'){catalogRarity=e.target.value;catalogPage=0;render();return}if(e.target.dataset.order!==undefined)chooseOrder(+e.target.dataset.order,e.target.value);if(e.target.dataset.rotation!==undefined)chooseRotation(+e.target.dataset.rotation,e.target.value)});
render();
})();
