// Scale each original seeded skill relative to its own rarity cap instead of
// clipping the old 1–99 scores multiplied by 85. This preserves player identities,
// different skill profiles, and room for growth. Existing trained saves stay intact.
function setCatalogInitialAbilities(p){
 if(p.rar==='LR'||p.rar==='MR'||p.abilityScale===9999)return;
 const cap=capFor(p),base={N:43,R:55,SR:67,SSR:79,UR:89}[p.rar];
 const id=Number(p.id.slice(8))||1;
 let seed=(Math.imul(id,2654435761)^0x51a0beef)>>>0;
 const random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
 const overall=.58+random()*.25;
 const boosts={捕:'field',一:'power',二:'contact',三:'arm',遊:'field',左:'power',中:'speed',右:'arm',投:'control'};
 const traitBoost={'チャンス◎':'contact','対左◎':'contact','広角打法':'contact','パワーヒッター':'power','盗塁巧者':'speed','守備職人':'field','奪三振':'break','対ピンチ◎':'control','球持ち◎':'break','回復◎':'stamina'}[p.trait];
 for(const k of ABILITIES){
  let ratio=overall+(Number(p[k])-base)*.012+(random()-.5)*.05;
  if(k===boosts[p.pos])ratio+=.07;
  if(k===traitBoost)ratio+=.065;
  if(p.pos==='投'&&['contact','power','speed'].includes(k))ratio-=.22;
  if(p.pos!=='投'&&['control','break'].includes(k))ratio-=.26;
  p[k]=Math.round(cap*clamp(ratio,.12,.96));
 }
 p.abilityScale=9999;p.rarityCap2026=true;
}

function mrProgress(mission){
 const roster=all(),stats=roster.map(p=>({p,x:season(p)}));
 const any=fn=>stats.some(({p,x})=>fn(p,x));
 const era=x=>x.ip>0?x.er*9/x.ip:Infinity;
 const champions=s.champions.filter(x=>x.winner===0).length;
 const totalWins=s.clubs[0].history.filter(x=>x.year!==s.year).reduce((n,x)=>n+x.w,0)+me().w;
 const teamIP=stats.reduce((n,o)=>n+o.x.ip,0),teamER=stats.reduce((n,o)=>n+o.x.er,0);
 switch(mission){
 case 'ace':return any((p,x)=>x.win>=20&&x.ip>=90&&era(x)<2);
 case 'triple':return any((p,x)=>x.ab>=200&&x.h/x.ab>=.35&&x.hr>=40&&(x.sb||0)>=30);
 case 'dynasty':return champions>=3&&totalWins>=500;
 case 'strikeout':return any((p,x)=>x.k>=300);
 case 'era':return any((p,x)=>x.ip>=90&&era(x)<1);
 case 'saves':return any((p,x)=>x.sv>=50);
 case 'relief':return any((p,x)=>x.g>=50&&x.ip>=45&&era(x)<.5);
 case 'catcher':return s.champions.some(x=>x.year===s.year&&x.winner===0)&&teamIP>=90&&teamER*9/teamIP<2;
 case 'homers':return any((p,x)=>x.hr>=60);
 case 'hits':return any((p,x)=>x.h>=220);
 case 'steals80':return any((p,x)=>(x.sb||0)>=80);
 case 'rbi':return any((p,x)=>x.rbi>=150);
 case 'steals100':return any((p,x)=>(x.sb||0)>=100);
 case 'homers70':return any((p,x)=>x.hr>=70);
 case 'twoWay':return any((p,x)=>x.win>=10&&x.hr>=30);
 }return false;
}

 return p;

function battlePlayer(p,kind,i){
 const rar=Object.hasOwn(CAPS,p.rar)?p.rar:null;
 if(!rar)throw Error('選手のレアリティが不正です。');
 const pos=String(p.pos||'');
 if(kind==='pitch'&&pos!=='投'||kind==='bat'&& !['捕','一','二','三','遊','左','中','右','投'].includes(pos))throw Error('選手の守備位置が不正です。');
 const out={id:kind+i,name:String(p.name||'選手').slice(0,40),pos,rar,condition:3,fatigue:0};
 for(const k of ABILITIES){if(!Number.isFinite(p[k])||p[k]<1||p[k]>CAPS[rar])throw Error('選手能力が規定範囲外です。');out[k]=Math.round(p[k])}
 if(!Number.isFinite(p.velocity)||p.velocity<100||p.velocity>180)throw Error('球速が規定範囲外です。');
 out.velocity=Math.round(p.velocity);return out;
}
function battleSnapshot(team,club){
 const bats=club.order.map(id=>club.roster.find(p=>p.id===id)).filter(Boolean);
 const pitchers=club.rotation.map(id=>club.roster.find(p=>p.id===id)).filter(Boolean);
 if(!bats.length||!pitchers.length)throw Error('打順と先発投手を設定してください。');
 return {v:1,team:String(team).slice(0,24),bats:bats.slice(0,9).map((p,i)=>battlePlayer(p,'bat',i)),pitchers:pitchers.slice(0,5).map((p,i)=>battlePlayer(p,'pitch',i))};
}
function snapshotPower(t){return displayTeamPower(rosterPower({roster:[...t.bats,...t.pitchers],order:t.bats.map(p=>p.id),rotation:t.pitchers.map(p=>p.id)}))}
function encodeFriend(t){const bytes=new TextEncoder().encode(JSON.stringify(t));return 'PL1-'+btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decodeFriend(code){
 const raw=code.trim();if(raw.length>40000||!/^PL1-[A-Za-z0-9_-]+$/.test(raw))throw Error('正しい対戦コードを入力してください。');
 let o;try{o=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(atob(raw.slice(4).replace(/-/g,'+').replace(/_/g,'/')),ch=>ch.charCodeAt(0))))}catch(e){throw Error('対戦コードを読み込めません。')}
 if(o?.v!==1||typeof o.team!=='string'||!o.team.trim()||!Array.isArray(o.bats)||o.bats.length<1||o.bats.length>9||!Array.isArray(o.pitchers)||o.pitchers.length<1||o.pitchers.length>5)throw Error('球団データが不正です。');
 return {v:1,team:o.team.trim().slice(0,24),bats:o.bats.map((p,i)=>battlePlayer(p,'bat',i)),pitchers:o.pitchers.map((p,i)=>battlePlayer(p,'pitch',i))};
}
function friendHalf(bats,pitch,turn){
 let runs=0,outs=0,bases=[false,false,false],attempts=0;
 while(outs<3&&attempts++<120){
  const res=resolvePlate(bats[turn.i++%bats.length],pitch);
  if(res==='OUT'||res==='SO'){outs++;continue}
  if(res==='BB'){
   if(bases[0]){if(bases[1]){if(bases[2])runs++;bases[2]=true}bases[1]=true}bases[0]=true;continue;
  }
  const n=res==='HR'?4:res==='3B'?3:res==='2B'?2:1;
  const next=[false,false,false];
  for(let j=2;j>=0;j--)if(bases[j]){if(j+n>=3)runs++;else next[j+n]=true}
  if(n===4)runs++;else next[n-1]=true;
  bases=next;
 }
 return runs;
}
function simulateFriend(a,b){
 const pa=a.pitchers[0],pb=b.pitchers[0],ta={i:0},tb={i:0};let my=0,opp=0;const innings=[];
 for(let i=1;i<=12;i++){
  const x=friendHalf(a.bats,pb,ta);my+=x;
  if(i>=9&&opp>my){innings.push([x,null]);break}
  const y=friendHalf(b.bats,pa,tb);opp+=y;innings.push([x,y]);
  if(i>=9&&my!==opp)break;
 }
 return {team:a.team,opponent:b.team,my,opp,innings,stamp:new Date().toISOString()};
}
function friendAction(action){
 try{
  if(action==='friendGenerate'){friendCode=encodeFriend(battleSnapshot(clubs[0],me()));notice='対戦コードを発行しました。';render();return}
  if(action==='friendCopy'){
   const input=$('friendShare');if(!input?.value)return;input.focus();input.select();
   if(navigator.clipboard?.writeText)navigator.clipboard.writeText(input.value).then(()=>{$('friendCopyStatus').textContent='コピーしました'}).catch(()=>{$('friendCopyStatus').textContent='選択したコードを手動でコピーしてください'});
   else $('friendCopyStatus').textContent='選択したコードを手動でコピーしてください';return;
  }
  if(action==='friendLoad'){friendOpponent=decodeFriend($('friendInput').value);friendLast=null;notice='相手球団を読み込みました。';render();return}
  if(action==='friendPlay'){
   if(!friendOpponent)throw Error('先に相手の対戦コードを読み込んでください。');
   friendLast=simulateFriend(battleSnapshot(clubs[0],me()),friendOpponent);
   s.friendHistory=[friendLast,...(Array.isArray(s.friendHistory)?s.friendHistory:[])].slice(0,30);
   save();notice='フレンド対戦終了！';render();return;
  }
 }catch(e){const error=$('friendError');if(error)error.textContent=e.message||'処理に失敗しました。'}
}

 }
 if(friendLast){const x=friendLast;html+='<div class="box"><h2>試合結果：'+(x.my===x.opp?'引き分け':x.my>x.opp?'勝利':'敗北')+'</h2><div class="friend-score">'+safeText(x.team)+' '+x.my+' − '+x.opp+' '+safeText(x.opponent)+'</div>'+table(['球団',...x.innings.map((v,i)=>i+1),'計'],[[safeText(x.team),...x.innings.map(v=>v[0]),x.my],[safeText(x.opponent),...x.innings.map(v=>v[1]===null?'X':v[1]),x.opp]])+'</div>'}
 const history=Array.isArray(s.friendHistory)?s.friendHistory:[];
 html+='<div class="box"><h2>対戦履歴（端末内）</h2>'+(history.length?table(['対戦相手','スコア','結果'],history.map(x=>[safeText(x.opponent),x.my+' − '+x.opp,x.my>x.opp?'勝利':x.my<x.opp?'敗北':'引分'])):'<p class="muted">まだ対戦していません。</p>')+'</div>';
 return html;
}

function season(p){return batting(p)}
function average(p){let x=season(p);return x.ab?(x.h/x.ab).toFixed(3):'.---'}
function skillLabel(p){return isPitch(p)?'球速'+p.velocity+' 制球'+p.control+' 変化'+p.break+' 体力'+p.stamina:'ミート'+p.contact+' パワー'+p.power+' 走力'+p.speed+' 守備'+p.field+' 肩'+p.arm}
function nameCell(p){return '<b class="'+p.rar+'">'+p.rar+'</b> '+p.name+' <span class="tag">'+p.pos+'</span>'}
function line(p,extra=''){return '<div class="line row"><div>'+nameCell(p)+' <span class="muted small">'+p.age+'歳 '+p.growth+'型</span><div class="muted small">'+skillLabel(p)+' / '+p.trait+' / 調子'+p.condition+' 疲労'+p.fatigue+'</div></div>'+extra+'</div>'}
function day(){return new Date().toISOString().slice(0,10)}
function draw(n,type='normal',free=false){let cost=free?0:n===10?2700:300;if(!free&&s.coins<cost){notice='コインが足りません';render();return}if(free&&s.daily===day()){notice='本日の無料ガチャは使用済みです';render();return}if(free)s.daily=day();s.coins-=cost;drawn=[];for(let i=0;i<n;i++){let forced=null;if(type==='limited'&&rand(100)<10)forced='SSR';if(s.pity>=99)forced='UR';if(n===10&&i===9&&!drawn.some(p=>['SR','SSR','UR','LR'].includes(p.rar)))forced='SR';let position=type==='pitcher'?'投':type==='fielder'?'野手':null,p=newPlayer(forced,position);if(!p)break;drawn.push(p);me().roster.push(p);s.pity=['UR','LR'].includes(p.rar)?0:s.pity+1}if(!drawn.length){s.coins+=cost;if(free)s.daily='';notice='選手データベースに獲得可能な選手がいません'}else{if(drawn.length<n)s.coins+=Math.round(cost*(n-drawn.length)/n);notice=drawn.length+'人獲得！'+(drawn.length<n?'（残りの選手が不足）':'')}save();render()}
function chooseOrder(slot,id){let c=me();if(c.order.includes(id)){let prev=c.order.indexOf(id);[c.order[prev],c.order[slot]]=[c.order[slot],c.order[prev]]}else c.order[slot]=id;save();render()}
function chooseRotation(slot,id){let c=me();if(c.rotation.includes(id)){let prev=c.rotation.indexOf(id);[c.rotation[prev],c.rotation[slot]]=[c.rotation[slot],c.rotation[prev]]}else c.rotation[slot]=id;save();render()}
function optimize(){let c=me(),batters=c.roster.filter(p=>!isPitch(p)).sort((a,b)=>batScore(b)-batScore(a));c.order=batters.slice(0,8).map(p=>p.id);c.rotation=c.roster.filter(isPitch).sort((a,b)=>armScore(b)-armScore(a)).slice(0,5).map(p=>p.id);save();render()}
function event(){if(rand(10)>1)return;let p=pick(all()),kind=rand(3);if(kind===0){p.condition=5;notice=p.name+'が絶好調に！'}else if(kind===1){p.fatigue=clamp(p.fatigue+20,0,100);notice=p.name+'が軽い疲労を訴えています'}else{p.exp+=30;notice=p.name+'が練習で手応えをつかみました'}s.events.unshift(s.year+'年 第'+s.game+'戦：'+notice);s.events=s.events.slice(0,35)}
function resolvePlate(batter,pitcher){let fatigue=pitcher?pitcher.fatigue:20,atk=(baseRating(batter.contact)-50)*.0016+(batter.condition-3)*.012-batter.fatigue*.00045,def=pitcher?(baseRating(pitcher.control)+baseRating(pitcher.break)-110)*.00045-fatigue*.00045:0,walk=Math.random()<clamp(.08+(baseRating(batter.contact)-50)*.00035,0.03,.15);if(walk)return 'BB';let strike=Math.random()<clamp(.19+(pitcher?baseRating(pitcher.break)-55:0)*.0012-atk*.25,.08,.36);if(strike)return 'SO';let hit=Math.random()<clamp(.255+atk-def,.09,.47);if(!hit)return 'OUT';let hrChance=clamp(.018+(baseRating(batter.power)-50)*.0011,0.003,.095);if(Math.random()<hrChance)return 'HR';let x=Math.random();return x<.72?'1B':x<.94?'2B':'3B'}
function simulateGame(scheduledOpp=null){if(s.phase!=='regular')return;if(s.game>=143){finishSeason();return}let opp=scheduledOpp||1+rand(11),c=me(),other=s.clubs[opp],batters=c.order.map(id=>find(id)).filter(Boolean),pitcher=find(c.rotation[s.game%Math.max(1,c.rotation.length)]),enemyPitch=other.roster.find(p=>p.pos==='投')||other.roster[0];if(!batters.length||!pitcher){notice='打順と先発投手を設定してください';return}let inning=[],my=0,enemy=0,box=[],at=0;for(let inn=1;inn<=9;inn++){let runs=0,outs=0,bases=[false,false,false];while(outs<3){let b=batters[at++%batters.length],res=resolvePlate(b,enemyPitch);addStat(b,'g',0);if(res==='BB'){addStat(b,'bb');if(bases.every(Boolean))runs++;bases=[true,bases[0],bases[1]]}else{addStat(b,'ab');if(res==='SO'){addStat(b,'so');outs++}else if(res==='OUT')outs++;else{addStat(b,'h');if(res!=='HR'&&res!=='3B'&&res!=='2B'&&Math.random()<Math.min(.48,baseRating(b.speed)/220)){addStat(b,'sb');}let advance=res==='HR'?4:res==='3B'?3:res==='2B'?2:1;if(advance===4){runs+=1+bases.filter(Boolean).length;bases=[false,false,false];addStat(b,'hr')}else{let next=[false,false,false];for(let j=2;j>=0;j--)if(bases[j]){let dest=j+advance;if(dest>=3)runs++;else next[dest]=true}next[advance-1]=true;bases=next}addStat(b,'rbi',advance===4?1:Math.max(0,advance-1))}}if(outs>30)break}my+=runs;let e=Math.max(0,Math.round((other.roster.reduce((a,p)=>a+batScore(p),0)/other.roster.length-50)/15+3+(Math.random()+Math.random()-1)*4));let theirRuns=Math.max(0,Math.round(e/9+(Math.random()-.5)*3));enemy+=theirRuns;inning.push([runs,theirRuns]);box.push({inn,runs,theirRuns})}
if(my===enemy){if(Math.random()<.65)my++;else enemy++}if(my>enemy){c.w++;other.l++;addStat(pitcher,'win')}else if(my<enemy){c.l++;other.w++;addStat(pitcher,'loss')}else{c.d++;other.d++}addStat(pitcher,'ip',9);addStat(pitcher,'er',enemy);addStat(pitcher,'k',rand(8)+2);addStat(pitcher,'g');pitcher.fatigue=clamp(pitcher.fatigue+35,0,100);
batters.forEach(p=>{addStat(p,'g');p.exp+=3+rand(8);p.fatigue=clamp(p.fatigue+rand(8),0,100);if(p.exp>=100){p.exp-=100;p.level++;let k=pick(['contact','power','speed','field','arm']);p[k]=Math.min(capFor(p),p[k]+((p.growth==='晩成'&&p.age>26?3:1)+c.coach)*8);}});
for(let j=1;j<12;j++){if(j===opp)continue;let k=1+rand(11);if(j===k||k===opp)continue;if(Math.random()<.5)s.clubs[j].w++;else s.clubs[j].l++}
s.clubs.forEach(cl=>cl.roster.forEach(p=>{p.fatigue=clamp(p.fatigue-(p===pitcher?0:rand(5)),0,100);if(rand(6)===0)p.condition=clamp(p.condition+rand(3)-1,1,5)}));
refreshMRUnlocks();s.game++;s.coins+=100+(my>enemy?100:0);c.finance+=40+(my>enemy?70:0);s.lastResult={opp,inning,my,enemy};s.logs.unshift({year:s.year,game:s.game,opp,my,enemy,inning});s.logs=s.logs.slice(0,30);event();if(s.game===143)finishSeason();save()}
function standings(start,end){return clubs.map((name,i)=>({name,i,c:s.clubs[i],pct:s.clubs[i].w/Math.max(1,s.clubs[i].w+s.clubs[i].l)})).slice(start,end).sort((a,b)=>b.pct-a.pct||b.c.w-a.c.w)}
function finishSeason(){s.phase='postseason';s.awards=(s.awards||[]);let leaders=me().roster.filter(p=>p.career.ab>0);if(leaders.length){let topH=leaders.slice().sort((a,b)=>batting(b).h-batting(a).h)[0],topHR=leaders.slice().sort((a,b)=>batting(b).hr-batting(a).hr)[0];s.awards.push({year:s.year,hit:topH.name,hr:topHR.name})}let a=standings(0,6),b=standings(6,12);let champA=postLeague(a),champB=postLeague(b),winner=rosterPower(s.clubs[champA])+rand(30)>rosterPower(s.clubs[champB])+rand(30)?champA:champB;s.champions.push({year:s.year,a:champA,b:champB,winner});s.clubs.forEach((c,i)=>{c.history.push({year:s.year,w:c.w,l:c.l,d:c.d,rank:standings(i<6?0:6,i<6?6:12).findIndex(x=>x.i===i)+1,champion:i===winner});});refreshMRUnlocks();notice='シーズン終了！ 日本一：'+clubs[winner];}

async function profileHash(password,salt){
 const encoder=new TextEncoder(),key=await crypto.subtle.importKey('raw',encoder.encode(password),'PBKDF2',false,['deriveBits']);
 const bytes=await crypto.subtle.deriveBits({name:'PBKDF2',salt:encoder.encode(salt),iterations:210000,hash:'SHA-256'},key,256);
 return Array.from(new Uint8Array(bytes),b=>b.toString(16).padStart(2,'0')).join('');
}
function activateProfile(id,data){

 const my=r.inning.slice(0,played).reduce((a,v)=>a+v[0],0),enemy=r.inning.slice(0,played).reduce((a,v)=>a+v[1],0);

 $('matchCommentary').textContent=complete?'試合終了。'+(r.my>r.enemy?'勝利しました。':r.my<r.enemy?'敗戦しました。':'引き分けです。'):'第'+(played+1)+'回の攻防。'+(played?'ここまで '+my+' 対 '+enemy+'。':'プレーボール！');

 if(b)b.textContent=complete?'次の試合へ':'次のイニング';
}

}

}if(a==='play'||a==='play10'||a==='playall'){pendingGames=a==='play'?1:a==='play10'?10:Math.max(0,143-s.game);$('skipChoiceDetail').textContent=pendingGames+'試合を進行します。現在はどちらを選んでも結果と進行方法は同じです。';$('skipChoice').hidden=false;return}else if(a==='cancelSkip'){$('skipChoice').hidden=true;pendingGames=0;return}else if(a==='confirmSkip'||a==='confirmWatch'){$('skipChoice').hidden=true;let n=pendingGames;pendingGames=0;watchQueue=[];for(let i=0;i<n;i++){let previous=s.game;simulateGame();if(a==='confirmWatch'&&s.game>previous&&s.lastResult)watchQueue.push({...s.lastResult,inning:s.lastResult.inning.map(x=>x.slice())})}if(a==='confirmWatch'&&watchQueue.length)showWatch()}else if(a==='nextInning'){advanceWatch();return}else if(a==='watchToEnd'){if(watchActive){watchInning=9;updateWatch()}return}else if(a==='closeWatch'){finishWatch();return}else if(a==='auto')optimize();else if(a==='next')nextYear();else if(a==='coach'){if(me().finance>=3000){me().finance-=3000;me().coach++;notice='コーチLvアップ'}}else if(a==='foreign')signForeign();else if(a==='fa')fa();else if(a==='trade')trade();else if(a==='draft')draft();save();render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeGameChoices();if(!$('skipChoice').hidden){$('skipChoice').hidden=true;pendingGames=0}}if((e.key==='ArrowDown'||e.key==='ArrowUp')&&e.target.matches('.choice-current')){e.preventDefault();const menu=document.getElementById(e.target.dataset.choiceToggle+'Choices');if(menu?.hidden)e.target.click();const options=menu?.querySelectorAll('.choice-option');if(options?.length)options[e.key==='ArrowDown'?0:options.length-1].focus()}});
document.addEventListener('submit',e=>{if(e.target.id==='profileForm'){e.preventDefault();submitProfile();return}if(e.target.id==='teamSetupForm'){e.preventDefault();finishSetup()}});document.addEventListener('input',e=>{if(e.target.id==='teamNameInput')updateTeamPreview();if(e.target.id==='catalogSearch'){catalogSearch=e.target.value;return}});document.addEventListener('keydown',e=>{if(e.target.id==='catalogSearch'&&e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();catalogSearch=e.target.value;catalogPage=0;render()}});
document.addEventListener('change',e=>{if(e.target.id==='trainingSort'){trainingSort=e.target.value;render();return}if(e.target.id==='teamColorInput')updateTeamPreview();if(e.target.id==='catalogSearch'){catalogSearch=e.target.value;catalogPage=0;render();return}if(e.target.id==='catalogPosition'){catalogPosition=e.target.value;catalogPage=0;render();return}if(e.target.id==='catalogRarity'){catalogRarity=e.target.value;catalogPage=0;render();return}if(e.target.dataset.order!==undefined)chooseOrder(+e.target.dataset.order,e.target.value);if(e.target.dataset.rotation!==undefined)chooseRotation(+e.target.dataset.rotation,e.target.value)});
render();
})();
