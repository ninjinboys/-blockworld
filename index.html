<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#78aee0">
<title>Blockworld</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game"></div>
<div id="crosshair"></div>
<div id="hud">
  <div id="stats"><div id="coords">X 0 Y 0 Z 0</div><div id="biome">Plains</div><div id="clock">☀ 06:00</div><div id="weather">Clear</div></div>
  <div id="hint">WASD 移動 / Space ジャンプ / 左クリック 採掘 / 右クリック 設置 / R 雨</div>
  <div id="message"></div>
  <div id="hotbar"></div>
</div>
<div id="mobile">
  <div class="pad"><button class="up">▲</button><button class="left">◀</button><button class="down">▼</button><button class="right">▶</button></div>
  <button class="jump">JUMP</button>
  <div id="tapbar"><button id="tapMine">採掘</button><button id="tapPlace">設置</button></div>
</div>
<div id="startCover">
  <div class="panel">
    <h1>BLOCKWORLD</h1>
    <p>3Dボクセル世界を探索し、ブロックを壊して置くことができます。</p>
    <p>森・砂漠・雪山・海・川・洞窟・鉱石・動物・昼夜・雨を生成します。</p>
    <button id="startBtn">世界に入る</button>
    <div id="loading">世界を生成中...</div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
