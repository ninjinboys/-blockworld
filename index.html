<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#78aee0">
<title>Blockworld</title>
<link rel="stylesheet" href="style.css?v=20261007g">
</head>
<body>
<div id="game"></div>
<div id="crosshair"></div><div id="breakMeter"><div id="breakLabel"></div><div id="breakTrack"><div id="breakFill"></div></div></div>
<div id="hud">
  <div id="stats"><div id="coords">X 0 Y 0 Z 0</div><div id="biome">Plains</div><div id="clock">☀ 06:00</div><div id="weather">Clear</div></div>
  <div id="progress">
    <div class="xp-row"><strong id="levelText">LV 1</strong><span id="xpText">0 / 20 XP</span></div>
    <div id="xpTrack"><div id="xpFill"></div></div>
    <div id="blueprintText">次の設計図：木材（LV 2）</div>
  </div>
  <div id="hint">WASD 移動 / Space ジャンプ / 左クリック長押し 攻撃/採掘 / 右クリック 設置 / C クラフト / R 雨</div>
  <div id="message"></div>
  <div id="hotbar"></div>
</div>
<div id="mobile">
  <div class="pad"><button class="up">▲</button><button class="left">◀</button><button class="down">▼</button><button class="right">▶</button></div>
  <button class="jump">JUMP</button>
  <div id="tapbar"><button id="tapMine">長押し採掘</button><button id="tapPlace">設置</button><button id="tapCraft">CRAFT</button></div>
</div>
<div id="crafting" aria-hidden="true">
  <div class="craft-panel">
    <div class="craft-head">
      <div>
        <div class="craft-title">CRAFTING</div>
        <div class="craft-sub">レベルアップで設計図を獲得する</div>
      </div>
      <button id="craftClose" aria-label="閉じる">×</button>
    </div>
    <div id="craftInventory"></div>
    <div id="recipeList"></div>
    <div class="craft-help">Cキーで開閉 / 採掘や動物討伐でXPを獲得</div>
  </div>
</div>
<div id="startCover">
  <div class="panel">
    <h1>BLOCKWORLD</h1>
    <p>持ち物ゼロから開始。採掘や動物討伐で経験値を稼ぎ、クラフト設計図を解放します。</p>
    <p>森・砂漠・雪山・海・川・洞窟・鉱石・動物・昼夜・雨を生成します。</p>
    <button id="startBtn">世界に入る</button>
    <div id="loading">世界を生成中...</div>
  </div>
</div>
<script type="module" src="app.js?v=20261007h"></script>
</body>
</html>
