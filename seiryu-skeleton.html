bounce.position.set(13,9,-17);scene.add(bounce);
const boneMaterial=[0xd5bca1,0xe5cdb0,0xb99f84,0xf1dec3,0xaa9279].map(color=>
 new THREE.MeshStandardMaterial({color,roughness:.79,metalness:0,side:THREE.DoubleSide}));
const darkMat=new THREE.MeshStandardMaterial({color:0x110f11,roughness:.92,side:THREE.DoubleSide});
const root=new THREE.Group();root.name='NEXACRAFT_SEIRYU_NEW_SKELETON_ONLY';scene.add(root);
const P=(x,y,z=0)=>new THREE.Vector3(x,y,z), Y=P(0,1),Z=P(0,0,1);
const quat=new THREE.Quaternion();
let modelMeshes=0, ribs=0;
function add(g,m=0,parent=root){
 const obj=new THREE.Mesh(g,typeof m==='number'?boneMaterial[m%boneMaterial.length]:m);
 obj.castShadow=false;parent.add(obj);if(parent!==scene)modelMeshes++;return obj;
}
function ball(p,scale,color=0,parent=root,facets=1){
 const obj=add(new THREE.IcosahedronGeometry(1,facets),color,parent);
 obj.position.copy(p);obj.scale.set(...scale);return obj;
}
function bone(a,b,rA,rB,color=0,parent=root){
 const v=b.clone().sub(a),len=v.length();
 if(len<1e-4)return;
 const m=add(new THREE.CylinderGeometry(rB,rA,len,8,1),color,parent);
 m.position.copy(a).add(b).multiplyScalar(.5);
 m.quaternion.setFromUnitVectors(Y,v.normalize());
 return m;
}
function curved(pts,r=.14,color=0,parent=root,tipFactor=.26){
 const curve=new THREE.CatmullRomCurve3(pts,false,'catmullrom',.4);
 const N=Math.max(12,pts.length*8),S=8;
 const frames=curve.computeFrenetFrames(N,false),v=[],ids=[];
 for(let i=0;i<=N;i++){
  let t=i/N,c=curve.getPoint(t);
  const fade=tipFactor+(1-tipFactor)*Math.pow(Math.sin(Math.PI*Math.max(.015,Math.min(.985,t))),.30);
  for(let j=0;j<S;j++){
   const a=j*2*Math.PI/S;
   const off=frames.normals[i].clone().multiplyScalar(Math.cos(a))
     .addScaledVector(frames.binormals[i],Math.sin(a));
   const p=c.clone().addScaledVector(off,r*fade);
   v.push(p.x,p.y,p.z);
  }
 }
 for(let i=0;i<N;i++)for(let j=0;j<S;j++){
  const a=i*S+j,b=i*S+(j+1)%S,c=(i+1)*S+j,d=(i+1)*S+(j+1)%S;
  ids.push(a,c,b,b,c,d);
 }

 g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setIndex(ids);g.computeVertexNormals();
 return add(g,color,parent);
}
function branch(pts,startRadius=.20,color=1,parent=root){
 for(let i=1;i<pts.length;i++){
  const r=startRadius*Math.pow(1-(i-1)/pts.length,.85);
  bone(pts[i-1],pts[i],r,Math.max(.012,r*.69),color,parent);
  if(i<pts.length-1)ball(pts[i],[r*.91,r*.88,r*.91],color,parent,0);
 }
}
// All anatomy below derives from NEW pose landmarks built for the supplied
// osteology reference: upright neck, horizontally long expanded rib cage,
// single raised S-tail. None of the previous skeleton's coordinates are reused.
// R62 / COMPLETELY REBUILT TORSO, independent new geometry.
// A single dorsal spinal axis with a physically CONNECTED rib basket.
// No vestigial hanging spear-like "ribs" and no ribs along the actual tail.
const landmark={
 atlas:P(-11.62,10.17,0),
 neckUpper:P(-10.38,8.31,0),
 neckLower:P(-8.58,5.68,0),
 shoulderRoot:P(-7.25,4.79,0),
 chestFront:P(-5.66,4.93,-.02),
 chestQuarter:P(-3.05,5.73,-.11),
 thoraxCrest:P(.15,6.96,-.18),
 thoraxRear:P(3.10,7.38,-.23),
 tailRoot:P(5.85,7.05,-.21),
 tailDescent:P(8.47,4.75,-.10),
 tailTrough:P(10.82,3.92,.10),
 tailCurl:P(13.57,4.83,.19),
 tailUp:P(15.65,7.80,.16),
 tailEnd:P(15.88,11.30,.10)

 const t=i/COUNT,p=spine.getPoint(t),tan=spine.getTangent(t).normalize();
 // Upward-looking vertebrae. Local dorsal normals never flip at tail bends.
 let dorsal=P(-tan.y,tan.x,0).normalize();
 if(dorsal.y<0)dorsal.negate();

 if(i){
  const pre=spineFrames[i-1];
  const thickness=t<.67?.16:Math.max(.045,.16*(1-t)/.33);
  bone(pre.pos,p,thickness,thickness*.96,i%9===0?1:0);
 }
}

for(let i=2;i<COUNT-1;i+=3){
 const f=spineFrames[i],t=f.t,section=t<.23?0:t<.67?1:2;
 const radius=section===0?.23:section===1?.25:Math.max(.085,.23*(1-t)/.33);
 const centrum=ball(f.pos,[radius*1.2,radius*.82,radius],i%4===0?1:0,root,0);
 centrum.quaternion.setFromUnitVectors(Y,f.tan);
 if(section!==2){
  const length=section===0?.60:.82;
  const base=f.pos.clone().addScaledVector(f.dorsal,.15);
  const apex=base.clone().addScaledVector(f.dorsal,length).addScaledVector(f.tan,-.22);
  curved([base,base.clone().lerp(apex,.47),apex],section===0?.17:.21,1,root,.09);
  for(const s of [-1,1]){
    const transverse=f.pos.clone().addScaledVector(Z,s*(section===0?.38:.56));
    bone(f.pos,transverse,.145,.022,2);
  }
 }else if(i%2===0){
  const process=f.pos.clone().addScaledVector(f.dorsal,.31*(1-t)/.33);
  bone(f.pos,process,Math.max(.045,radius*.46),.012,1);
  for(const s of [-1,1]){
   const p=f.pos.clone().addScaledVector(Z,s*.36*(1-t)/.33);
   bone(f.pos,p,Math.max(.055,radius*.47),.014,2);
  }
 }
}
// Thorax anatomical stations use measured backbone positions, not arbitrary t range.
// Rib ends connect to one keel and turn sideways around a wide, long chest.
const stations=[];
for(let x=-6.95;x<=11.0;x+=.82){
 let pick=null,d=Infinity;
 for(let i=20;i<115;i++){
  const f=spineFrames[i];
  if(f.pos.x < -7.45||f.pos.x>12.1)continue;
  const delta=Math.abs(f.pos.x-x);
  if(delta<d){d=delta;pick=f;}
 }
 if(!pick)continue;

 // Wide chest in the middle, tapered shoulders and tail root.
 const bloom=Math.pow(Math.sin(Math.PI*(.06+u*.87)),.60);
 const width=.46+.72*bloom;
 const depth=.72+.88*bloom;
 // Cartilaginous keel is central, directly UNDER the dorsal spine.
 const sternum=pick.pos.clone().add(P(.64,-depth,.0));
 stations.push({x,u,spine:pick.pos.clone(),width,depth,sternum});
}

// This is the missing structural feature in the former comb-shaped torso.
const keelPath=stations.map(s=>s.sternum);
curved(keelPath,.11,4,root,.82);
for(let i=0;i<stations.length;i++){
 const s=stations[i];
 const t=s.u,back=t>.72;
 // Extend ribs backwards slightly to make a sculpted, swept-back cage.
 const sweep=back?.48:.29;
 for(const sign of [-1,1]){
  const A=s.spine.clone().add(P(0,.03,sign*.13));
  const B=s.spine.clone().add(P(-.13,.22,sign*s.width*.65));
  const C=s.spine.clone().add(P(.01,-s.depth*.30,sign*s.width*1.02));
  const D=s.spine.clone().add(P(sweep,-s.depth*.72,sign*s.width*.82));

  curved([A,B,C,D,E],(.095+.025*Math.sin(Math.PI*t)),i%3===0?1:0,root,.65);

  ball(A,[.19,.16,.18],1,root,0);

 }
}
// Costal bridges create lateral cage continuity, rather than floating isolated arcs.
for(const sign of [-1,1]){
 const cross=[];
 for(let i=0;i<stations.length;i+=2){
  const s=stations[i];
  cross.push(s.spine.clone().add(P(.18,-s.depth*.72,sign*s.width*.82)));

}

// never from stacked crocodile-shaped ellipsoids or previous skull algorithm.
const head=new THREE.Group();head.name='HAND_BUILT_OPEN_CRANIUM';root.add(head);

const jawHinge=C(-11.40,9.54,0);
const lowerTip=C(-15.85,7.00,0);

 [C(-14.10,10.22,0),[1.10,.62,1.06]],

         C(-14.05,8.55,s*.76),C(-15.65,8.54,s*.39)],.26,1,head,.72);

 const h=C(-12.64,11.02,s*.77);
 branch([h,C(-12.35,12.18,s*1.10),C(-11.36,13.43,s*1.41),

 branch([C(-12.35,12.18,s*1.10),C(-12.87,13.31,s*1.51),

  1.10+(1-Math.abs(a))*.68,a*1.80));

canvas.addEventListener('pointerdown',e=>{touch.set(e.pointerId,[e.clientX,e.clientY]);canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{
 const prev=touch.get(e.pointerId);if(!prev)return;
 touch.set(e.pointerId,[e.clientX,e.clientY]);
 if(touch.size===1){azimuth-=(e.clientX-prev[0])*.006;altitude=Math.max(-1.1,Math.min(1.12,altitude+(e.clientY-prev[1])*.0048));rotation=false}
 else if(touch.size===2){
  const p=[...touch.values()],span=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);
  if(lastSpan)range=Math.max(5,Math.min(160,range*lastSpan/span));lastSpan=span;
 }
});
for(const k of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(k,e=>{touch.delete(e.pointerId);lastSpan=0});
canvas.addEventListener('wheel',e=>{e.preventDefault();range=Math.max(5,Math.min(160,range*(1+Math.sign(e.deltaY)*.11)))},{passive:false});
function resize(){rend.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();if(mode!=='skull')range=fit()}
addEventListener('resize',resize);resize();preset('threequarter');
el('status').style.display='none';
window.seiryuSkeletonReady=true;window.seiryuSkeletonMeshCount=modelMeshes;
window.seiryuSkeletonRevision='R69_REBUILT_FACE_ANATOMY';
window.seiryuAnatomy={vertebrae:COUNT,ribs,legs:2,tails:1,oldRigReused:false,torsoGeometry:'connected basket keel v2'};
el('export').onclick=()=>{
 const btn=el('export');btn.disabled=true;btn.textContent='GLB生成中…';
 new GLTFExporter().parse(root,buffer=>{
  const blob=new Blob([buffer],{type:'model/gltf-binary'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='NEXACRAFT_Seiryu_ZeroBase_Skeleton.glb';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  btn.disabled=false;btn.textContent='GLB保存';
 },e=>{console.error(e);btn.disabled=false;btn.textContent='GLB保存';},{binary:true});
};
let lastFrame=0;
function animate(now=0){
 requestAnimationFrame(animate);
 if(document.hidden)return;
 if(isMobile && now-lastFrame<32)return;
 lastFrame=now;
 if(rotation)azimuth+=.0017;
 const cos=Math.cos(altitude);
 camera.position.set(target.x+range*Math.sin(azimuth)*cos,
 target.y+range*Math.sin(altitude),target.z+range*Math.cos(azimuth)*cos);
 camera.lookAt(target);rend.render(scene,camera);
}
animate();
</script></body></html>
