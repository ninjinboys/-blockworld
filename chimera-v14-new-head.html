for(const k of ['walk','roar','tail'])document.getElementById(k).onclick=()=>{actions[k]=performance.now()/1000+({walk:7,roar:2.5,tail:2}[k]);document.querySelectorAll('#attacks button').forEach(b=>b.classList.toggle('active',b.id===k));};
document.querySelectorAll('#move button').forEach(b=>{const k=b.dataset.d;b.addEventListener('pointerdown',e=>{b.setPointerCapture(e.pointerId);keys.add(k)});for(const e of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(e,()=>keys.delete(k))});
window.addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if('wasd'.includes(e.key.toLowerCase()))e.preventDefault()});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
let down=null,lastX=0;C.addEventListener('pointerdown',e=>{down=e.pointerId;lastX=e.clientX;C.setPointerCapture(e.pointerId)});C.addEventListener('pointermove',e=>{if(down!==e.pointerId)return;orbit+=(e.clientX-lastX)*.008;lastX=e.clientX});C.addEventListener('pointerup',()=>down=null);C.addEventListener('wheel',e=>{camDist=Math.max(7,Math.min(18,camDist+e.deltaY*.015));e.preventDefault()},{passive:false});
let last=0,feet=0,bossWalk=0,hitShake=0;
function drawBatch(b,model,unlit=0){if(!b.count)return;gl.uniformMatrix4fv(U.model,false,model);gl.uniform1f(U.unlit,unlit);gl.bindVertexArray(b.va);gl.drawElementsInstanced(gl.TRIANGLES,36,gl.UNSIGNED_SHORT,0,b.count)}
const resetCamera=(t)=>{let p,targ;
 if(mode==='face'){let d=6.9;p=[Math.sin(orbit)*d,4.65+angleLift,-3.3-Math.cos(orbit)*d];targ=[0,3.39,-3.13];}
 else if(mode==='side'){p=[12,5.1,0.3];targ=[0,2.8,.35];}
 else if(mode==='back'){p=[.2,5.2,11.7];targ=[0,2.8,.65];}
 else {let d=camDist;p=[Math.sin(orbit)*d,5.0+angleLift,-Math.cos(orbit)*d+1.4];targ=[0,2.78,.36];}
 return lookAt(p,targ)};
function frame(tm){requestAnimationFrame(frame);let t=tm*.001,dt=Math.min(.05,last?(tm-last)*.001:.016);last=tm;
 const w=t<actions.walk,r=t<actions.roar,s=t<actions.tail;
 if(w)feet+=dt*2.3;
 const roar=r?Math.sin(Math.PI*Math.max(0,Math.min(1,(actions.roar-t)/2.5)))**2:0;
 const sc=s?Math.sin((actions.tail-t)*10)*.30:Math.sin(t*1.3)*.045;
 if(C.width!==Math.round(C.clientWidth* Math.min(devicePixelRatio||1,1.4))||C.height!==Math.round(C.clientHeight* Math.min(devicePixelRatio||1,1.4))){let dpi=Math.min(devicePixelRatio||1,1.4);C.width=Math.round(C.clientWidth*dpi);C.height=Math.round(C.clientHeight*dpi);gl.viewport(0,0,C.width,C.height)}
 gl.clearColor(.105,.130,.14,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);gl.uniformMatrix4fv(U.projection,false,perspective(Math.PI/3.4,C.width/C.height,.1,80));gl.uniformMatrix4fv(U.view,false,resetCamera(t));
 const I=identity();drawBatch(ground,I);drawBatch(border,I);drawBatch(shadow,I);
 let root=mul(tr(0,.03*Math.sin(t*1.3)-(w?.05*Math.abs(Math.sin(feet*Math.PI*2)):0),0),ry(0));
 for(let b of [torso,spots,mane,fringe,horns,...actualHead])drawBatch(b,root);drawBatch(iris,root,1);
 let jawPivot=mul(root,mul(tr(0,3.19,-3.47),mul(rx(-roar*.16),tr(0,-3.19,3.47))));
 drawBatch(jaw,jawPivot);drawBatch(jawTeeth,jawPivot);
 for(let limb of legs){let id=(limb.front?0:2)+(limb.side>0?1:0),ph=feet+([0,.50,.75,.25][id]);let step=w?Math.sin(ph*Math.PI*2):0, lift=w?Math.max(0,Math.cos(ph*Math.PI*2))*.28:0;
 let hip=mul(root,mul(tr(limb.x,limb.h,limb.z),rx((limb.front?-.19:.16)+step*.18)));
 drawBatch(limb.upper,hip);
 let knee=mul(hip,mul(tr(0,-1.00,.02),rx((limb.front?.16:-.10)-step*.13+lift*.10)));
 drawBatch(limb.lower,knee);drawBatch(limb.nails,knee);
 }
 const snakeModel=mul(root,mul(tr(0,2.45,3),mul(ry(sc),tr(0,-2.45,-3))));
 drawBatch(tail,snakeModel);drawBatch(snake,snakeModel);
 if(mode!=='face' && !document.body.classList.contains('clean'))drawBatch(avatar,I);
 }
requestAnimationFrame(frame);
}
</script></body></html>
