<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a397b">
  <meta name="description" content="地域クラブからプロへ。選手の補強・週間育成・スタジアム経営ができるサッカーシミュレーション。">
  <title>SOCCER PRIME — サッカークラブ経営</title>
  <link rel="icon" href="./assets/ball.webp">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./club.css?v=pixel-art">
  <script defer src="./club-sim.js"></script>
  <script defer src="./club-scout.js"></script>
  <script defer src="./club-profile.js"></script>
  <script defer src="./club-views.js?v=pixel-art"></script>
  <script defer src="./club.js?v=pixel-art"></script>
</head>
<body class="prime-career">
  <main id="title-screen" class="prime-title" aria-labelledby="title-name">
    <picture class="title-art" aria-hidden="true">
      <source media="(orientation: portrait)" srcset="./assets/title-portrait.webp">
      <img src="./assets/title-wide.webp" alt="" fetchpriority="high">
    </picture>
    <header class="title-brand">
      <h1 id="title-name">SOCCER <span>PRIME</span></h1>
      <p>地域クラブを、プロクラブへ。</p>
    </header>
    <div class="title-actions">
      <p id="title-save" hidden></p>
      <button type="button" class="prime-button primary" id="title-start">はじめる</button>
      <div class="title-account">
        <button type="button" class="prime-button quiet" data-profile="login">ログイン</button>
        <button type="button" class="prime-button quiet" data-profile="register">新規登録</button>
      </div>
    </div>
  </main>

  <main id="game-screen" class="prime-shell" hidden>
    <header class="prime-header">
      <div class="prime-header-title">
        <p class="prime-type">SOCCER MANAGEMENT SIMULATOR</p>
        <button class="prime-logo" type="button" id="return-title" title="タイトルに戻る">SOCCER <span>PRIME</span></button>
        <p class="prime-description">地域クラブからプロへ・選手育成・クラブ経営</p>
      </div>
      <p id="season-calendar"></p>
    </header>
    <div class="prime-profile">
      <span id="profile-strip"></span>
    </div>
    <div id="overview" class="prime-summary" aria-label="クラブ概要"></div>

    <nav id="club-tabs" class="prime-tabs" aria-label="クラブメニュー"></nav>
    <div id="club-view" class="prime-view"></div>
  </main>
  <p id="club-notice" class="club-notice" role="status" hidden></p>

  <dialog id="setup-dialog" aria-labelledby="setup-title">
    <form id="setup-form">
      <div class="dialog-heading"><h2 id="setup-title">自分のクラブを作ろう</h2><button id="close-setup" class="prime-button quiet close-button" type="button" aria-label="閉じる">×</button></div>
      <p class="muted" id="setup-description">クラブ名とチームカラーを決めて、地域大会から始めます。</p>
      <div class="setup-preview"><span id="setup-crest" class="club-crest" aria-hidden="true"></span><strong id="setup-preview">クラブ名を入力</strong></div>
      <label class="form-field">クラブ名<input name="clubName" id="club-name-input" maxlength="24" placeholder="例：広島リバーFC" required></label>
      <label class="form-field">チームカラー<select name="clubColor" id="club-color"></select></label>
      <button type="submit" class="prime-button primary wide" id="setup-save">このクラブでゲーム開始</button>
    </form>
  </dialog>

  <dialog id="profile-dialog" aria-labelledby="profile-title">
    <form id="profile-form">
      <div class="dialog-heading"><h2 id="profile-title">アカウントでログイン</h2><button id="close-profile" class="prime-button quiet close-button" type="button" aria-label="閉じる">×</button></div>
      <div class="button-row profile-tabs" aria-label="アカウントの操作">
        <button class="prime-button" type="button" data-profile="login">ログイン</button>
        <button class="prime-button" type="button" data-profile="register">新規登録</button>
      </div>
      <p class="muted">アカウントとセーブはこのブラウザに保存されます。</p>
      <label class="form-field">名前<input id="profile-name" autocomplete="username" maxlength="20" required></label>
      <label class="form-field">パスワード<input id="profile-password" type="password" autocomplete="current-password" minlength="6" maxlength="64" required></label>
      <label class="check-field" id="use-guest"><input id="use-guest-check" type="checkbox" checked> ゲストのセーブを引き継ぐ</label>
      <p id="profile-error" class="error-text" role="alert"></p>
      <button type="submit" class="prime-button primary wide" id="profile-submit">ログイン</button>
    </form>
  </dialog>

  <dialog id="match-choice" aria-labelledby="match-choice-title">
    <div class="dialog-heading"><h2 id="match-choice-title">試合を観戦しますか？</h2><button id="close-choice" class="prime-button quiet close-button" type="button" aria-label="閉じる">×</button></div>
    <p class="muted" id="match-choice-copy"></p>
    <div class="button-row choice-buttons">
      <button type="button" class="prime-button primary" id="choose-watch">観戦する</button>
      <button type="button" class="prime-button" id="choose-skip">結果だけ見る</button>
    </div>
  </dialog>

  <dialog id="match-viewer" class="match-viewer" aria-labelledby="watch-title">
    <div class="dialog-heading"><h2 id="watch-title">試合観戦</h2><button id="close-watch" class="prime-button quiet close-button" type="button" aria-label="閉じる">×</button></div>
    <div id="watch-body"></div>
    <div class="button-row watch-controls">
      <button id="watch-next" class="prime-button primary" type="button">前半を進める</button>
      <button id="watch-finish" class="prime-button" type="button">試合終了まで進める</button>
    </div>
  </dialog>
</body>
</html>
