 for(const event of ["pointerup","pointercancel","lostpointercapture"])canvas.addEventListener(event,e=>{pointer.delete(e.pointerId);pinch=0});
 canvas.addEventListener("wheel",e=>{e.preventDefault();zoom=Math.max(.5,Math.min(2.5,zoom*Math.exp(-.002*e.deltaY)));request()},{passive:false});
 document.getElementById("minus").onclick=()=>{zoom=Math.max(.5,zoom*.83);request()};
 document.getElementById("plus").onclick=()=>{zoom=Math.min(2.5,zoom*1.2);request()};
 document.getElementById("reset").onclick=()=>{yaw=-.36;pitch=-.12;zoom=1;request()};
 window.addEventListener("resize",request);request();
