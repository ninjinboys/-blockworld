<script>
(()=>{
'use strict';
const canvas=document.getElementById('stage'), status=document.getElementById('status'), error=document.getElementById('error');
const fail=e=>{error.style.display='flex';error.textContent='3D表示エラー: '+String(e?.message||e);status.textContent='表示エラー';};
try{
const gl=canvas.getContext('webgl',{antialias:true,alpha:true,depth:true,preserveDrawingBuffer:false})||canvas.getContext('experimental-webgl',{alpha:true,depth:true});

function decode(id){const s=document.getElementById(id).textContent.trim();const raw=atob(s);const buf=new ArrayBuffer(raw.length);const arr=new Uint8Array(buf);for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);return buf;}
const positions=new Float32Array(decode('vertex-data')),normals=new Float32Array(decode('normal-data')),
 colors=new Uint8Array(decode('color-data')),indices=new Uint16Array(decode('index-data'));
if(positions.length===0||indices.length===0||normals.length!==positions.length||colors.length!==positions.length)throw new Error('頂点データが不正です');
// Fully working software 3D fallback for browsers that disable WebGL.
if(!gl){
const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Canvas 2Dも利用できません。');
let yaw=-.48,pitch=.11,zoom=1,raf=0;const num=indices.length/3;
function draw(){raf=0;const dpr=Math.min(1.3,window.devicePixelRatio||1),w=Math.max(1,Math.floor(canvas.clientWidth*dpr)),h=Math.max(1,Math.floor(canvas.clientHeight*dpr));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}
ctx.clearRect(0,0,w,h);const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);const sc=Math.min(w/18.8,h/9.0)*zoom;
const tx=new Float32Array(positions.length);for(let i=0;i<positions.length;i+=3){const x=positions[i]+.22,y=positions[i+1]-.65,z=positions[i+2],rx=cy*x+sy*z,rz=-sy*x+cy*z;tx[i]=w/2+rx*sc;tx[i+1]=h/2-(cp*y-sp*rz)*sc;tx[i+2]=sp*y+cp*rz}
const faces=[];for(let i=0;i<num;i++){const a=indices[3*i]*3,b=indices[3*i+1]*3,c=indices[3*i+2]*3;const det=(tx[b]-tx[a])*(tx[c+1]-tx[a+1])-(tx[b+1]-tx[a+1])*(tx[c]-tx[a]);if(Math.abs(det)<.02)continue;faces.push([(tx[a+2]+tx[b+2]+tx[c+2])/3,a,b,c]);}
faces.sort((a,b)=>a[0]-b[0]);for(const item of faces){let [depth,a,b,c]=item;const vx=normals[a],vy=normals[a+1],vz=normals[a+2],nx=cy*vx+sy*vz,nz=-sy*vx+cy*vz,ny=cp*vy-sp*nz,light=Math.min(1.1,.55+.5*Math.abs(nx*(-.36)+ny*.71+nz*.62)),idx=a;
const rr=Math.min(255,colors[idx]*light)|0,gg=Math.min(255,colors[idx+1]*light)|0,bb=Math.min(255,colors[idx+2]*light)|0;ctx.fillStyle='rgb('+rr+','+gg+','+bb+')';ctx.beginPath();ctx.moveTo(tx[a],tx[a+1]);ctx.lineTo(tx[b],tx[b+1]);ctx.lineTo(tx[c],tx[c+1]);ctx.closePath();ctx.fill()}
}
function refresh(){if(!raf)raf=requestAnimationFrame(draw)}const points=new Map();let pinch=null;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);points.set(e.pointerId,[e.clientX,e.clientY]);pinch=null});
canvas.addEventListener('pointermove',e=>{const old=points.get(e.pointerId);if(!old)return;points.set(e.pointerId,[e.clientX,e.clientY]);if(points.size===1){yaw+=(e.clientX-old[0])*.009;pitch=Math.max(-1.2,Math.min(1.2,pitch+(e.clientY-old[1])*.006));refresh()}else if(points.size===2){const p=[...points.values()],dist=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);if(pinch)zoom=Math.min(2.8,Math.max(.55,zoom*dist/pinch));pinch=dist;refresh()}});
for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,e=>{points.delete(e.pointerId);pinch=null});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.55,Math.min(2.8,zoom*(e.deltaY>0?.9:1.1)));refresh()},{passive:false});
document.getElementById('minus').onclick=()=>{zoom=Math.max(.55,zoom*.8);refresh()};document.getElementById('plus').onclick=()=>{zoom=Math.min(2.8,zoom*1.25);refresh()};document.getElementById('reset').onclick=()=>{zoom=1;yaw=-.48;pitch=.11;refresh()};
window.addEventListener('resize',refresh);status.textContent='3D表示中 · V21 · 2本の前脚';refresh();return;
}

const vertexSource="attribute vec3 a_position;attribute vec3 a_normal;attribute vec3 a_color;\nuniform vec3 u_center;uniform vec2 u_scale;uniform float u_yaw;uniform float u_pitch;\nvarying vec3 v_color;\nvoid main(){\n vec3 p=a_position-u_center;\n float c=cos(u_yaw),s=sin(u_yaw),cp=cos(u_pitch),sp=sin(u_pitch);\n vec3 q=vec3(c*p.x+s*p.z,p.y,-s*p.x+c*p.z);\n vec3 r=vec3(q.x,cp*q.y-sp*q.z,sp*q.y+cp*q.z);\n gl_Position=vec4(r.x*u_scale.x,r.y*u_scale.y,-r.z/16.0,1.0);\n vec3 n=a_normal;\n vec3 nq=vec3(c*n.x+s*n.z,n.y,-s*n.x+c*n.z);\n vec3 nr=normalize(vec3(nq.x,cp*nq.y-sp*nq.z,sp*nq.y+cp*nq.z));\n float light=0.54+0.51*abs(dot(nr,normalize(vec3(-0.36,0.71,0.62))));\n v_color=a_color*light;\n}",fragmentSource="precision mediump float;varying vec3 v_color;\nvoid main(){gl_FragColor=vec4(clamp(v_color,0.0,1.0),1.0);}";
function shader(type,text){const s=gl.createShader(type);gl.shaderSource(s,text);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error('シェーダー: '+gl.getShaderInfoLog(s));return s;}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vertexSource));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fragmentSource));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error('GPUリンク: '+gl.getProgramInfoLog(program));gl.useProgram(program);
function attribute(name,buf,components,type,normalized){const location=gl.getAttribLocation(program,name);if(location<0)throw Error('属性がありません: '+name);const o=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,o);gl.bufferData(gl.ARRAY_BUFFER,buf,gl.STATIC_DRAW);gl.enableVertexAttribArray(location);gl.vertexAttribPointer(location,components,type,normalized,0,0);}
attribute('a_position',positions,3,gl.FLOAT,false);attribute('a_normal',normals,3,gl.FLOAT,false);attribute('a_color',colors,3,gl.UNSIGNED_BYTE,true);
const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,indices,gl.STATIC_DRAW);
const uCenter=gl.getUniformLocation(program,'u_center'),uScale=gl.getUniformLocation(program,'u_scale'),uYaw=gl.getUniformLocation(program,'u_yaw'),uPitch=gl.getUniformLocation(program,'u_pitch');
gl.uniform3f(uCenter,-.22,.65,0);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.disable(gl.CULL_FACE);gl.clearColor(0,0,0,0);
let yaw=-.48,pitch=.11,zoom=1.0,raf=0;
function draw(){raf=0;const dpr=Math.min(1.6,window.devicePixelRatio||1);const w=Math.max(1,Math.floor(canvas.clientWidth*dpr)),h=Math.max(1,Math.floor(canvas.clientHeight*dpr));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}
const scale=Math.min(w/18.8,h/9.0)*zoom;gl.uniform2f(uScale,2*scale/w,2*scale/h);gl.uniform1f(uYaw,yaw);gl.uniform1f(uPitch,pitch);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.drawElements(gl.TRIANGLES,indices.length,gl.UNSIGNED_SHORT,0);
}
function refresh(){if(!raf)raf=requestAnimationFrame(draw)}
const touches=new Map();let lastPinch=null;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);touches.set(e.pointerId,[e.clientX,e.clientY]);lastPinch=null});
canvas.addEventListener('pointermove',e=>{const old=touches.get(e.pointerId);if(!old)return;touches.set(e.pointerId,[e.clientX,e.clientY]);if(touches.size===1){yaw+=(e.clientX-old[0])*.009;pitch=Math.max(-1.2,Math.min(1.2,pitch+(e.clientY-old[1])*.006));refresh()}else if(touches.size===2){const p=[...touches.values()],dist=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);if(lastPinch)zoom=Math.max(.55,Math.min(2.8,zoom*dist/lastPinch));lastPinch=dist;refresh()}});
for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,e=>{touches.delete(e.pointerId);lastPinch=null});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.55,Math.min(2.8,zoom*(e.deltaY>0?.90:1.10)));refresh()},{passive:false});
document.getElementById('minus').onclick=()=>{zoom=Math.max(.55,zoom*.8);refresh()};
document.getElementById('plus').onclick=()=>{zoom=Math.min(2.8,zoom*1.25);refresh()};
document.getElementById('reset').onclick=()=>{yaw=-.48;pitch=.11;zoom=1;refresh()};
window.addEventListener('resize',refresh);status.textContent='3D表示中 · '+(indices.length/3).toLocaleString('ja-JP')+'面 · V21 · 大型の前脚2本';refresh();
}catch(e){fail(e);console.error(e)}
})();
</script></body></html>
