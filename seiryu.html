import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/+esm';

tooth:new THREE.MeshStandardMaterial({color:0xf1e5cf,roughness:.56}),

black:new THREE.MeshStandardMaterial({color:0x071c2d,roughness:.88}),

function mesh(geo,mat,group=dragon){const m=new THREE.Mesh(geo,materials[mat]||mat);group.add(m);return m;}
function cube(x,y,z,sx,sy,sz,mat,group=dragon){const m=mesh(new THREE.BoxGeometry(sx,sy,sz),mat,group);m.position.set(x,y,z);return m;}
const Y=new THREE.Vector3(0,1,0);
function rod(a,b,r1,r2,mat,group=dragon,sides=6){
 const from=new THREE.Vector3(...a),to=new THREE.Vector3(...b),dir=to.clone().sub(from);
 const m=mesh(new THREE.CylinderGeometry(r2,r1,dir.length(),sides),mat,group);
 m.position.copy(from).add(to).multiplyScalar(.5);
 m.quaternion.setFromUnitVectors(Y,dir.normalize());return m;
}
// SEIRYU V20 — COMPLETE NEW 3D MODEL. No previous head, body or skin geometry.
// The core anatomy comes FIRST; scales and visual effects sit on its surfaces.
const yAxis=Y;
const root=new THREE.Group();dragon.add(root);
const M=materials;
const FRAME=new THREE.Matrix4(), DUMMY=new THREE.Object3D(), EQ=new THREE.Quaternion();
const palette=['deep','blue','royal','teal','sky','mint'];
const inst=new Map();
function instance(mat,g,pos,quat,scale){
 const id=mat+'|'+g;
 if(!inst.has(id))inst.set(id,{g,mat,items:[]});
 inst.get(id).items.push([pos.clone(),quat.clone(),scale.clone()]);
}
function commitInstances(){
 for(const {g,mat,items} of inst.values()){
  const x=new THREE.InstancedMesh(g,M[mat],items.length);x.frustumCulled=false;
  for(let i=0;i<items.length;i++){
   DUMMY.position.copy(items[i][0]);DUMMY.quaternion.copy(items[i][1]);
   DUMMY.scale.copy(items[i][2]);DUMMY.updateMatrix();x.setMatrixAt(i,DUMMY.matrix);
  }
  x.instanceMatrix.needsUpdate=true;root.add(x);
 }
}
function part(geometry,material,parent=root){
 return mesh(geometry,material,parent);
}
function ellipsoid(pos,radii,mat,detail=1,parent=root){
 const m=part(new THREE.IcosahedronGeometry(1,detail),mat,parent);
 m.position.set(...pos);m.scale.set(...radii);return m;
}
function bone(a,b,r0,r1,mat='horn',parent=root){
 return rod(a,b,r0,r1,mat,parent,7);
}
function curveWire(coords,r,mat='water',parent=root){
 const curve=new THREE.CatmullRomCurve3(coords.map(p=>new THREE.Vector3(...p)));
 return part(new THREE.TubeGeometry(curve,64,r,6,false),mat,parent);
}
const TILE=(()=>{
 const s=new THREE.Shape();
 s.moveTo(-.56,-.33);s.lineTo(-.15,.30);s.lineTo(.31,.37);
 s.lineTo(.60,.08);s.lineTo(.33,-.33);s.closePath();
 const g=new THREE.ExtrudeGeometry(s,{depth:.145,steps:1,bevelEnabled:true,
   bevelThickness:.022,bevelSize:.035,bevelSegments:1});
 g.translate(0,0,-.0725);
 return g;
})();
const CUT=new THREE.BoxGeometry(1,1,1);
function armor(mat,x,y,z,sx,sy,sz,angle=0,parent=root){
 const o=part(TILE,mat,parent);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.rotation.z=angle;
 return o;
}
function eyeShape(x,y,z,side,parent){
 // Black eye socket is a recessed almond, the cyan iris is a tight light slit.
 ellipsoid([x,y,side*z],[.72,.22,.15],'black',1,parent);
 const m=ellipsoid([x-.08,y+.045,side*(z+.22)],[.46,.075,.072],'eye',1,parent);
 m.rotation.z=-.17;
 const brow=bone([x-.86,y+.34,side*(z+.095)],[x+.63,y+.39,side*(z+.07)],.19,.055,'deep',parent);
 bone([x-.86,y+.33,side*(z+.13)],[x+.32,y+.37,side*(z+.16)],.075,.025,'sky',parent);
}
// Custom hollow elliptical anatomy. Keyed cross-sections are 3D volume,
// NOT several overlapping boxes; vertex normals form a single organic skull.
function loft(sections,mat,parent=root,radial=20){
 const coords=[],indices=[];
 for(const s of sections)for(let j=0;j<radial;j++){
  const a=j*Math.PI*2/radial;
  coords.push(s[0],s[1]+Math.cos(a)*s[2],Math.sin(a)*s[3]);
 }
 for(let i=0;i<sections.length-1;i++)for(let j=0;j<radial;j++){
  const nj=(j+1)%radial,a=i*radial+j,b=i*radial+nj,c=(i+1)*radial+j,d=(i+1)*radial+nj;
  indices.push(a,c,b,b,c,d);
 }
 const geo=new THREE.BufferGeometry();
 geo.setAttribute('position',new THREE.Float32BufferAttribute(coords,3));geo.setIndex(indices);
 geo.computeVertexNormals();return part(geo,mat,parent);
}
// Majestic giant head: long narrow bridge, broad triangular cheekbones,
// projecting upper jaws and separated mandibular bone.
const head=new THREE.Group();head.position.set(-10.15,7.9,3.0);
head.rotation.y=-.13;head.scale.setScalar(1.48);root.add(head);
const SKULL=[
 [-7.7,.14,.08,.24],[-7.15,.19,.31,.39],[-6.32,.29,.43,.59],
 [-5.32,.40,.55,.76],[-4.12,.60,.75,1.03],
 [-3.20,.84,.99,1.32],[-2.2,1.07,1.50,1.79],
 [-1.03,1.12,1.63,1.94],[.18,.86,1.55,1.81],
 [1.22,.51,1.23,1.57],[2.22,.18,.94,1.24]
];
loft(SKULL,'blue',head,24);
// Broad, darker bony cheeks give the guardian a fierce silhouette
ellipsoid([-1.40,.42,-1.1],[1.10,.90,.73],'deep',1,head);
ellipsoid([-1.40,.42,1.1],[1.10,.90,.73],'deep',1,head);
// Golden-brown nasal bridge and crest set the muzzle depth
loft([[-7.47,.19,.05,.11],[-6.53,.38,.16,.26],[-5.5,.65,.16,.39],
 [-4.16,.89,.17,.53],[-2.9,1.26,.21,.70],[-1.48,1.55,.12,.60]],'royal',head,14);
// Crucial: LOWER JAW is a completely separate long VOLUME, hanging beneath the open mouth.
const jaw=[
 [-6.57,-2.08,.09,.29],[-5.93,-2.42,.33,.48],
 [-4.90,-2.52,.38,.67],[-3.70,-2.36,.44,.86],
 [-2.68,-2.09,.47,1.02],[-1.61,-1.68,.54,1.05],
 [-.72,-1.05,.54,.91],[.04,-.48,.52,.76]
];
loft(jaw,'blue',head,20);
ellipsoid([-2.86,-1.13,0],[2.32,.59,.58],'black',2,head);
ellipsoid([-3.80,-1.64,0],[1.49,.24,.42],'teal',1,head);
for(const side of [-1,1]){
 // Underjaw joint attached to cheek: no disconnected floating chin.
 bone([.12,-.20,side*.91],[-1.30,-1.18,side*.95],.43,.27,'deep',head);
 bone([-1.35,-1.32,side*.94],[-3.20,-2.23,side*.81],.30,.15,'royal',head);
 // Recessed eyes are at the FRONT of the cheek, looking toward the snout.
 eyeShape(-2.95,1.32,2.03,side,head);
 // Oversized lower canines, each bent forward like genuine ivory hooks.
 bone([-5.13,-.19,side*.52],[-5.43,-1.62,side*.69],.23,.095,'tooth',head);
 bone([-5.43,-1.62,side*.69],[-5.13,-2.12,side*.66],.092,.008,'tooth',head);
 bone([-2.79,-.14,side*1.02],[-3.08,-1.28,side*1.08],.16,.013,'tooth',head);
 for(let k=0;k<5;k++){
  const x=-6.20+k*.84,z=side*(.33+.06*k);
  bone([x,-.20,z],[x-.11,-.69-(k%3)*.19,z],.12,.013,'tooth',head);
  bone([x+.31,-2.21,side*(.32+.09*k)],[x+.34,-1.40,side*(.31+.09*k)],.11,.008,'tooth',head);
 }
 ellipsoid([-6.55,.38,side*.36],[.14,.09,.065],'black',1,head);
 // Heavy antler trunks branch BACKWARDS as shown in the user's turnarounds.
 const branches=[
 [[-1.06,2.08,side*.91],[-.52,3.27,side*1.30],.34,.25],
 [[-.52,3.27,side*1.30],[.36,4.36,side*1.55],.26,.19],
 [[.36,4.36,side*1.55],[1.98,5.27,side*1.63],.19,.015],
 [[-.34,3.52,side*1.41],[-.85,4.62,side*2.06],.17,.02],
 [[.49,4.44,side*1.54],[.42,5.58,side*2.08],.14,.02],
 [[1.01,4.95,side*1.56],[1.93,6.09,side*1.96],.12,.013],
 [[1.45,5.12,side*1.69],[2.97,5.68,side*2.10],.10,.01],
 [[-.60,3.09,side*1.40],[-1.43,4.07,side*1.92],.15,.019]
 ];
 branches.forEach(x=>bone(x[0],x[1],x[2],x[3],'horn',head));
 // Wavy whisker tubes originate from cheeks — primary + smaller secondary.
 curveWire([[-6.25,-.03,side*.52],[-7.18,-.48,side*1.40],
 [-8.23,-1.16,side*2.66],[-9.31,-.44,side*3.69],
 [-10.12,.68,side*3.94],[-11.03,.96,side*3.28]],.047,'water',head);
 curveWire([[-5.52,-.34,side*.64],[-6.37,-.69,side*1.25],
 [-7.54,-1.19,side*2.29],[-8.48,-.73,side*2.64],
 [-9.07,.03,side*2.27]],.027,'sky',head);
 // Full flowing beard, sweeping back from the corner of the jaw.
 // Broad tapered fin shapes are behind the eyes and read as a royal mane.
 for(let i=0;i<14;i++){
  const k=i/13;
  const xx=-1.46+i*.21;
  const yy=.57-.10*k;
  const zz=side*(1.91+.09*Math.sin(k*Math.PI));
  const fin=armor(i%4===0?'mint':i%2===0?'teal':'sky',xx,yy,zz,
    .78,1.08,1,.28,head);
  fin.rotation.y=side*.32;
  bone([xx,yy,zz],[xx+.56,yy+.68+(i%3)*.13,zz+side*(.49+k*.20)],
    .21,.025,i%3===0?'mint':'sky',head);
 }
 // Beneath the jaw, cyan gill streamers frame the gaping mouth.
 for(let i=0;i<8;i++){
  const x=-1.7+i*.29,z=side*(.93+i*.08);
  bone([x,-1.17,z],[x+.31,-1.91-(i%3)*.18,z+side*.24],
    .19,.02,i%2===0?'sky':'teal',head);
 }
 // Beveled layered scales over the cheek's REAL volume, not random floating noise.
 for(let row=0;row<5;row++)for(let k=0;k<16;k++){
  const x=-5.50+k*.29+(row%2)*.14,y=.50+row*.23;
  if(x>-2.2&&row<2)continue;
  const sideRad=x<-4.5?.76:x<-3.4?1.08:x<-2.6?1.43:1.67;
  const z=side*(sideRad+.09+row*.045);

 }
 // Thick cheek frills branch into separate leafy plates, NOT needle hair.
 for(let k=0;k<15;k++){
  const x=-1.2+k*.205,sy=.36+(k%4)*.15,z=side*(1.71+.09*(k%3));

 }
 // Fin-like cream chin scales taper downward
 for(let k=0;k<10;k++){
  const x=-5.35+k*.37;
  armor(k%3===0?'belly':'royal',x,-1.98,side*(.46+.04*k),.60,.35,1,-.15,head);
 }

for(let i=0;i<20;i++){
 const x=-2.10+i*.20,z=Math.sin(i*1.19)*.50;
 armor(i%5===0?'mint':i%2===0?'sky':'teal',x,2.08+.21*Math.sin(i*.39),z,.54,.85,1,.58,head);
}
// Body volume forms a SINGLE continuous sculpted tube with distinct S-bends.
const path=new THREE.CatmullRomCurve3([
 new THREE.Vector3(-8.1,7.25,3.0),new THREE.Vector3(-6.2,4.74,3.3),
 new THREE.Vector3(-3.7,2.76,2.8),new THREE.Vector3(-.3,2.5,.7),
 new THREE.Vector3(3.05,4.30,-1.55),new THREE.Vector3(5.90,6.65,-2.80),
 new THREE.Vector3(8.15,6.90,-2.85),new THREE.Vector3(10.1,4.85,-1.30),
 new THREE.Vector3(11.60,2.93,1.15),new THREE.Vector3(12.15,3.80,3.05),
 new THREE.Vector3(13.1,6.22,2.42),new THREE.Vector3(14.90,8.85,.50),
 new THREE.Vector3(17.00,10.20,-2.10)
],false,'catmullrom',.5);
const bodyR=t=>t<.12?1.59+.53*t/.12:t<.61?2.12-.16*(t-.12)/.49:
 Math.max(.29,1.96*(1-(t-.61)/.39));
const bodyN=112,bodySides=20;

const bodyColor=new THREE.Color();

 teal:0x1599a9,sky:0x4bb5dd,mint:0x67d9cc,belly:0xd9c8aa};

 const t=i/bodyN,p=path.getPoint(t),tan=path.getTangent(t).normalize();
 const right=new THREE.Vector3().crossVectors(tan,Y).normalize();
 if(right.lengthSq()<.1)right.set(0,0,1);
 const up=new THREE.Vector3().crossVectors(right,tan).normalize();
 rings.push({p,tan,right,up,r:bodyR(t)});
 for(let j=0;j<bodySides;j++){

  const r=bodyR(t),v=p.clone().addScaledVector(n,r);

  const under=Math.cos(angle)<-.37;
  const highlight=.5*Math.sin(i*.26+angle*1.15)+Math.cos(i*.09-angle*2);
  bodyColor.setHex(under?colorRGB.belly:highlight>.65?colorRGB.royal:
    highlight>-.27?colorRGB.blue:colorRGB.deep);
  colors.push(bodyColor.r,bodyColor.g,bodyColor.b);
 }
}
for(let i=0;i<bodyN;i++)for(let j=0;j<bodySides;j++){
 const a=i*bodySides+j,b=i*bodySides+(j+1)%bodySides;
 const c=(i+1)*bodySides+j,d=(i+1)*bodySides+(j+1)%bodySides;
 faces.push(a,c,b,b,c,d);
}
const tg=new THREE.BufferGeometry();
tg.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
tg.setAttribute('normal',new THREE.Float32BufferAttribute(normals,3));
tg.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));tg.setIndex(faces);
part(tg,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.58,metalness:.12,side:THREE.DoubleSide}));
const MAT=new THREE.Matrix4(),QUAT=new THREE.Quaternion();
for(let i=2;i<bodyN-2;i+=2){
 const t=i/bodyN,f=rings[i];
 for(let j=0;j<bodySides;j++){
  const ang=(j+(i%4===0?.43:0))*Math.PI*2/bodySides;
  const n=f.up.clone().multiplyScalar(Math.cos(ang)).addScaledVector(f.right,Math.sin(ang));
  const along=f.tan;
  const lateral=new THREE.Vector3().crossVectors(n,along).normalize();
  MAT.makeBasis(along,lateral,n);QUAT.setFromRotationMatrix(MAT);
  const p=f.p.clone().addScaledVector(n,f.r+.05);
  const under=Math.cos(ang)<-.35;
  const wave=Math.sin(i*.16+j*.61)+Math.cos(i*.29-j*.33)*.30;
  const mat=under?'belly':wave>.83?'mint':wave>.17?'teal':wave>-.52?'royal':'blue';
  instance(mat,'scale',p,QUAT,new THREE.Vector3(.64+.09*(1-t),.72*(f.r/1.9),.89));
 }
 // Wide swept-up flowing mane along the top of the body, as coherent fins.
 if(i%4===0&&t<.97){
  const a=f.p.clone().addScaledVector(f.up,f.r-.08);
  const b=a.clone().addScaledVector(f.up,.78+.35*(1-t)).addScaledVector(f.tan,-.40);
  bone(a.toArray(),b.toArray(),.27,.015,i%8===0?'mint':'sky',root);
 }
}
// Two and ONLY two forelegs; no hindlegs.
const front=path.getPoint(.165),sideFrame=rings[18].right;
for(const sign of [-1,1]){
 const hip=front.clone().addScaledVector(sideFrame,sign*1.43);
 const elbow=hip.clone().add(new THREE.Vector3(-.53,-1.31,sign*1.17));
 const wrist=elbow.clone().add(new THREE.Vector3(-1.01,-1.50,sign*.65));
 bone(hip.toArray(),elbow.toArray(),.63,.39,'deep');
 bone(elbow.toArray(),wrist.toArray(),.46,.27,'blue');
 ellipsoid(wrist.toArray(),[.58,.31,.52],'royal',1);
 for(let j=-1;j<=1;j++){
  const tip=wrist.clone().add(new THREE.Vector3(-1.11,-.42,j*.38));
  const digit=wrist.clone().add(new THREE.Vector3(-.29,-.15,j*.31));
  bone(digit.toArray(),tip.toArray(),.17,.015,'tooth');
 }
}
// Broad translucent ocean-silk tail fronds instead of a spiky hedgehog.
const tip=path.getPoint(1),f=rings[bodyN-1];
for(let k=0;k<14;k++){
 const ang=k*2*Math.PI/14;
 const n=f.up.clone().multiplyScalar(Math.cos(ang)).addScaledVector(f.right,Math.sin(ang));
 bone(tip.toArray(),tip.clone().addScaledVector(f.tan,1.2)
  .addScaledVector(n,1.7).toArray(),.18,.015,k%3===0?'mint':'sky');
}
// Subtle block-spray clouds separate from anatomy (not covering the face).
const cloudPositions=[[-8.6,5.0,-2.6],[-2,1,-4],[5,1,5],[10,7,1],[14,4,-4],[17,11,1]];
for(const [cx,cy,cz] of cloudPositions)for(let k=0;k<26;k++){
 const a=k*2.399963,r=.3+.15*(k%5);
 const p=new THREE.Vector3(cx+Math.cos(a)*r,cy+Math.sin(a*2)*r*.55,cz+Math.sin(a)*r);
 instance(k%6===0?'water':'cloud','cloud',p,new THREE.Quaternion(),
  new THREE.Vector3(.27+(k%3)*.16,.22+(k%3)*.13,.30+(k%4)*.14));
}
for(const v of inst.values())v.g=v.g==='scale'?TILE:CUT;
commitInstances();
// Ground and soft scene lighting
const ground=mesh(new THREE.PlaneGeometry(190,190),new THREE.MeshStandardMaterial({color:0x0b1822,roughness:.88}),scene);
ground.rotation.x=-Math.PI/2;ground.position.y=-6.3;
const grid=new THREE.GridHelper(80,40,0x16435a,0x173147);grid.position.y=-6.28;scene.add(grid);
// Set initial camera from the TRUE three-dimensional mesh bounds, so neither
// muzzle nor streaming tail is cropped on narrow iPads.
dragon.updateMatrixWorld(true);
const dragonBounds=new THREE.Box3().setFromObject(dragon);
const dragonSize=dragonBounds.getSize(new THREE.Vector3());
const heroCenter=dragonBounds.getCenter(new THREE.Vector3());
function fitWholeDragon(){
 const tan=Math.tan(camera.fov*Math.PI/360);
 const aspect=Math.max(.4,camera.aspect);
 return Math.min(110,Math.max(
  dragonSize.x*.5/(tan*aspect),
  dragonSize.y*.5/tan
 )*1.10+dragonSize.z*.32);
}
const faceViewDistance=()=>innerWidth/Math.max(innerHeight,1)<1.15?37.0:30.5;
let yaw=-.64,pitch=.075,distance=faceViewDistance(),autoSpin=false,center=head.position.clone().add(new THREE.Vector3(-4.25,0.8,0));
const btns=[...document.querySelectorAll('[data-view]')];
btns.forEach(button=>button.addEventListener('click',()=>{
 const view=button.dataset.view;autoSpin=false;document.getElementById('spin').classList.remove('active');
 if(view==='front'){yaw=.10;pitch=.07;distance=fitWholeDragon();center.copy(heroCenter)}
 if(view==='side'){yaw=0;pitch=.02;distance=fitWholeDragon();center.copy(heroCenter)}
 if(view==='back'){yaw=Math.PI;pitch=.08;distance=fitWholeDragon();center.copy(heroCenter)}
 if(view==='head'){yaw=-.64;pitch=.075;distance=faceViewDistance();center.copy(head.position).add(new THREE.Vector3(-4.25,0.8,0))}
}));
document.getElementById('zoomin').onclick=()=>distance=Math.max(6,distance*.8);
document.getElementById('zoomout').onclick=()=>distance=Math.min(85,distance*1.25);
document.getElementById('spin').onclick=e=>{autoSpin=!autoSpin;e.currentTarget.classList.toggle('active',autoSpin);e.currentTarget.textContent=autoSpin?'自動回転 ON':'自動回転 OFF'};
const pointers=new Map();let lastDist=0;
canvas.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;
 const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===1){yaw-=(e.clientX-old.x)*.0065;pitch=Math.max(-1.10,Math.min(1.22,pitch+(e.clientY-old.y)*.005));autoSpin=false;document.getElementById('spin').classList.remove('active')}
 else if(pointers.size===2){
  const a=[...pointers.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
  if(lastDist)distance=Math.max(6,Math.min(85,distance*lastDist/dist));
  lastDist=dist;
 }
});
for(const evt of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(evt,e=>{pointers.delete(e.pointerId);lastDist=0});
canvas.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(6,Math.min(85,distance*(1+Math.sign(e.deltaY)*.11)))},{passive:false});
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();if(center.distanceTo(heroCenter)<.15)distance=fitWholeDragon()}
addEventListener('resize',resize);resize();
function render(){
 requestAnimationFrame(render);
 if(autoSpin)yaw+=.0016;
 const cp=Math.cos(pitch);
 camera.position.set(center.x+distance*Math.sin(yaw)*cp,center.y+distance*Math.sin(pitch),center.z+distance*Math.cos(yaw)*cp);
 camera.lookAt(center);
 renderer.render(scene,camera);
}
document.getElementById('spin').textContent='自動回転 OFF';document.getElementById('spin').classList.remove('active');
document.getElementById('status').style.display='none';
render();
</script>
</body>
</html>
