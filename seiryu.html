import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/+esm';
// R50 - THE SKELETON IS THE SOURCE OF TRUTH. New pose; no legacy head/torso meshes.
const canvas=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.16;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x070f18);
scene.fog=new THREE.Fog(0x070f18,70,150);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,200);

const sun=new THREE.DirectionalLight(0xdff5ff,3.1);sun.position.set(-20,25,20);scene.add(sun);
const rim=new THREE.DirectionalLight(0x1a84d5,2.1);rim.position.set(16,13,-22);scene.add(rim);
const groundLight=new THREE.PointLight(0x21e1f6,19,37);groundLight.position.set(-11,8,9);scene.add(groundLight);
const paint={
 abyss:0x081d42,indigo:0x10376f,cobalt:0x1457aa,azure:0x267cbd,
 ocean:0x178e9f,jade:0x39bcb7,cyan:0x77d9f1,
 belly:0xc8b9a4,bellyDark:0x978c7e,horn:0xb5a085,
 tooth:0xece1cb,throat:0x071c25,cloud:0x8cc8ee
};
const materials={};
for(const [k,v] of Object.entries(paint)){
 materials[k]=new THREE.MeshStandardMaterial({color:v,roughness:k==='horn'?.84:.63,
 metalness:k==='cyan'?.12:.02,side:THREE.DoubleSide});
}
materials.eye=new THREE.MeshBasicMaterial({color:0x71fcff});
materials.water=new THREE.MeshStandardMaterial({color:0x6df8ff,emissive:0x167da5,emissiveIntensity:.5});
materials.cloud.transparent=true;materials.cloud.opacity=.60;materials.cloud.depthWrite=false;
const dragon=new THREE.Group();scene.add(dragon);
const V=(x,y,z)=>new THREE.Vector3(x,y,z), UP=V(0,1,0);
function part(g,color,parent=dragon){
 const m=new THREE.Mesh(g,materials[color]);parent.add(m);return m;
}
function mass(pos,r,color,detail=1,parent=dragon){
 const m=part(new THREE.IcosahedronGeometry(1,detail),color,parent);
 m.position.copy(pos);m.scale.set(...r);return m;
}
function stick(a,b,r0,r1,color,parent=dragon,sides=7){
 const d=b.clone().sub(a),len=d.length();
 if(len<.0001)return;
 const mesh=part(new THREE.CylinderGeometry(r1,r0,len,sides),color,parent);
 mesh.position.copy(a).add(b).multiplyScalar(.5);
 mesh.quaternion.setFromUnitVectors(UP,d.normalize());
 return mesh;
}
function strand(points,width,color,parent=dragon){
 return part(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points),40,width,6,false),color,parent);
}
function fan(a,b,width,color,parent=dragon){
 const length=b.distanceTo(a);
 const outline=new THREE.Shape();outline.moveTo(-width*.18,0);
 outline.lineTo(-width*.54,length*.25);outline.lineTo(-width*.45,length*.70);
 outline.lineTo(0,length);outline.lineTo(width*.51,length*.72);
 outline.lineTo(width*.55,length*.24);outline.lineTo(width*.17,0);outline.closePath();
 const geo=new THREE.ExtrudeGeometry(outline,{depth:.15,bevelEnabled:true,
 bevelSize:.035,bevelThickness:.035,bevelSegments:1,steps:1});
 geo.translate(0,0,-.075);
 const m=part(geo,color,parent);
 m.position.copy(a);m.quaternion.setFromUnitVectors(UP,b.clone().sub(a).normalize());
 return m;
}
// ---------------------------------- 1. ACTUAL POSE RIG ----------------------------------
// Named XYZ JOINTS explicitly control the silhouette (image left=head).
// All skin, organs, limbs and whiskers depend on these nodes.
const J={
 muzzle:V(-15.5,7.20,2.0),brow:V(-13.15,8.40,2.05),
 skull:V(-10.25,8.58,1.8),jawTip:V(-14.35,4.35,2.02),
 jawHinge:V(-9.63,6.83,1.79),
 throat:V(-8.44,5.96,1.65),chest:V(-7.18,3.85,1.42),
 shoulderL:V(-7.5,3.7,3.36),shoulderR:V(-7.5,3.7,-.54),
 frontBelly:V(-3.55,3.08,.76),

 backShoulder:V(6.85,7.18,-2.14),secondDip:V(8.95,4.08,-.20),
 tailCoil:V(11.1,3.42,3.18),
 tailRise:V(13.20,7.18,3.73),tailTip:V(15.80,10.75,1.25),

const backboneNames=['skull','throat','chest','frontBelly','backArch','backTop','backShoulder',
 'secondDip','tailCoil','tailRise','tailTip'];
const bodyPath=new THREE.CatmullRomCurve3(backboneNames.map(n=>J[n]),false,'catmullrom',.45);
const radius=t=>t<.10?1.65+t*4.5:t<.48?2.10+Math.sin((t-.10)/.38*Math.PI)*.45:
 t<.71?2.05-.24*((t-.48)/.23):Math.max(.21,1.81*(1-(t-.71)/.29));
const debug=new THREE.Group();scene.add(debug);debug.visible=false;
const bones=[['muzzle','brow'],['brow','skull'],['skull','jawHinge'],
 ['jawTip','jawHinge'],...backboneNames.slice(1).map((n,i)=>[backboneNames[i],n]),
 ['chest','shoulderL'],['chest','shoulderR']];

for(const [a,b] of bones){
 const A=J[a],B=J[b],d=B.clone().sub(A);
 const m=new THREE.Mesh(new THREE.CylinderGeometry(.065,.065,d.length(),8),boneMat);
 m.position.copy(A).add(B).multiplyScalar(.5);
 m.quaternion.setFromUnitVectors(UP,d.normalize());debug.add(m);
}
for(const [name,p] of Object.entries(J)){
 const m=new THREE.Mesh(new THREE.SphereGeometry(.22,9,6),
 new THREE.MeshBasicMaterial({color:name.includes('shoulder')?0xffd477:0x6df8ff,depthTest:false}));
 m.position.copy(p);debug.add(m);
}
const rigTip=new THREE.CatmullRomCurve3([J.skull,J.chest,J.backArch,J.secondDip,J.tailTip]);
const widths=[.2,.8,.9,.52,.06];
const faceStartChildCount=dragon.children.length;
// ---------------------------------- 2. SKULL AND MANDIBLE ----------------------------------
// A custom non-cylindrical sectional head: broad skull + brow, compact snout.
function loftX(frames,color,radial=24,parent=dragon){
 const vert=[],tri=[];
 frames.forEach(f=>{
  for(let i=0;i<radial;i++){
   const a=i*2*Math.PI/radial;
   vert.push(f.x,f.y+Math.cos(a)*f.h,f.z+Math.sin(a)*f.w);
  }
 });
 for(let i=0;i<frames.length-1;i++)for(let j=0;j<radial;j++){
  const a=i*radial+j,b=i*radial+(j+1)%radial,c=(i+1)*radial+j,d=(i+1)*radial+(j+1)%radial;
  tri.push(a,c,b,b,c,d);
 }
 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.Float32BufferAttribute(vert,3));g.setIndex(tri);
 g.computeVertexNormals();return part(g,color,parent);
}
const skullFrames=[
 {x:-14.5,y:7.42,z:2,w:.06,h:.10},
 {x:-14.0,y:7.49,z:2,w:.48,h:.38},
 {x:-13.2,y:7.65,z:2,w:.72,h:.48},
 {x:-12.5,y:7.98,z:2,w:.98,h:.64},
 {x:-11.7,y:8.43,z:2,w:1.35,h:.94},
 {x:-10.9,y:8.63,z:2,w:1.73,h:1.36},
 {x:-10.1,y:8.54,z:1.9,w:1.90,h:1.58},
 {x:-9.28,y:8.14,z:1.84,w:1.73,h:1.38},
 {x:-8.69,y:7.47,z:1.74,w:1.30,h:.97},
];

// Angular arched upper brow and brow-to-muzzle ridge (NOT elongated crocodile slab)

 {x:-14.3,y:7.85,z:2,w:.09,h:.08},
 {x:-13.58,y:8.17,z:2,w:.47,h:.14},
 {x:-12.65,y:8.66,z:2,w:.72,h:.18},
 {x:-11.73,y:9.14,z:2,w:1.06,h:.26},
 {x:-10.98,y:9.61,z:1.95,w:1.22,h:.33},

],'cobalt',16);
// Jaw two separate arms with a huge BLACK mouth cavity, not a flat lower plank.
const lower=[
 {x:-13.80,y:4.83,z:2.01,w:.16,h:.17},
 {x:-13.27,y:4.66,z:2.01,w:.45,h:.30},
 {x:-12.54,y:4.65,z:2,w:.66,h:.32},
 {x:-11.82,y:4.92,z:1.98,w:.82,h:.41},
 {x:-10.94,y:5.50,z:1.89,w:1.11,h:.51},
 {x:-10.04,y:6.48,z:1.81,w:1.19,h:.55},
 {x:-9.65,y:6.92,z:1.79,w:.91,h:.48}
];
mass(V(-12.1,6.11,2),[2.08,.68,.59],'throat',2);
mass(V(-10.7,6.86,1.96),[1.05,.80,.89],'throat',1);
loftX(lower,'cobalt',20);
mass(V(-13.24,4.70,2.05),[.51,.28,.65],'azure',1);
mass(V(-12.40,5.04,2.04),[.76,.15,.47],'ocean',1);
for(const side of [-1,1]){
 const cheek=mass(V(-9.95,8.02,1.92+side*1.15),[.86,.94,.69],'abyss',1);
 cheek.rotation.z=-.22;
 stick(V(-9.58,7.50,1.95+side*.95),V(-10.47,5.94,1.94+side*.99),.51,.25,'indigo');
 stick(V(-10.47,5.94,1.94+side*.99),V(-12.07,4.88,1.96+side*.68),.27,.14,'azure');
 // Eye socket + pupil on OUTER cheek facing viewer.
 mass(V(-11.26,8.92,1.95+side*1.47),[.65,.27,.18],'throat',1);
 const eye=mass(V(-11.33,8.93,1.94+side*1.66),[.46,.105,.07],'eye',1);
 eye.rotation.z=-.30;
 stick(V(-12.03,9.23,1.95+side*1.62),V(-10.69,9.40,1.94+side*1.50),.21,.09,'abyss');
 // Four large curled fangs and eight smaller teeth.
 for(const x of [-13.23,-11.73]){
  const zz=1.99+side*(x<-12.4?.56:1.03);
  stick(V(x,7.06+(x>-12.4?.23:0),zz),
        V(x-.20,5.58,zz+side*.08),.27,.10,'tooth');
  stick(V(x-.20,5.58,zz+side*.08),
        V(x+.02,5.23,zz+side*.04),.10,.012,'tooth');
 }
 for(let k=0;k<4;k++){
  const x=-13.38+k*.61,z=2+side*(.37+k*.15);
  stick(V(x,7.26+k*.10,z),V(x-.03,6.55+k*.05,z),.11,.015,'tooth');
  stick(V(x,4.70+k*.30,z),V(x+.08,5.57+k*.20,z),.11,.012,'tooth');
 }
 // Real branching antlers emerge through thick roots, rearward and wide.
 const antlerSegments=[
  [[-9.97,9.71,2+side*.88],[-9.57,11.13,2+side*1.05],.40,.30],
  [[-9.57,11.13,2+side*1.05],[-8.90,12.31,2+side*1.43],.30,.20],
  [[-8.90,12.31,2+side*1.43],[-7.25,13.10,2+side*1.72],.20,.02],
  [[-9.49,11.44,2+side*1.14],[-10.16,12.68,2+side*1.99],.18,.012],
  [[-8.85,12.40,2+side*1.48],[-8.79,13.77,2+side*2.07],.17,.012],
  [[-8.13,12.82,2+side*1.56],[-7.02,13.99,2+side*1.29],.13,.012],
 ];
 for(const [a,b,w,v] of antlerSegments)stick(V(...a),V(...b),w,v,'horn');
 // Paired whiskers curl naturally away from snout, not laser-straight.
 strand([V(-13.90,7.28,2+side*.53),V(-15.03,6.67,2+side*1.23),
 V(-16.37,6.29,2+side*2.51),V(-17.50,7.02,2+side*3.10),
 V(-18.27,7.83,2+side*2.62)],.055,'water');
 strand([V(-13.23,6.94,2+side*.70),V(-14.28,6.01,2+side*1.41),
 V(-15.12,5.79,2+side*2.2),V(-16.0,6.55,2+side*2.46)],.033,'cyan');
 // Sweep of gill-like cheek fins.
 for(let i=0;i<11;i++){
   const t=i/10,from=V(-9.75+t*2.65,7.65+t*.18,1.87+side*(1.58+.18*t));
   const to=from.clone().add(V(.73,.45+.14*(i%4),side*(.43+.17*t)));
   fan(from,to,.41,i%4===0?'cyan':i%2===0?'ocean':'jade');
 }
}
// The head is one rigid joint-linked assembly. Scaling its geometry about
// the skull anchor changes the anatomical proportion, not merely its camera zoom.
const faceAnchor=J.skull.clone();
const facialObjects=dragon.children.slice(faceStartChildCount);
const faceRoot=new THREE.Group();faceRoot.position.copy(faceAnchor);
for(const obj of facialObjects){
  faceRoot.add(obj);
  obj.position.sub(faceAnchor);
}
faceRoot.scale.setScalar(1.36);dragon.add(faceRoot);
// ---------------------------------- 3. SKELETAL BODY ----------------------------------
// Mesh is SKINNED TO A SINGLE CURVE THROUGH THE BONES above (no disconnected torus).
const segments=140,sides=24,vertices=[],colors=[],indexes=[],frames=[];
const blue1=new THREE.Color(paint.indigo),blue2=new THREE.Color(paint.cobalt);
for(let i=0;i<=segments;i++){
 const t=i/segments,center=bodyPath.getPoint(t),tangent=bodyPath.getTangent(t).normalize();
 const lateral=new THREE.Vector3().crossVectors(tangent,UP).normalize();
 if(lateral.lengthSq()<.01)lateral.set(0,0,1);
 const dorsal=new THREE.Vector3().crossVectors(lateral,tangent).normalize();
 const r=radius(t);frames.push({center,tangent,lateral,dorsal,r});
 for(let j=0;j<sides;j++){
  const a=2*Math.PI*j/sides,n=dorsal.clone().multiplyScalar(Math.cos(a)).addScaledVector(lateral,Math.sin(a));
  const p=center.clone().addScaledVector(n,r);
  vertices.push(p.x,p.y,p.z);
  const belly=Math.cos(a)<-.54;
  const wave=.5+.5*Math.sin(i*.10+j*.28);
  const col=belly?new THREE.Color(paint.belly):blue1.clone().lerp(blue2,wave*.54);
  colors.push(col.r,col.g,col.b);
 }
}
for(let i=0;i<segments;i++)for(let j=0;j<sides;j++){
 const a=i*sides+j,b=i*sides+(j+1)%sides,c=(i+1)*sides+j,d=(i+1)*sides+(j+1)%sides;
 indexes.push(a,c,b,b,c,d);
}
const bg=new THREE.BufferGeometry();
bg.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));
bg.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
bg.setIndex(indexes);bg.computeVertexNormals();
const body=part(bg,'indigo');body.material=new THREE.MeshStandardMaterial({vertexColors:true,side:THREE.DoubleSide,roughness:.68});
// Skin is broad overlapping scales following the SAME normals as skeleton.
const scaleShape=new THREE.Shape();scaleShape.moveTo(-.61,-.30);
scaleShape.lineTo(-.38,.25);scaleShape.lineTo(.05,.35);
scaleShape.lineTo(.58,.04);scaleShape.lineTo(.56,-.25);
scaleShape.lineTo(-.08,-.34);scaleShape.closePath();
const scaleGeometry=new THREE.ExtrudeGeometry(scaleShape,
 {depth:.12,bevelEnabled:true,bevelSize:.026,bevelThickness:.024,bevelSegments:1});
scaleGeometry.translate(0,0,-.06);
const batch=new Map(),dummy=new THREE.Object3D(),Z=V(0,0,1);
function instance(name,pos,quat,size){
 if(!batch.has(name))batch.set(name,[]);
 dummy.position.copy(pos);dummy.quaternion.copy(quat);dummy.scale.copy(size);
 dummy.updateMatrix();batch.get(name).push(dummy.matrix.clone());
}
for(let i=2;i<segments-1;i+=2){
 const t=i/segments,f=frames[i];
 for(let j=0;j<sides;j++){
  const ang=(j+(i%4===0?.3:0))*2*Math.PI/sides;
  const n=f.dorsal.clone().multiplyScalar(Math.cos(ang)).addScaledVector(f.lateral,Math.sin(ang)).normalize();
  const p=f.center.clone().addScaledVector(n,f.r+.09);
  const q=new THREE.Quaternion().setFromUnitVectors(Z,n);
  const under=Math.cos(ang)<-.54,wave=Math.sin(i*.14+j*.64);
  const name=under?'belly':Math.cos(ang)>.7?(wave>.38?'jade':'ocean'):
    wave>.70?'cyan':wave>.18?'azure':wave>-.32?'cobalt':'indigo';
  instance(name,p,q,V(.72,.72,1));
 }
 if(i%4===0){
  // Continuous backward-flowing mane follows backbone from neck to tail.
  for(const side of [-.24,.17,.43]){
   const n=f.dorsal.clone().multiplyScalar(Math.cos(side)).addScaledVector(f.lateral,Math.sin(side));
   const from=f.center.clone().addScaledVector(n,f.r-.02);
   const to=from.clone().addScaledVector(n,.64+(1-t)*.62).addScaledVector(f.tangent,-.49);
   fan(from,to,.38,i%8===0?'cyan':'ocean');
  }
 }
}
for(const [name,matrices] of batch){
 const mesh=new THREE.InstancedMesh(scaleGeometry,materials[name],matrices.length);
 matrices.forEach((m,i)=>mesh.setMatrixAt(i,m));mesh.frustumCulled=false;mesh.instanceMatrix.needsUpdate=true;
 dragon.add(mesh);
}
// ---------------------------------- 4. TWO GIANT FOREPAWS ----------------------------------
function foreleg(sign){
 const shoulder=J.chest.clone().add(V(-.25,.18,sign*2.03));
 const upper=shoulder.clone().add(V(-.48,-1.27,sign*1.12));
 const elbow=upper.clone().add(V(-.30,-.66,sign*.52));
 const wrist=elbow.clone().add(V(-.96,-1.09,sign*.37));
 mass(shoulder,[.90,.88,.90],'abyss',1);
 stick(shoulder,upper,.79,.63,'cobalt');
 mass(elbow,[.71,.68,.69],'indigo',1);
 stick(elbow,wrist,.59,.37,'azure');
 const paw=mass(wrist,[.86,.47,.75],'indigo',1);paw.rotation.z=-.16;
 for(let i=-1;i<=1;i++){
  const p=wrist.clone().add(V(-.36,-.08,i*.37));
  const tip=p.clone().add(V(-1.00,-.40,i*.09));
  stick(p,tip,.21,.016,'tooth');
 }
}

// Organic ice plume fans UP from the last skeletal point.
const tail=J.tailTip,tailTangent=bodyPath.getTangent(1);
for(let i=0;i<18;i++){
 const a=i*2*Math.PI/18;
 const radial=V(Math.cos(a),.25*Math.sin(a),Math.sin(a)).normalize();
 const tip=tail.clone().addScaledVector(radial,2.10+(i%4)*.19)
   .addScaledVector(tailTangent,1.3);
 fan(tail,tip,.48,i%4===0?'cyan':'ocean');
}
// Water vapor cubes, secondary; no floating blocks in front of the face.
for(const p of [V(0,2,-5),V(7,4,5),V(11,8,-4)]){
 for(let i=0;i<26;i++){
  const a=i*2.39996,r=.25+(i%5)*.18;
  const m=part(new THREE.BoxGeometry(.32+(i%3)*.14,.30+(i%4)*.12,.34+(i%3)*.18),'cloud');
  m.position.copy(p).add(V(Math.cos(a)*r,Math.sin(a*.7)*r*.55,Math.sin(a)*r));
 }
}
const floor=part(new THREE.PlaneGeometry(150,150),'abyss',scene);
floor.rotation.x=-Math.PI/2;floor.position.y=-3.2;
const grid=new THREE.GridHelper(80,40,0x1b3747,0x122331);
grid.position.y=-3.18;scene.add(grid);
// Camera controls. FIRST SHOW COMPLETE SKELETON SILHOUETTE, not cropped face.
dragon.updateMatrixWorld(true);
const box=new THREE.Box3().setFromObject(dragon);
const mid=box.getCenter(V(0,0,0)),dims=box.getSize(V(0,0,0));
let yaw=-.39,pitch=.08,distance=48,focus=mid.clone(),spin=false,view='front';
function fit(){
 const t=Math.tan(camera.fov*Math.PI/360),a=Math.max(camera.aspect,.45);
 return Math.min(115,Math.max(dims.x/(2*t*a),dims.y/(2*t))*1.13+dims.z*.40);
}
function setView(which){
 view=which;spin=false;
 document.getElementById('spin').classList.remove('active');
 document.getElementById('spin').textContent='自動回転 OFF';
 if(which==='front'){yaw=-.39;pitch=.08;focus.copy(mid);distance=fit()}
 if(which==='side'){yaw=0;pitch=.03;focus.copy(mid);distance=fit()}
 if(which==='back'){yaw=Math.PI+.04;pitch=.12;focus.copy(mid);distance=fit()}
 if(which==='head'){yaw=-.38;pitch=.04;focus.copy(J.skull).add(V(-2.7,-.5,.2));distance=camera.aspect<1.15?27:23}
}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
document.getElementById('zoomin').onclick=()=>distance=Math.max(7,distance*.82);
document.getElementById('zoomout').onclick=()=>distance=Math.min(140,distance*1.21);
document.getElementById('spin').onclick=e=>{
 spin=!spin;e.currentTarget.classList.toggle('active',spin);
 e.currentTarget.textContent=spin?'自動回転 ON':'自動回転 OFF';
};
let showingRig=false;
document.getElementById('rig').onclick=e=>{
 showingRig=!showingRig;debug.visible=showingRig;dragon.visible=!showingRig;
 e.currentTarget.classList.toggle('active',showingRig);
 e.currentTarget.textContent=showingRig?'完成表示':'骨格確認';
};
const pointers=new Map();let lastPinch=0;
canvas.addEventListener('pointerdown',e=>{
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{
 const p=pointers.get(e.pointerId);if(!p)return;
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===1){
  yaw-=(e.clientX-p.x)*.006;pitch=Math.max(-1,Math.min(1.1,pitch+(e.clientY-p.y)*.004));
  spin=false;
 }else if(pointers.size===2){
  const arr=[...pointers.values()],dd=Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y);
  if(lastPinch)distance=Math.min(145,Math.max(7,distance*lastPinch/dd));lastPinch=dd;
 }
});
for(const e of ['pointerup','pointercancel','lostpointercapture'])
 canvas.addEventListener(e,p=>{pointers.delete(p.pointerId);lastPinch=0});
canvas.addEventListener('wheel',e=>{
 e.preventDefault();distance=Math.max(7,Math.min(145,distance*(1+Math.sign(e.deltaY)*.1)));
},{passive:false});
function resize(){
 renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 if(view==='front'||view==='side'||view==='back')distance=fit();
}
addEventListener('resize',resize);resize();setView('front');
document.getElementById('status').style.display='none';
function render(){
 requestAnimationFrame(render);if(spin)yaw+=.0015;
 const cp=Math.cos(pitch);
 camera.position.set(focus.x+distance*Math.sin(yaw)*cp,focus.y+distance*Math.sin(pitch),focus.z+distance*Math.cos(yaw)*cp);
 camera.lookAt(focus);renderer.render(scene,camera);
}
render();
window.seiryuModelRevision='SKELETON-RIG51-PROPORTIONS';

</script>
