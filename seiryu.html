<!doctype html>

<head>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09131d;color:#e4faff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
#stage{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
.top{position:absolute;z-index:2;top:0;left:0;right:0;padding:17px 20px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;pointer-events:none;background:linear-gradient(#07121add,transparent)}
.brand{font-size:11px;letter-spacing:.24em;color:#7ba8b8;font-weight:900}

.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid #35707b;background:#0a2634c9;color:#9ae8eb;border-radius:30px;font-size:11px;padding:7px 11px;font-weight:750}

.tools{position:absolute;bottom:22px;z-index:3;display:flex;justify-content:center;gap:8px;left:12px;right:12px;flex-wrap:wrap}
.tools button{touch-action:manipulation;border:1px solid #3e7184;background:#102839df;color:#d9f5fd;padding:11px 15px;border-radius:12px;min-height:44px;font-size:13px;font-weight:760;cursor:pointer;backdrop-filter:blur(10px)}
.tools button:hover{background:#204658}
.tools button.active{border-color:#51dddc;color:#79ffff;background:#184959}
.note{position:absolute;left:18px;bottom:89px;color:#9db7c3;font-size:11px;pointer-events:none}
#status{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);background:#091b2ad9;padding:14px 18px;border-radius:14px;text-align:center;font-size:13px;z-index:1;border:1px solid #365566}
@media(max-width:600px){.top{padding:12px}.tools{gap:5px;bottom:10px}.tools button{font-size:12px;padding:8px 10px}.note{bottom:100px;left:12px;font-size:10px}.pill{font-size:10px;padding:5px 7px}}

<body>
<canvas id="stage" aria-label="青龍の360度回転可能な3Dモデル"></canvas>
<div class="top"><div><div class="brand">NEXACRAFT · GUARDIAN BEAST</div><div class="name">青龍 <span style="font-size:.49em;color:#9fd5e1">SEIRYU</span></div><div class="sub">AZURE DRAGON / 3D VOXEL MODEL</div></div><div class="pill"><span class="dot"></span> REAL 3D</div></div>
<div id="status">青龍の詳細3Dモデルを読み込み中…</div>
<div class="note">ドラッグで回転 · ピンチ/スクロールで拡大縮小</div>
<div class="tools"><button data-view="front">斜め</button><button data-view="side">側面</button><button data-view="back">背面</button><button data-view="head">顔アップ</button><button id="zoomout">－</button><button id="zoomin">＋</button><button id="spin" class="active">自動回転 ON</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/+esm';
const canvas=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.52;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x09131d);
scene.fog=new THREE.Fog(0x09131d,40,100);
const camera=new THREE.PerspectiveCamera(39,innerWidth/innerHeight,.1,170);
scene.add(new THREE.HemisphereLight(0xa4e9ff,0x253344,2.4));
const key=new THREE.DirectionalLight(0xd8f5ff,4.7);key.position.set(-11,22,20);scene.add(key);
const rim=new THREE.DirectionalLight(0x2aaaff,5);rim.position.set(9,13,-14);scene.add(rim);
const glow=new THREE.PointLight(0x1bdde7,70,40);glow.position.set(-10,6,9);scene.add(glow);
const dragon=new THREE.Group();scene.add(dragon);
const materials={
deep:new THREE.MeshStandardMaterial({color:0x062661,roughness:.67,metalness:.10}),
blue:new THREE.MeshStandardMaterial({color:0x1156bb,roughness:.48,metalness:.12}),
royal:new THREE.MeshStandardMaterial({color:0x237bdc,roughness:.42,metalness:.12}),
sky:new THREE.MeshStandardMaterial({color:0x56c6e8,roughness:.38,metalness:.15}),
mint:new THREE.MeshStandardMaterial({color:0x5eeadf,roughness:.43}),
teal:new THREE.MeshStandardMaterial({color:0x1599a9,roughness:.42}),
belly:new THREE.MeshStandardMaterial({color:0xd9c8aa,roughness:.82}),
bellyShadow:new THREE.MeshStandardMaterial({color:0xa59c8e,roughness:.78}),
horn:new THREE.MeshStandardMaterial({color:0xc6b69e,roughness:.92}),
tooth:new THREE.MeshStandardMaterial({color:0xf1e5cf,roughness:.56}),
eye:new THREE.MeshBasicMaterial({color:0x58ffff}),
black:new THREE.MeshStandardMaterial({color:0x071c2d,roughness:.88}),
water:new THREE.MeshStandardMaterial({color:0x7ff5ff,emissive:0x0ba1b1,emissiveIntensity:.66,transparent:true,opacity:.80,roughness:.28}),
cloud:new THREE.MeshStandardMaterial({color:0xa6dfff,transparent:true,opacity:.46,roughness:.3,depthWrite:false})
};
function mesh(geo,mat,group=dragon){const m=new THREE.Mesh(geo,materials[mat]||mat);group.add(m);return m;}
function cube(x,y,z,sx,sy,sz,mat,group=dragon){const m=mesh(new THREE.BoxGeometry(sx,sy,sz),mat,group);m.position.set(x,y,z);return m;}
const Y=new THREE.Vector3(0,1,0);
function rod(a,b,r1,r2,mat,group=dragon,sides=6){
 const from=new THREE.Vector3(...a),to=new THREE.Vector3(...b),dir=to.clone().sub(from);
 const m=mesh(new THREE.CylinderGeometry(r2,r1,dir.length(),sides),mat,group);
 m.position.copy(from).add(to).multiplyScalar(.5);
 m.quaternion.setFromUnitVectors(Y,dir.normalize());return m;
}
// Reference-based Seiryu rebuild: elevated S-curve, monumental head, open maw,
// carved antlers, dense overlapping scale rows, whiskers and floating water clouds.
// Everything below is a genuine Three.js mesh (not a background illustration).
const qId=new THREE.Quaternion(),yAxis=new THREE.Vector3(0,1,0);
const bodyPath=new THREE.CatmullRomCurve3([
 new THREE.Vector3(-7.7,7.35,3.35),new THREE.Vector3(-5.8,6.2,3.8),
 new THREE.Vector3(-4.3,3.8,3.95),new THREE.Vector3(-1.7,1.45,3.75),
 new THREE.Vector3(1.8,1.3,3.05),new THREE.Vector3(4.8,2.95,.15),
 new THREE.Vector3(6.7,5.75,-2.05),new THREE.Vector3(9.25,6.2,-2.2),
 new THREE.Vector3(10.8,3.35,.1),new THREE.Vector3(9.9,1.8,3.15),
 new THREE.Vector3(11.8,1.95,3.75),new THREE.Vector3(13.6,4.0,1.6),
 new THREE.Vector3(15.8,6.9,-1.6)
],false,'catmullrom',.48);
const bodyRadius=t=>t<.22?2.2+Math.sin(t/.22*Math.PI)*.17:
 t<.64?2.35-.25*((t-.22)/.42):Math.max(.45,2.15*(1-(t-.64)/.36));
const bodyScales=new Map();
const boxGeo=new THREE.BoxGeometry(1,1,1);
function scalePart(material,position,orientation,sx,sy,sz){
 if(!bodyScales.has(material))bodyScales.set(material,[]);
 bodyScales.get(material).push({position:position.clone(),orientation:orientation.clone(),sx,sy,sz});
}
function blockInst(material,x,y,z,sx,sy,sz,angle=0){
 const q=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),angle);
 scalePart(material,new THREE.Vector3(x,y,z),q,sx,sy,sz);
}
function finalizeInstances(){
 const dummy=new THREE.Object3D();
 for(const [material,items] of bodyScales){
  if(!items.length)continue;
  const inst=new THREE.InstancedMesh(boxGeo,materials[material],items.length);
  inst.castShadow=false;inst.frustumCulled=false;
  items.forEach((it,i)=>{dummy.position.copy(it.position);dummy.quaternion.copy(it.orientation);
   dummy.scale.set(it.sx,it.sy,it.sz);dummy.updateMatrix();inst.setMatrixAt(i,dummy.matrix)});
  inst.instanceMatrix.needsUpdate=true;dragon.add(inst);
 }
}
const forward=new THREE.Vector3(),sideV=new THREE.Vector3(),upV=new THREE.Vector3();
const radial=new THREE.Vector3(),around=new THREE.Vector3(),basis=new THREE.Matrix4(),rot=new THREE.Quaternion();
function ringFrame(t){
 forward.copy(bodyPath.getTangent(t)).normalize();
 sideV.crossVectors(forward,yAxis).normalize();
 if(sideV.length()<.1)sideV.set(0,0,1);
 upV.crossVectors(sideV,forward).normalize();
 return {forward:forward.clone(),side:sideV.clone(),up:upV.clone()};
}
const segmentCount=123,aroundCount=21;
for(let i=0;i<segmentCount;i++){
 const t=i/(segmentCount-1),p=bodyPath.getPoint(t),r=bodyRadius(t);
 const frame=ringFrame(t),tg=frame.forward,s=frame.side,u=frame.up;
 const t2=Math.min(1,t+1/(segmentCount-1));
 if(i<segmentCount-1){
  const p2=bodyPath.getPoint(t2),dir=p2.clone().sub(p);
  const core=mesh(new THREE.CylinderGeometry(bodyRadius(t2)*.92,r*.92,dir.length()*1.34,10),t<.25?'blue':'deep');
  core.position.copy(p).add(p2).multiplyScalar(.5);
  core.quaternion.setFromUnitVectors(yAxis,dir.normalize());
 }
 for(let j=0;j<aroundCount;j++){
  const angle=(j+(i%2)*.5)*2*Math.PI/aroundCount;
  const c=Math.cos(angle),sin=Math.sin(angle);
  radial.copy(u).multiplyScalar(c).addScaledVector(s,sin).normalize();
  around.crossVectors(radial,tg).normalize();
  basis.makeBasis(tg,around,radial);
  rot.setFromRotationMatrix(basis);
  const v=p.clone().addScaledVector(radial,r*.99);
  // Continuous sand-colored ventral armor, indigo side scales and cyan crest.
  const belly=c<-.56;
  let mat;
  if(belly)mat=(i%5===0?'bellyShadow':'belly');
  else if(c>.57&&j%4===0)mat='mint';
  else if(c>.48&&Math.sin(i*.77+j*.86)>.15)mat='sky';
  else if(c>.04&&Math.sin(i*.52+j*2.18)>.46)mat='teal';
  else mat=(i+j)%3===0?'royal':j%4===0?'blue':'deep';
  const length=Math.max(.28,bodyPath.getLength()/segmentCount*.98);
  const width=2*Math.PI*r/aroundCount*1.06;
  scalePart(mat,v,rot,length,width,belly?.17:.26);
 }
 // A stepped, layered crest with individual turquoise spines.
 if(i%2===0&&i<segmentCount-5){
  const a=p.clone().addScaledVector(u,r-.04);
  const tip=a.clone().addScaledVector(u,.76+(1-t)*.83).addScaledVector(tg,-.38);
  rod(a.toArray(),tip.toArray(),.21,.027,i%4===0?'sky':i%3===0?'mint':'teal',dragon,4);
 }
 if(i%4===0&&i<85){
  // Two swept-over fin rows, rather than a thin single mohawk.
  for(const sign of [-1,1]){
   const n=u.clone().multiplyScalar(.72).addScaledVector(s,sign*.70).normalize();
   const a=p.clone().addScaledVector(n,r-.02);
   const b=a.clone().addScaledVector(n,.58+(1-t)*.49).addScaledVector(tg,-.35);
   rod(a.toArray(),b.toArray(),.19,.02,i%3===0?'sky':'mint',dragon,4);
  }
 }
}
const head=new THREE.Group();head.position.copy(bodyPath.getPoint(0));head.rotation.y=-.10;dragon.add(head);
// Surface voxel volume creates a tapered cranium, NOT one rectangular cube.
function headVoxel(cx,cy,cz,rx,ry,rz,unit,kind,cut=null){
 const minX=Math.floor((cx-rx)/unit),maxX=Math.ceil((cx+rx)/unit);
 const minY=Math.floor((cy-ry)/unit),maxY=Math.ceil((cy+ry)/unit);
 const minZ=Math.floor((cz-rz)/unit),maxZ=Math.ceil((cz+rz)/unit);
 for(let xi=minX;xi<=maxX;xi++)for(let yi=minY;yi<=maxY;yi++)for(let zi=minZ;zi<=maxZ;zi++){
  const x=xi*unit,y=yi*unit,z=zi*unit;
  const n=((x-cx)/rx)**2+((y-cy)/ry)**2+((z-cz)/rz)**2;
  if(n>1.05||n<.33||(cut&&cut(x,y,z)))continue;
  const jitter=(Math.sin(xi*13.6+yi*4.9+zi*7.2)+1)*.5;
  const mat=kind==='jaw'?jitter>.73?'sky':jitter>.35?'royal':'blue':
   kind==='under'?'belly':
   y>cy+.4*ry?(jitter>.70?'mint':jitter>.35?'sky':'royal'):
   jitter>.80?'teal':jitter>.31?'royal':'deep';
  const q=new THREE.Quaternion();
  const pos=new THREE.Vector3(x+head.position.x,y+head.position.y,z+head.position.z);
  // Since head group rotates, transform local parts into the world dragon.
  pos.sub(head.position).applyAxisAngle(yAxis,head.rotation.y).add(head.position);
  scalePart(mat,pos,q,unit*1.025,unit*1.025,unit*1.025);
 }
}
headVoxel(-.22,.15,0,2.30,1.67,1.76,.34,'head');
headVoxel(-2.32,-.13,0,1.99,.84,1.38,.29,'jaw');
headVoxel(-2.63,-1.76,0,1.80,.52,1.25,.29,'jaw');
headVoxel(.78,-.82,0,1.38,.92,1.35,.31,'under');
// Open, cavernous jaws: dark throat, turquoise interior and long saber fangs.
cube(-2.15,-1.00,0,2.5,1.12,2.35,'black',head);
cube(-2.43,-1.52,.04,1.73,.19,1.35,'teal',head);
for(const sign of [-1,1]){
 for(let k=0;k<6;k++){
  const x=-3.74+k*.51,z=sign*(.65+(k%2)*.18);
  rod([x,-.42,z],[x-.13,-1.30-(k%3)*.15,z],.16,.009,'tooth',head,5);
  rod([x,-1.57,z],[x-.18,-1.13,z],.13,.012,'tooth',head,5);
 }
 // Prominent ivory canine tusk, curved at tip
 rod([-3.15,-.31,sign*1.06],[-3.40,-1.50,sign*1.15],.28,.11,'tooth',head,7);
 rod([-3.40,-1.50,sign*1.15],[-3.20,-1.94,sign*1.09],.11,.015,'tooth',head,7);
 // Turquoise luminous eyes within sharp angled eyelids.
 cube(-1.05,.84,sign*1.67,.83,.38,.29,'black',head);
 cube(-1.14,.85,sign*1.84,.57,.26,.13,'eye',head);
 const brow=cube(-1.02,1.16,sign*1.72,1.32,.31,.35,'sky',head);
 brow.rotation.z=.18;
 cube(-.13,1.11,sign*1.62,.88,.34,.30,'teal',head);
 // Staggered scale layers around jaw hinge.
 for(let k=0;k<10;k++){
  const x=.4+k*.22,y=.94-(k%4)*.30;
  cube(x,y,sign*(1.78+.09*(k%3)),.55,.42,.25,k%3===0?'mint':k%2?'royal':'sky',head);
 }
 // Pale branched horn antlers, extended rearward over the crest.
 rod([.3,1.55,sign*.93],[.89,3.12,sign*1.32],.37,.27,'horn',head,6);
 rod([.89,3.12,sign*1.32],[2.1,4.30,sign*1.47],.27,.13,'horn',head,6);
 rod([2.1,4.30,sign*1.47],[2.82,5.12,sign*1.53],.13,.012,'tooth',head,5);
 rod([.96,3.28,sign*1.34],[1.02,4.37,sign*2.02],.17,.018,'horn',head,5);
 rod([1.53,3.88,sign*1.47],[2.59,4.49,sign*2.20],.15,.012,'horn',head,5);
 rod([.83,2.73,sign*1.25],[.08,3.73,sign*1.85],.15,.012,'horn',head,5);
 // Three free-flowing, jointed watery whiskers.
 for(let branch=0;branch<2;branch++){
  const whisker=new THREE.CatmullRomCurve3([
    new THREE.Vector3(-3.50,-.18-branch*.32,sign*1.08),
    new THREE.Vector3(-4.60,-.42-branch*.45,sign*2.55),
    new THREE.Vector3(-6.25,-1.06-branch*.60,sign*3.22),
    new THREE.Vector3(-7.10,.28-branch*.20,sign*4.42),
    new THREE.Vector3(-8.0,-.04-branch*.4,sign*5.05)
  ]);
  mesh(new THREE.TubeGeometry(whisker,34,.050-branch*.011,5,false),'water',head);
 }
 // Stacked gill fins spreading outwards from the cheek.
 for(let j=0;j<10;j++){
  const x=.05+j*.30,y=.69-(j%4)*.25,z=sign*(1.70+j*.105);
  rod([x,y,z],[x+.26,y+.62+(j%3)*.15,z+sign*.52],.24,.015,j%3===0?'mint':j%2?'teal':'sky',head,4);
 }
}
// Nasal plates and serrated crown.
for(let j=0;j<9;j++){
 const x=-3.75+j*.33;
 cube(x,.46+(j%3)*.14,0,.41,.24,.51,j%2?'sky':'mint',head);
}
for(let i=0;i<21;i++){
 const x=-1.2+i*.22;
 const z=Math.sin(i*.85)*.83;
 const h=.5+(i%5)*.18;
 rod([x,1.43,z],[x+.35,1.43+h,z+.12],.20,.017,i%4===0?'mint':i%2?'royal':'sky',head,4);
}
// Voluminous turquoise mane: four overlapping flared layers, densely nested.
for(let k=0;k<67;k++){
 const x=.65+(k%22)*.185;
 const ring=Math.floor(k/22),sign=ring===0?-1:ring===1?1:0;
 const a=[x,.67+(k%4)*.21,sign*(1.42+(k%5)*.14)];
 const b=[x+.28+(k%6)*.14,1.45+(k%5)*.24,sign*(2.05+(k%4)*.18)];
 rod(a,b,.25,.025,k%5===0?'mint':k%2?'sky':'teal',head,4);
}
// Muscular, articulated legs with three ivory hooks per claw.
function legAt(t,sgn){
 const p=bodyPath.getPoint(t),frame=ringFrame(t),side=frame.side;
 const a=p.clone().addScaledVector(side,sgn*bodyRadius(t)*.62).add(new THREE.Vector3(0,-.50,0));
 const elbow=a.clone().addScaledVector(side,sgn*1.40).add(new THREE.Vector3(.52,-1.13,.20));
 const wrist=elbow.clone().addScaledVector(side,sgn*.46).add(new THREE.Vector3(-.50,-1.40,.22));
 rod(a.toArray(),elbow.toArray(),.64,.43,'deep',dragon,7);
 rod(elbow.toArray(),wrist.toArray(),.50,.37,'royal',dragon,7);
 const paw=wrist.clone().add(new THREE.Vector3(-.18,-.13,.16));
 cube(paw.x,paw.y,paw.z,1.22,.57,1.13,'blue');
 for(const f of [-1,0,1]){
  const start=paw.clone().add(new THREE.Vector3(-.47,-.12,f*.38));
  const end=start.clone().add(new THREE.Vector3(-.83,-.40,f*.13));
  rod(start.toArray(),end.toArray(),.215,.02,'tooth',dragon,5);
 }
 for(let j=0;j<6;j++){
  const pt=a.clone().lerp(elbow,(j+.3)/7);
  cube(pt.x,pt.y,pt.z,.25,.25,.28,j%3===0?'sky':'royal');
 }
}
// Seiryu has exactly two forelegs (left and right), and no hindlegs.
for(const sign of [-1,1])legAt(.16,sign);
// Fan-shaped streaming tail, with a large upturned ice-blue brush.
const tip=bodyPath.getPoint(1),last=ringFrame(.995);
for(let j=0;j<26;j++){
 const angle=2*Math.PI*j/26;
 const n=last.up.clone().multiplyScalar(Math.cos(angle)).addScaledVector(last.side,Math.sin(angle));
 const root=tip.clone().addScaledVector(n,.19);
 const outer=root.clone().addScaledVector(n,1.1+(j%4)*.23).addScaledVector(last.forward,1.5+(j%5)*.22);
 rod(root.toArray(),outer.toArray(),.20,.012,j%3===0?'mint':j%2?'sky':'teal',dragon,4);
}
// Translucent voxel-water clouds, positioned around the dragon rather than
// blocking its face: individual cubes remain independently three-dimensional.
function blockCloud(cx,cy,cz,size,seed){
 for(let k=0;k<46;k++){
  const a=k*2.399963+seed,b=k*.79+seed;
  const r=.16+Math.sqrt(k/46)*size;
  const x=cx+Math.cos(a)*r*1.30,y=cy+Math.sin(b)*r*.49,z=cz+Math.sin(a)*r*.71;
  const s=.17+(k%4)*.18;
  blockInst(k%8===0?'water':'cloud',x,y,z,s*1.23,s,s*1.12);
 }
}
for(const p of [[-3,1,-2,1.25],[.5,6.6,-1.5,1.65],[4.6,.4,5.0,1.25],[7.1,7.5,1.5,1.55],[10.8,2.5,-4.7,1.25],[13.0,4.7,4.3,1.55],[16.8,5.4,-3.4,1.20]])blockCloud(...p,.7);
finalizeInstances();
// Ground and soft scene lighting
const ground=mesh(new THREE.PlaneGeometry(190,190),new THREE.MeshStandardMaterial({color:0x0b1822,roughness:.88}),scene);
ground.rotation.x=-Math.PI/2;ground.position.y=-5.4;
const grid=new THREE.GridHelper(80,40,0x16435a,0x173147);grid.position.y=-5.38;scene.add(grid);
let yaw=.18,pitch=.12,distance=34,autoSpin=false,center=new THREE.Vector3(2,3.1,0);
const btns=[...document.querySelectorAll('[data-view]')];
btns.forEach(button=>button.addEventListener('click',()=>{
 const view=button.dataset.view;autoSpin=false;document.getElementById('spin').classList.remove('active');
 if(view==='front'){yaw=.18;pitch=.12;distance=34;center.set(2,3.1,0)}
 if(view==='side'){yaw=Math.PI*.48;pitch=.06;distance=39;center.set(2,3.1,0)}
 if(view==='back'){yaw=Math.PI+.15;pitch=.14;distance=38;center.set(2,3.1,0)}
 if(view==='head'){yaw=.25;pitch=.02;distance=12;center.set(-9.7,7.4,3.0)}
}));
document.getElementById('zoomin').onclick=()=>distance=Math.max(6,distance*.8);
document.getElementById('zoomout').onclick=()=>distance=Math.min(85,distance*1.25);
document.getElementById('spin').onclick=e=>{autoSpin=!autoSpin;e.currentTarget.classList.toggle('active',autoSpin);e.currentTarget.textContent=autoSpin?'自動回転 ON':'自動回転 OFF'};
const pointers=new Map();let lastDist=0;
canvas.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;
 const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===1){yaw-=(e.clientX-old.x)*.0065;pitch=Math.max(-1.10,Math.min(1.22,pitch+(e.clientY-old.y)*.005));autoSpin=false;document.getElementById('spin').classList.remove('active')}
 else if(pointers.size===2){
  const a=[...pointers.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
  if(lastDist)distance=Math.max(6,Math.min(85,distance*lastDist/dist));
  lastDist=dist;
 }
});
for(const evt of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(evt,e=>{pointers.delete(e.pointerId);lastDist=0});
canvas.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(6,Math.min(85,distance*(1+Math.sign(e.deltaY)*.11)))},{passive:false});
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);
function render(){
 requestAnimationFrame(render);
 if(autoSpin)yaw+=.0016;
 const cp=Math.cos(pitch);
 camera.position.set(center.x+distance*Math.sin(yaw)*cp,center.y+distance*Math.sin(pitch),center.z+distance*Math.cos(yaw)*cp);
 camera.lookAt(center);
 renderer.render(scene,camera);
}
document.getElementById('spin').textContent='自動回転 OFF';document.getElementById('spin').classList.remove('active');
document.getElementById('status').style.display='none';
render();
</script>
</body>
</html>
