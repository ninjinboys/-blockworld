<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/+esm';
const canvas=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});

renderer.setSize(innerWidth,innerHeight);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x09131d);

const rim=new THREE.DirectionalLight(0x2aaaff,3.8);rim.position.set(9,13,-14);scene.add(rim);
const glow=new THREE.PointLight(0x1bdde7,42,40);glow.position.set(-10,6,9);scene.add(glow);

const materials={
deep:new THREE.MeshStandardMaterial({color:0x062661,roughness:.67,metalness:.10}),
blue:new THREE.MeshStandardMaterial({color:0x1046a5,roughness:.48,metalness:.12}),
royal:new THREE.MeshStandardMaterial({color:0x1765c3,roughness:.42,metalness:.12}),
sky:new THREE.MeshStandardMaterial({color:0x4bb5dd,roughness:.38,metalness:.15}),
mint:new THREE.MeshStandardMaterial({color:0x67d9cc,roughness:.43}),
teal:new THREE.MeshStandardMaterial({color:0x1599a9,roughness:.42}),
belly:new THREE.MeshStandardMaterial({color:0xd9c8aa,roughness:.82}),
bellyShadow:new THREE.MeshStandardMaterial({color:0xa59c8e,roughness:.78}),
horn:new THREE.MeshStandardMaterial({color:0xc6b69e,roughness:.92}),
tooth:new THREE.MeshStandardMaterial({color:0xf1e5cf,roughness:.56}),
eye:new THREE.MeshBasicMaterial({color:0x58ffff}),
black:new THREE.MeshStandardMaterial({color:0x071c2d,roughness:.88}),
water:new THREE.MeshStandardMaterial({color:0x7ff5ff,emissive:0x0ba1b1,emissiveIntensity:.66,transparent:true,opacity:.80,roughness:.28}),
cloud:new THREE.MeshStandardMaterial({color:0xa6dfff,transparent:true,opacity:.46,roughness:.3,depthWrite:false})
};
function mesh(geo,mat,group=dragon){const m=new THREE.Mesh(geo,materials[mat]||mat);group.add(m);return m;}
function cube(x,y,z,sx,sy,sz,mat,group=dragon){const m=mesh(new THREE.BoxGeometry(sx,sy,sz),mat,group);m.position.set(x,y,z);return m;}
const Y=new THREE.Vector3(0,1,0);
function rod(a,b,r1,r2,mat,group=dragon,sides=6){
 const from=new THREE.Vector3(...a),to=new THREE.Vector3(...b),dir=to.clone().sub(from);
 const m=mesh(new THREE.CylinderGeometry(r2,r1,dir.length(),sides),mat,group);
 m.position.copy(from).add(to).multiplyScalar(.5);
 m.quaternion.setFromUnitVectors(Y,dir.normalize());return m;
}
// Reference-based Seiryu rebuild: elevated S-curve, monumental head, open maw,
// carved antlers, dense overlapping scale rows, whiskers and floating water clouds.
// Everything below is a genuine Three.js mesh (not a background illustration).
const qId=new THREE.Quaternion(),yAxis=new THREE.Vector3(0,1,0);
// Side-view S-curve: head forward at LEFT, long raised body and tail to RIGHT.
const bodyPath=new THREE.CatmullRomCurve3([
 new THREE.Vector3(-11.9,9.4,3.9),new THREE.Vector3(-10.4,7.2,4.0),
 new THREE.Vector3(-8.0,4.5,3.5),new THREE.Vector3(-5.2,2.6,2.4),
 new THREE.Vector3(-2.0,3.3,.4),new THREE.Vector3(1.4,6.6,-2.7),
 new THREE.Vector3(4.5,9.2,-3.4),new THREE.Vector3(7.0,8.2,-3.0),
 new THREE.Vector3(8.6,4.2,-.8),new THREE.Vector3(8.5,2.8,2.7),
 new THREE.Vector3(9.0,4.4,4.0),new THREE.Vector3(10.4,8.1,2.6),
 new THREE.Vector3(12.6,12.7,-.6)
],false,'catmullrom',.48);
const bodyRadius=t=>t<.15?1.90+.43*Math.sin(t/.15*Math.PI/2):
 t<.61?2.33-.57*((t-.15)/.46):Math.max(.36,1.76*(1-(t-.61)/.39));
const bodyScales=new Map();
const boxGeo=new THREE.BoxGeometry(1,1,1);
function scalePart(material,position,orientation,sx,sy,sz){
 if(!bodyScales.has(material))bodyScales.set(material,[]);
 bodyScales.get(material).push({position:position.clone(),orientation:orientation.clone(),sx,sy,sz});
}
function blockInst(material,x,y,z,sx,sy,sz,angle=0){
 const q=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),angle);
 scalePart(material,new THREE.Vector3(x,y,z),q,sx,sy,sz);
}
function finalizeInstances(){
 const dummy=new THREE.Object3D();
 for(const [material,items] of bodyScales){
  if(!items.length)continue;
  const inst=new THREE.InstancedMesh(boxGeo,materials[material],items.length);
  inst.castShadow=false;inst.frustumCulled=false;
  items.forEach((it,i)=>{dummy.position.copy(it.position);dummy.quaternion.copy(it.orientation);
   dummy.scale.set(it.sx,it.sy,it.sz);dummy.updateMatrix();inst.setMatrixAt(i,dummy.matrix)});
  inst.instanceMatrix.needsUpdate=true;dragon.add(inst);
 }
}
const forward=new THREE.Vector3(),sideV=new THREE.Vector3(),upV=new THREE.Vector3();
const radial=new THREE.Vector3(),around=new THREE.Vector3(),basis=new THREE.Matrix4(),rot=new THREE.Quaternion();
function ringFrame(t){
 forward.copy(bodyPath.getTangent(t)).normalize();
 sideV.crossVectors(forward,yAxis).normalize();
 if(sideV.length()<.1)sideV.set(0,0,1);
 upV.crossVectors(sideV,forward).normalize();
 return {forward:forward.clone(),side:sideV.clone(),up:upV.clone()};
}
const segmentCount=156,aroundCount=32;
for(let i=0;i<segmentCount;i++){
 const t=i/(segmentCount-1),p=bodyPath.getPoint(t),r=bodyRadius(t);
 const frame=ringFrame(t),tg=frame.forward,s=frame.side,u=frame.up;
 const t2=Math.min(1,t+1/(segmentCount-1));
 if(i<segmentCount-1){
  const p2=bodyPath.getPoint(t2),dir=p2.clone().sub(p);
  const core=mesh(new THREE.CylinderGeometry(bodyRadius(t2)*.92,r*.92,dir.length()*1.34,10),t<.25?'blue':'deep');
  core.position.copy(p).add(p2).multiplyScalar(.5);
  core.quaternion.setFromUnitVectors(yAxis,dir.normalize());
 }
 for(let j=0;j<aroundCount;j++){
  const angle=(j+(i%2)*.5)*2*Math.PI/aroundCount;
  const c=Math.cos(angle),sin=Math.sin(angle);
  radial.copy(u).multiplyScalar(c).addScaledVector(s,sin).normalize();
  around.crossVectors(radial,tg).normalize();
  basis.makeBasis(tg,around,radial);
  rot.setFromRotationMatrix(basis);
  const v=p.clone().addScaledVector(radial,r*.99);
  // Continuous sand-colored ventral armor, indigo side scales and cyan crest.
  const belly=c<-.29;
  let mat;
  if(belly)mat=(i%5===0?'bellyShadow':'belly');
  else {
   // Interlocking scale bands, not high-frequency checkerboard noise.
   // Dark lapis sides and subtle teal flowing currents align to the spine.
   const wave=Math.sin(i*.145+j*.83)+.46*Math.sin(i*.31-j*.55);
   if(c>.68)mat=wave>.64?'mint':wave>-.20?'sky':'royal';
   else if(c>.12)mat=wave>.80?'mint':wave>.13?'teal':wave>-.61?'royal':'blue';
   else mat=wave>.75?'teal':wave>-.30?'royal':'deep';
  }
  const length=Math.max(.22,bodyPath.getLength()/segmentCount*1.40);
  const width=2*Math.PI*r/aroundCount*1.23;
  scalePart(mat,v,rot,length,width,belly?.105:.15);
 }
 // A stepped, layered crest with individual turquoise spines.
 if(i%4===0&&i<segmentCount-2){
  const a=p.clone().addScaledVector(u,r-.04);
  const tip=a.clone().addScaledVector(u,.54+(1-t)*.54).addScaledVector(tg,-.44);
  rod(a.toArray(),tip.toArray(),.25,.095,i%4===0?'sky':i%3===0?'mint':'teal',dragon,4);
 }
 if(i%5===0&&i<segmentCount-4){
  // Two swept-over fin rows, rather than a thin single mohawk.
  for(const sign of [-1,1]){
   const n=u.clone().multiplyScalar(.72).addScaledVector(s,sign*.70).normalize();
   const a=p.clone().addScaledVector(n,r-.02);
   const b=a.clone().addScaledVector(n,.37+(1-t)*.45).addScaledVector(tg,-.35);
   rod(a.toArray(),b.toArray(),.20,.06,i%3===0?'sky':'mint',dragon,4);
  }
 }
}
// Hand-sculpted cranium, 3D beveled wedge jaws, cheek scale frills and
// long water whiskers. This is purposely NOT the old cubic cartoon head.
// SEIRYU HEAD SCULPT v13: one enormous three-dimensional dragon face, not a box.
// Constructed as separate tapered skull, muzzle, hinged lower jaw, fangs, brows,
// glowing recessed eyes, curling whiskers and antler branches.
const head=new THREE.Group();
const HEAD_SCALE=1.72;
head.position.copy(bodyPath.getPoint(0));
head.scale.setScalar(HEAD_SCALE);
head.rotation.y=.48;
dragon.add(head);
const _hq=new THREE.Quaternion();
function headVoxel(x,y,z,sx,sy,sz,mat,rotZ=0){
 // Register instanced skin plates in world positions; avoids thousands of
 // separate draw calls on tablets and correctly includes head scale.
 const p=new THREE.Vector3(x,y,z).multiplyScalar(HEAD_SCALE)
   .applyAxisAngle(yAxis,head.rotation.y).add(head.position);
 const q=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),rotZ);
 scalePart(mat,p,q,sx*HEAD_SCALE,sy*HEAD_SCALE,sz*HEAD_SCALE);
}
function headMass(x,y,z,sx,sy,sz,mat,detail=1){
 const m=mesh(new THREE.IcosahedronGeometry(1,detail),mat,head);
 m.position.set(x,y,z);m.scale.set(sx,sy,sz);return m;
}
function shell(cx,cy,cz,rx,ry,rz,step,kind){
 const ix=Math.ceil(rx/step),iy=Math.ceil(ry/step),iz=Math.ceil(rz/step);
 const topOnly=kind==='muzzle';
 for(let x=-ix;x<=ix;x++)for(let y=-iy;y<=iy;y++)for(let z=-iz;z<=iz;z++){
  const px=x*step,py=y*step,pz=z*step;
  const d=(px/rx)**2+(py/ry)**2+(pz/rz)**2;
  if(d<.72||d>1.08)continue;
  if(topOnly&&py<-.31)continue; // open mouth: no cubic wall underneath
  if(kind==='jaw'&&py>.19)continue;
  const jitter=Math.sin(x*4.11+y*11.79+z*7.83);
  // Flowing horizontal banding makes the face read as blue armor instead of
  // a random checkered toy. Each band is still a distinct 3D voxel.
  const band=Math.sin((cx+px)*1.4+(py+cy)*2.0)+.30*Math.sin(pz*4.3);
  let col=kind==='jaw'?(band>.80?'sky':band>.15?'royal':'deep'):
    kind==='muzzle'?(band>.91?'sky':band>.12?'royal':'blue'):
    band>.97?'mint':band>.48?'sky':band>-.25?'teal':band>-.74?'royal':'deep';
  if(kind==='crown'&&py>ry*.69&&band>.30)col='mint';
  headVoxel(cx+px,cy+py,cz+pz,step*.94,step*.94,step*.94,col);
 }
}
// Organic volumes under tightly packed voxel scales — a narrow crocodilian
// muzzle flows into a broad high cheek and tapering antlered cranium.
headMass(-.28,.69,0,2.05,1.67,1.65,'deep',2);
headMass(-1.38,.54,0,1.30,1.14,1.53,'royal',2);
headMass(-3.64,.26,0,2.57,.62,.98,'deep',2);
headMass(-5.70,.21,0,1.12,.40,.70,'royal',2);
shell(-.28,.69,0,2.11,1.72,1.72,.27,'crown');
shell(-1.40,.52,0,1.30,1.12,1.56,.25,'crown');
shell(-3.68,.25,0,2.50,.73,1.01,.21,'muzzle');
shell(-5.72,.20,0,1.10,.43,.70,.17,'muzzle');
// Slender separate lower jaw slopes down from hinge to curled chin.
// The substantial black cavity BETWEEN them remains unobstructed.
headMass(-1.05,-1.17,0,.90,.69,.84,'deep',1);
headMass(-2.86,-1.95,0,2.17,.34,.86,'blue',2);
headMass(-4.65,-2.08,0,1.08,.26,.62,'royal',2);
shell(-2.85,-1.95,0,2.18,.35,.87,.19,'jaw');
shell(-4.65,-2.08,0,1.06,.27,.64,.17,'jaw');
headMass(-1.85,-.95,0,1.15,.48,.59,'black',1);
headMass(-3.68,-1.61,0,1.80,.17,.53,'teal',1);
// Delicate tongue projects out of the deep throat.
const tongue=rod([-2.90,-1.59,0],[-4.72,-1.77,0],.21,.04,'teal',head,7);
for(const s of [-1,1]){
 // Rows of triangular ivory teeth form a snarling opening.
 for(let j=0;j<6;j++){
  const x=-5.98+j*.72,z=s*(.55+.14*(j%3)/2);
  const top=.08+.06*Math.sin(j*.7);
  const tipY=-.78-((j+1)%3)*.12;
  rod([x,top,z],[x-.08,tipY,z],.115,.014,'tooth',head,5);
 }
 for(let j=0;j<5;j++){
  const x=-5.07+j*.80,z=s*.61;
  rod([x,-1.79,z],[x+.08,-1.20+(j%2)*.08,z],.10,.014,'tooth',head,5);
 }
 // Four dominant swept ivory fangs define the attack silhouette.
 rod([-4.72,.14,s*.77],[-5.02,-1.55,s*.91],.31,.084,'tooth',head,7);
 rod([-5.02,-1.55,s*.91],[-4.77,-2.17,s*.92],.088,.006,'tooth',head,7);
 rod([-1.66,.08,s*.94],[-1.89,-1.28,s*1.08],.20,.015,'tooth',head,6);
 // Hinge-to-chin support makes the open jaw read as connected anatomy.
 rod([-.82,-.96,s*.84],[-1.75,-1.67,s*.91],.35,.23,'deep',head,6);
 rod([-1.75,-1.67,s*.91],[-4.29,-2.08,s*.69],.23,.12,'royal',head,6);
 // Recessed predatory slit-shaped azure eyes. The earlier bulging
 // circular eyes looked like a cartoon animal rather than a guardian dragon.
 const sock=headMass(-1.37,1.24,s*2.00,.80,.29,.20,'black',1);
 sock.rotation.z=-.18;
 const eye=headMass(-1.47,1.22,s*2.58,.69,.13,.11,'eye',1);
 eye.rotation.z=-.19;
 // A narrow luminous core floats just outside the dark, deeply-set socket.
 const iris=headMass(-1.52,1.23,s*2.71,.26,.075,.05,'water',1);
 eye.rotation.z=-.19;
 // Narrow vertical pupil sits on the illuminated slit instead of popping out.
 headMass(-1.57,1.24,s*2.72,.022,.078,.024,'black',1);
 rod([-1.94,1.37,s*2.27],[-1.38,1.43,s*2.25],.038,.018,'water',head,5);
 rod([-2.20,1.54,s*2.20],[-.51,1.73,s*1.98],.22,.10,'deep',head,6);
 rod([-2.16,1.64,s*2.16],[-1.15,1.71,s*2.06],.12,.025,'sky',head,5);
 rod([-2.02,.995,s*2.09],[-.95,1.018,s*2.01],.10,.028,'royal',head,5);
 // Bone ridges running from eye to broad cheek flares.
 for(let j=0;j<15;j++){
   const x=-1.68+j*.23,y=.55+.22*(j%3);
   const z=s*(1.55+(j%4)*.075);
   headVoxel(x,y,z,.34,.25,.22,j%4===0?'mint':j%2===0?'sky':'teal',-.13);
 }
 // Nostril apertures inset in tapering nose sides.
 headMass(-6.04,.38,s*.47,.17,.095,.095,'black',1);
 rod([-6.07,.49,s*.53],[-5.68,.63,s*.62],.10,.025,'sky',head,4);
 // Cheek ruff: densely packed swept plates, not a single row of spikes.
 for(let j=0;j<54;j++){
  const row=Math.floor(j/18),i=j%18;
  const x=-.90+i*.17,y=.75-row*.38+(i%4)*.12;
  const z=s*(1.49+row*.20);
  headVoxel(x,y,z,.39,.32,.23,j%5===0?'mint':j%2===0?'teal':'sky',.22);
 }
 for(let j=0;j<23;j++){
  const t=j/22,x=.34+t*3.80,y=.65+t*.35;
  const a=[x,y,s*(1.34+Math.sin(t*Math.PI)*.3)];
  const b=[x+.38,y+.45+Math.sin(t*Math.PI)*.41,s*(2.01+t*.35)];
  rod(a,b,.18,.025,j%3===0?'mint':j%2===0?'sky':'teal',head,5);
 }
 // Great forked antler, laid backward to preserve the head's snaking shape.
 const antlers=[
 [[-.06,1.86,s*.92],[.53,3.25,s*1.25],.29,.20],
 [[.53,3.25,s*1.25],[1.65,4.22,s*1.52],.20,.13],
 [[1.65,4.22,s*1.52],[2.81,4.87,s*1.80],.13,.01],
 [[.55,3.17,s*1.30],[.27,4.26,s*1.98],.16,.01],
 [[1.27,3.89,s*1.51],[1.38,4.91,s*2.20],.14,.01],
 [[1.80,4.32,s*1.65],[2.67,5.18,s*1.45],.11,.01],
 [[1.89,4.37,s*1.64],[3.24,4.58,s*2.05],.115,.012],
 [[.79,3.48,s*1.33],[.15,4.39,s*2.11],.14,.011],
 [[2.05,4.49,s*1.50],[2.51,5.67,s*1.90],.10,.008]
 ];
 for(const [a,b,r1,r2] of antlers)rod(a,b,r1,r2,'horn',head,5);
 // Arc-shaped glowing whiskers: two natural strands from each muzzle corner.
 // Deliberately curve away from the jaw before curling back, not straight wires.
 for(let branch=0;branch<2;branch++){
  const whisker=new THREE.CatmullRomCurve3([
   new THREE.Vector3(-5.66,-.16-branch*.16,s*.73),
   new THREE.Vector3(-6.63,-.41-branch*.20,s*1.47),
   new THREE.Vector3(-7.51,-.72-branch*.21,s*2.39),
   new THREE.Vector3(-8.38,-.47-branch*.22,s*3.21),
   new THREE.Vector3(-9.12,.21-branch*.25,s*3.66),
   new THREE.Vector3(-9.94,.63-branch*.14,s*2.93),
   new THREE.Vector3(-10.59,.42-branch*.17,s*2.09)
  ],false,'catmullrom',.5);
  mesh(new THREE.TubeGeometry(whisker,64,.043-branch*.008,5,false),'water',head);
 }
}
// High-relief staggered facial plates. Ancient-dragon scales spiral back
// from the muzzle and form a naturally stepped brow, cheek and jaw.
for(const side of [-1,1]){
 for(let row=0;row<6;row++)for(let col=0;col<26;col++){
   const x=-6.05+col*.22+(row%2)*.10;
   const y=.34+row*.145;
   const taper=Math.max(.55, .55+(x+6.05)*.090);
   const z=side*(.43+row*.10+taper*.10);
   if(x>-.55)continue;
   const wave=Math.sin(col*1.57+row*2.19);
   const color=wave>.38?'sky':wave>-.19?'teal':wave>-.59?'royal':'deep';
   headVoxel(x,y,z,.28,.17,.16,color,-.095);
 }
 // Segmented cream cheek ridges mark the strong rearward sweep of the jaw.
 for(let j=0;j<16;j++){
   let t=j/15,x=-3.96+j*.21,y=-.39-.38*Math.sin(t*Math.PI);
   const z=side*(1.04+Math.sin(t*Math.PI)*.45);
   headVoxel(x,y,z,.29,.17,.15,j%3===0?'belly':'sky',.16);
 }
 // Multi-scale horn roots create a bone crown before the antlers branch.
 for(let j=0;j<8;j++){
   const t=j/7;
   rod([-.13+t*.51,1.85+t*.98,side*(.90+t*.25)],
       [.05+t*.70,2.02+t*1.02,side*(1.05+t*.30)],
       .17-.08*t,.07-.05*t,'horn',head,5);
 }
}
// Actual jagged, thick dragon-scale plates. Each is a beveled 3D polygon,
// layered over the face and swept rearward toward the crests.
const plateOutline=new THREE.Shape();
plateOutline.moveTo(-.42,-.21);plateOutline.lineTo(-.28,.18);
plateOutline.lineTo(.24,.29);plateOutline.lineTo(.57,-.10);
plateOutline.lineTo(.02,-.28);plateOutline.closePath();
const plateGeo=new THREE.ExtrudeGeometry(plateOutline,{depth:.16,steps:1,
 bevelEnabled:true,bevelThickness:.035,bevelSize:.035,bevelSegments:1});
plateGeo.translate(0,0,-.08);
function armorPlate(x,y,z,sx,sy,shade,angle=0){
 const m=mesh(plateGeo,shade,head);m.position.set(x,y,z);
 m.scale.set(sx,sy,1);m.rotation.z=angle;return m;
}
for(const side of [-1,1]){
 // Raised overlapping forehead armor slopes towards the nose,
 // with darker colors framing the luminous dragon eye.
 for(let row=0;row<6;row++){
  for(let i=0;i<17;i++){
   const x=-4.95+i*.25+(row%2)*.11;
   const y=.60+row*.185+(i/17)*.19;
   const width=.57+Math.min(1,(x+5)/3)*.62;
   const z=side*(width+.16+row*.08);
   if(x>-1.1&&row<2)continue;
   let shade=(i+row)%7===0?'mint':(i+2*row)%5===0?'sky':row>3?'royal':'teal';
   armorPlate(x,y,z,.57,.52,shade,-.14);
  }
 }
 // Broad fin-like cheek whisker roots, layered from face to neck.
 for(let i=0;i<12;i++){
   const u=i/11,x=-.56+i*.25;
   const y=.19+u*.53,z=side*(1.57+.17*Math.sin(u*Math.PI));
   const p=armorPlate(x,y,z,1.15,1.15,i%4===0?'mint':i%2===0?'sky':'royal',.36);
   p.rotation.y=side*.22;
   const outer=[x+.63,y+.62+(i%3)*.12,z+side*(.32+i*.04)];
   rod([x,y,z],outer,.17,.035,i%3===0?'mint':'teal',head,5);
 }
 // Lower jaw scallops overlap toward the chin, adding the beard silhouette.
 for(let i=0;i<15;i++){
  const u=i/14,x=-5.13+i*.285;
  const y=-1.90+.10*Math.sin(u*Math.PI);
  const z=side*(.57+.17*Math.sin(u*Math.PI));
  armorPlate(x,y,z,.67,.58,i%4===0?'sky':i%3===0?'teal':'royal',-.24);
 }
}
// Crown ridge is a continuous backwards sweep, not isolated needles.
for(let i=0;i<32;i++){
 const u=i/31,x=-1.60+i*.156;
 const h=1.8+.85*Math.sin(u*Math.PI);
 const z=Math.sin(i*1.4)*.45;
 armorPlate(x,h,z,.70,1.05,i%5===0?'mint':i%2===0?'royal':'sky',.65);
}
// Forehead and mane flow rearwards in layered ultramarine, turquoise and cyan.
for(let j=0;j<25;j++){
 const x=-.89+j*.15;
 const z=((j%5)-2)*.27;
 const start=[x,2.13,z],end=[x+.32,2.67+(j%4)*.20,z+.20];
 rod(start,end,.19,.02,j%3===0?'mint':j%2?'royal':'sky',head,5);
}
for(let row=0;row<4;row++)for(let i=0;i<38;i++){
 const s=row%2===0?-1:1;
 const x=.34+i*.14,y=1.28+(row%2)*.23;
 const z=s*(1.15+Math.floor(row/2)*.30+(i%3)*.05);
 const end=[x+.42,y+.55+(i%5)*.16,z+s*(.45+Math.floor(row/2)*.21)];
 rod([x,y,z],end,.18,.020,(i+row)%3===0?'mint':i%2===0?'teal':'sky',head,4);
}
window.seiryuFaceVersion='v17-facing-guardian'; 
// Muscular, articulated legs with three ivory hooks per claw.
function legAt(t,sgn){
 const p=bodyPath.getPoint(t),frame=ringFrame(t),side=frame.side;
 const a=p.clone().addScaledVector(side,sgn*bodyRadius(t)*.62).add(new THREE.Vector3(0,-.50,0));
 const elbow=a.clone().addScaledVector(side,sgn*1.40).add(new THREE.Vector3(.52,-1.13,.20));
 const wrist=elbow.clone().addScaledVector(side,sgn*.46).add(new THREE.Vector3(-.50,-1.40,.22));
 rod(a.toArray(),elbow.toArray(),.64,.43,'deep',dragon,7);
 rod(elbow.toArray(),wrist.toArray(),.50,.37,'royal',dragon,7);
 const paw=wrist.clone().add(new THREE.Vector3(-.18,-.13,.16));
 cube(paw.x,paw.y,paw.z,1.22,.57,1.13,'blue');
 for(const f of [-1,0,1]){
  const start=paw.clone().add(new THREE.Vector3(-.47,-.12,f*.38));
  const end=start.clone().add(new THREE.Vector3(-.83,-.40,f*.13));
  rod(start.toArray(),end.toArray(),.215,.02,'tooth',dragon,5);
 }
 for(let j=0;j<6;j++){
  const pt=a.clone().lerp(elbow,(j+.3)/7);
  cube(pt.x,pt.y,pt.z,.25,.25,.28,j%3===0?'sky':'royal');
 }
}
// Seiryu has exactly two forelegs (left and right), and no hindlegs.
for(const sign of [-1,1])legAt(.13,sign);
// Fan-shaped streaming tail, with a large upturned ice-blue brush.
const tip=bodyPath.getPoint(1),last=ringFrame(.995);
for(let j=0;j<26;j++){
 const angle=2*Math.PI*j/26;
 const n=last.up.clone().multiplyScalar(Math.cos(angle)).addScaledVector(last.side,Math.sin(angle));
 const root=tip.clone().addScaledVector(n,.19);
 const outer=root.clone().addScaledVector(n,1.1+(j%4)*.23).addScaledVector(last.forward,1.5+(j%5)*.22);
 rod(root.toArray(),outer.toArray(),.20,.012,j%3===0?'mint':j%2?'sky':'teal',dragon,4);
}
// Translucent voxel-water clouds, positioned around the dragon rather than
// blocking its face: individual cubes remain independently three-dimensional.
function blockCloud(cx,cy,cz,size,seed){
 for(let k=0;k<46;k++){
  const a=k*2.399963+seed,b=k*.79+seed;
  const r=.16+Math.sqrt(k/46)*size;
  const x=cx+Math.cos(a)*r*1.30,y=cy+Math.sin(b)*r*.49,z=cz+Math.sin(a)*r*.71;
  const s=.17+(k%4)*.18;
  blockInst(k%8===0?'water':'cloud',x,y,z,s*1.23,s,s*1.12);
 }
}
for(const p of [[-3,1,-2,1.25],[.5,6.6,-1.5,1.65],[4.6,.4,5.0,1.25],[7.1,7.5,1.5,1.55],[10.8,2.5,-4.7,1.25],[13.0,4.7,4.3,1.55],[16.8,5.4,-3.4,1.20]])blockCloud(...p,.7);
finalizeInstances();
// Ground and soft scene lighting
const ground=mesh(new THREE.PlaneGeometry(190,190),new THREE.MeshStandardMaterial({color:0x0b1822,roughness:.88}),scene);
ground.rotation.x=-Math.PI/2;ground.position.y=-6.3;
const grid=new THREE.GridHelper(80,40,0x16435a,0x173147);grid.position.y=-6.28;scene.add(grid);
// Set initial camera from the TRUE three-dimensional mesh bounds, so neither
// muzzle nor streaming tail is cropped on narrow iPads.
dragon.updateMatrixWorld(true);
const dragonBounds=new THREE.Box3().setFromObject(dragon);
const dragonSize=dragonBounds.getSize(new THREE.Vector3());
const heroCenter=dragonBounds.getCenter(new THREE.Vector3());
function fitWholeDragon(){
 const tan=Math.tan(camera.fov*Math.PI/360);
 const aspect=Math.max(.4,camera.aspect);
 return Math.min(110,Math.max(
  dragonSize.x*.5/(tan*aspect),
  dragonSize.y*.5/tan
 )*1.10+dragonSize.z*.32);
}
const faceViewDistance=()=>innerWidth/Math.max(innerHeight,1)<1.15?40.5:33.2;
let yaw=-.31,pitch=.055,distance=faceViewDistance(),autoSpin=false,center=head.position.clone().add(new THREE.Vector3(-4.8,1.0,0));
const btns=[...document.querySelectorAll('[data-view]')];
btns.forEach(button=>button.addEventListener('click',()=>{
 const view=button.dataset.view;autoSpin=false;document.getElementById('spin').classList.remove('active');
 if(view==='front'){yaw=.10;pitch=.07;distance=fitWholeDragon();center.copy(heroCenter)}
 if(view==='side'){yaw=0;pitch=.02;distance=fitWholeDragon();center.copy(heroCenter)}
 if(view==='back'){yaw=Math.PI;pitch=.08;distance=fitWholeDragon();center.copy(heroCenter)}
 if(view==='head'){yaw=-.31;pitch=.055;distance=faceViewDistance();center.copy(head.position).add(new THREE.Vector3(-4.8,1.0,0))}
}));
document.getElementById('zoomin').onclick=()=>distance=Math.max(6,distance*.8);
document.getElementById('zoomout').onclick=()=>distance=Math.min(85,distance*1.25);
document.getElementById('spin').onclick=e=>{autoSpin=!autoSpin;e.currentTarget.classList.toggle('active',autoSpin);e.currentTarget.textContent=autoSpin?'自動回転 ON':'自動回転 OFF'};
const pointers=new Map();let lastDist=0;
canvas.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;
 const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===1){yaw-=(e.clientX-old.x)*.0065;pitch=Math.max(-1.10,Math.min(1.22,pitch+(e.clientY-old.y)*.005));autoSpin=false;document.getElementById('spin').classList.remove('active')}
 else if(pointers.size===2){
  const a=[...pointers.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
  if(lastDist)distance=Math.max(6,Math.min(85,distance*lastDist/dist));
  lastDist=dist;
 }
});
for(const evt of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(evt,e=>{pointers.delete(e.pointerId);lastDist=0});
canvas.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(6,Math.min(85,distance*(1+Math.sign(e.deltaY)*.11)))},{passive:false});
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();if(center.distanceTo(heroCenter)<.15)distance=fitWholeDragon()}
addEventListener('resize',resize);resize();
function render(){
 requestAnimationFrame(render);
 if(autoSpin)yaw+=.0016;
 const cp=Math.cos(pitch);
 camera.position.set(center.x+distance*Math.sin(yaw)*cp,center.y+distance*Math.sin(pitch),center.z+distance*Math.cos(yaw)*cp);
 camera.lookAt(center);
 renderer.render(scene,camera);
}
document.getElementById('spin').textContent='自動回転 OFF';document.getElementById('spin').classList.remove('active');
document.getElementById('status').style.display='none';
render();
</script>
</body>
