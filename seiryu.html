<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/+esm';
// NEXACRAFT / SEIRYU – SCULPTURE REBUILD 30. All previous model geometry is removed.
const canvas=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));
renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x090e17);
scene.fog=new THREE.Fog(0x090e17,68,125);
const camera=new THREE.PerspectiveCamera(44,innerWidth/innerHeight,.1,180);
const hemi=new THREE.HemisphereLight(0xb8edff,0x1b2331,2.05);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xe1f6ff,3.6);sun.position.set(-16,24,24);scene.add(sun);
const fill=new THREE.DirectionalLight(0x159ed5,3.15);fill.position.set(14,12,-19);scene.add(fill);
const light=new THREE.PointLight(0x2df7f8,32,41);light.position.set(-17,9,12);scene.add(light);
const mat={
navy:new THREE.MeshStandardMaterial({color:0x07183d,roughness:.72}),
deep:new THREE.MeshStandardMaterial({color:0x102c75,roughness:.64,metalness:.03}),
blue:new THREE.MeshStandardMaterial({color:0x124fa6,roughness:.56,metalness:.04}),
royal:new THREE.MeshStandardMaterial({color:0x246fc5,roughness:.49,metalness:.09}),
turquoise:new THREE.MeshStandardMaterial({color:0x138f9e,roughness:.49}),
sea:new THREE.MeshStandardMaterial({color:0x2badc5,roughness:.49}),
ice:new THREE.MeshStandardMaterial({color:0x72dae4,roughness:.43}),
cream:new THREE.MeshStandardMaterial({color:0xd5c3a8,roughness:.81}),
creamShade:new THREE.MeshStandardMaterial({color:0xa99e8e,roughness:.86}),
antler:new THREE.MeshStandardMaterial({color:0xbfb09d,roughness:.82}),
fang:new THREE.MeshStandardMaterial({color:0xece7d9,roughness:.48}),
mouth:new THREE.MeshStandardMaterial({color:0x092635,roughness:.91,side:THREE.DoubleSide}),
tongue:new THREE.MeshStandardMaterial({color:0x0f8194,roughness:.72}),
glow:new THREE.MeshBasicMaterial({color:0x76ffff}),
whisker:new THREE.MeshStandardMaterial({color:0x9dfbff,emissive:0x117eaa,emissiveIntensity:.64,roughness:.29}),
cloud:new THREE.MeshStandardMaterial({color:0x8dd3fa,roughness:.3,transparent:true,opacity:.68,depthWrite:false}),
cloudEdge:new THREE.MeshStandardMaterial({color:0x4dbbea,transparent:true,opacity:.70,depthWrite:false}),
};
const dragon=new THREE.Group();scene.add(dragon);
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const UP=V(0,1,0);
function mesh(g,m,parent=dragon){const o=new THREE.Mesh(g,mat[m]||m);parent.add(o);return o}
function cub(x,y,z,w,h,d,m,parent=dragon){const o=mesh(new THREE.BoxGeometry(w,h,d),m,parent);o.position.set(x,y,z);return o}
function poly(x,y,z,sx,sy,sz,m,parent=dragon,detail=0){
 const o=mesh(new THREE.IcosahedronGeometry(1,detail),m,parent);
 o.position.set(x,y,z);o.scale.set(sx,sy,sz);return o;
}
function rod(a,b,r0,r1,m,parent=dragon,sides=7){
 a=Array.isArray(a)?new THREE.Vector3(...a):a;b=Array.isArray(b)?new THREE.Vector3(...b):b;
 const d=b.clone().sub(a),o=mesh(new THREE.CylinderGeometry(r1,r0,d.length(),sides),m,parent);
 o.position.copy(a).add(b).multiplyScalar(.5);
 o.quaternion.setFromUnitVectors(UP,d.normalize());return o;
}
function tube(arr,r,m,parent=dragon){return mesh(new THREE.TubeGeometry(
 new THREE.CatmullRomCurve3(arr.map(v=>Array.isArray(v)?new THREE.Vector3(...v):v)),52,r,6,false),m,parent)}
// Broad feather-shaped voxel fins, not thin cylinders. Reusable on body,
// cheek, crown and tail. Each leaf is fully 3D with bevelled thickness.
function leaf(a,b,width,m,parent=dragon){
 a=Array.isArray(a)?V(...a):a;b=Array.isArray(b)?V(...b):b;
 const delta=b.clone().sub(a),length=delta.length();
 const s=new THREE.Shape();
 s.moveTo(-width*.33,0);s.lineTo(-width*.52,length*.25);
 s.lineTo(-width*.38,length*.67);s.lineTo(.03,length);
 s.lineTo(width*.50,length*.73);s.lineTo(width*.56,length*.24);
 s.lineTo(width*.29,0);s.closePath();
 const g=new THREE.ExtrudeGeometry(s,{depth:.12,steps:1,bevelEnabled:true,
 bevelThickness:.04,bevelSize:.04,bevelSegments:1});
 g.translate(0,0,-.06);
 const o=mesh(g,m,parent);o.position.copy(a);
 o.quaternion.setFromUnitVectors(UP,delta.normalize());
 return o;
}
function ribbon(a,b,c,d,material,parent=dragon){
 const g=new THREE.BufferGeometry();
 const v=[...a,...b,...c,...a,...c,...d];g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));
 g.computeVertexNormals();
 const m=mat[material].clone();m.side=THREE.DoubleSide;return mesh(g,m,parent);
}
// Centerline of the independent, long coiling body; neck dips from head,
// body arches over the back and the tail rises into a flowering ice fin.
const spine=new THREE.CatmullRomCurve3([
 V(-9.4,9.7,1.1),V(-7.8,7.8,1.55),V(-5.5,4.55,1.9),
 V(-2.1,3.15,1.95),V(1.4,4.5,.25),V(4.4,8.8,-2.65),
 V(8.1,10.65,-3.5),V(11.3,8.15,-2.85),V(13.5,4.6,-.15),
 V(12.6,2.8,3.5),V(13.45,5.1,5.35),V(16.5,10.4,3.4),V(19.0,13.8,.15)
],false,'catmullrom',.48);
const rad=t=>Math.max(.31, t<.12?2.2+t*3.4:t<.45?2.61-(t-.12)*.42:
 t<.70?2.47-(t-.45)*3.7:1.54*(1-(t-.70)/.30));
const rings=[],ringSegments=154,ringSides=24;
const bodyP=[],bodyC=[],bodyIx=[];
const deepC=new THREE.Color(0x10295f),blueC=new THREE.Color(0x174b9d);
for(let i=0;i<=ringSegments;i++){
 const t=i/ringSegments,p=spine.getPoint(t),tan=spine.getTangent(t).normalize();
 const side=new THREE.Vector3().crossVectors(tan,UP).normalize();
 if(side.lengthSq()<.01)side.set(0,0,1);
 const above=new THREE.Vector3().crossVectors(side,tan).normalize(),r=rad(t);
 rings.push({p,tan,side,above,r});
 for(let j=0;j<ringSides;j++){
  const angle=2*Math.PI*j/ringSides,n=above.clone().multiplyScalar(Math.cos(angle)).addScaledVector(side,Math.sin(angle));
  const a=p.clone().addScaledVector(n,r*.985);
  bodyP.push(a.x,a.y,a.z);
  const c=deepC.clone().lerp(blueC,Math.max(0,Math.sin(t*22+angle*.61)*.35+.36));
  bodyC.push(c.r,c.g,c.b);
 }
}
for(let i=0;i<ringSegments;i++)for(let j=0;j<ringSides;j++){
 const a=i*ringSides+j,b=i*ringSides+(j+1)%ringSides,c=(i+1)*ringSides+j,d=(i+1)*ringSides+(j+1)%ringSides;
 bodyIx.push(a,c,b,b,c,d);
}
const bodyGeo=new THREE.BufferGeometry();
bodyGeo.setAttribute('position',new THREE.Float32BufferAttribute(bodyP,3));
bodyGeo.setAttribute('color',new THREE.Float32BufferAttribute(bodyC,3));
bodyGeo.setIndex(bodyIx);bodyGeo.computeVertexNormals();
mesh(bodyGeo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.70,side:THREE.DoubleSide}));
// Each surface scale is a tapered, beveled, overlapping "shingle", not a cube.
const tileShape=new THREE.Shape();
tileShape.moveTo(-.55,-.37);tileShape.lineTo(-.46,.24);
tileShape.lineTo(.07,.43);tileShape.lineTo(.49,.19);tileShape.lineTo(.65,-.17);tileShape.lineTo(-.10,-.38);tileShape.closePath();
const tile=new THREE.ExtrudeGeometry(tileShape,{depth:.12,bevelEnabled:true,bevelThickness:.026,bevelSize:.028,bevelSegments:1});
tile.translate(0,0,-.06);
const batches=new Map(),tmp=new THREE.Object3D();
function collect(k,p,orient,sx,sy,sz){
 if(!batches.has(k))batches.set(k,[]);
 batches.get(k).push([p.clone(),orient.clone(),V(sx,sy,sz)]);
}
const orientMatrix=new THREE.Matrix4(),q=new THREE.Quaternion();
for(let i=2;i<ringSegments-1;i+=2){
 const f=rings[i],t=i/ringSegments;
 for(let j=0;j<ringSides;j++){
  const a=2*Math.PI*(j+(i%4===0?.35:0))/ringSides,cc=Math.cos(a);
  const n=f.above.clone().multiplyScalar(cc).addScaledVector(f.side,Math.sin(a)).normalize();
  const bin=new THREE.Vector3().crossVectors(n,f.tan).normalize();
  orientMatrix.makeBasis(f.tan,bin,n);q.setFromRotationMatrix(orientMatrix);
  const point=f.p.clone().addScaledVector(n,f.r+.042);
  const w=Math.sin(i*.16+j*.62)+.3*Math.cos(i*.09-j*.53);
  const m=cc<-.34?(i%7===0?'creamShade':'cream'):
    cc>.72?(w>.35?'ice':'turquoise'):
    cc>.22?(w>.69?'sea':w>-.28?'turquoise':'royal'):
    w>.79?'sea':w>.13?'royal':w>-.48?'blue':'deep';
  collect(m,point,q,.70*(1-t*.27),.69*f.r/2.0,1);
 }
}
// Draw calls are batched per palette; hundreds of tiny 3D scales are stable on iPad.
for(const [key,arr] of batches){
 const im=new THREE.InstancedMesh(tile,mat[key],arr.length);im.frustumCulled=false;
 for(let i=0;i<arr.length;i++){
  tmp.position.copy(arr[i][0]);tmp.quaternion.copy(arr[i][1]);tmp.scale.copy(arr[i][2]);tmp.updateMatrix();
  im.setMatrixAt(i,tmp.matrix);
 }
 im.instanceMatrix.needsUpdate=true;dragon.add(im);
}
// Along the back: swept leafy finlets at every few rings, with turquoise edges.
for(let i=3;i<ringSegments-6;i+=4){
 const f=rings[i],t=i/ringSegments;
 for(const tilt of [-.45,-.12,.22,.45]){
  const n=f.above.clone().multiplyScalar(Math.cos(tilt)).addScaledVector(f.side,Math.sin(tilt)).normalize();
  const start=f.p.clone().addScaledVector(n,f.r*.92);
  const end=start.clone().addScaledVector(n,.60+(1-t)*.85).addScaledVector(f.tan,-.74);
  leaf(start,end,.38+(1-t)*.19,(i+Math.round(tilt*20))%4===0?'ice':'turquoise');
 }
}
// Face anatomy lives in its own group, facing left. Large majestic skull,
// narrowing snout, broad jowls and an independently OPEN lower jaw.
const head=new THREE.Group();head.position.set(-10.6,9.55,1.1);head.scale.setScalar(1.67);dragon.add(head);
const H=head;
function loft(points,m,parent=H,sides=20){
 const coords=[],inds=[];
 for(const ring of points){const [x,y,yr,zr]=ring;
  for(let j=0;j<sides;j++){const a=2*Math.PI*j/sides;coords.push(x,y+Math.cos(a)*yr,Math.sin(a)*zr);}
 }
 for(let i=0;i<points.length-1;i++)for(let j=0;j<sides;j++){
  const b=(j+1)%sides,a=i*sides+j,c=(i+1)*sides+j,d=(i+1)*sides+b;
  inds.push(a,c,b,b,c,d);
 }
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(coords,3));
 geo.setIndex(inds);geo.computeVertexNormals();
 const material=mat[m].clone();material.side=THREE.DoubleSide;
 return mesh(geo,material,parent);
}
loft([
 [-7.3,.06,.07,.15],[-6.93,.18,.31,.34],[-6.20,.29,.43,.52],
 [-5.2,.36,.56,.75],[-4.10,.56,.80,1.03],[-3.0,.83,1.03,1.31],
 [-1.97,1.13,1.50,1.78],[-.90,1.05,1.62,1.92],
 [.30,.63,1.50,1.83],[1.35,.35,1.22,1.55],[2.10,.14,.96,1.15]
],'deep');
loft([
 [-7.23,.33,.05,.15],[-6.58,.49,.10,.32],[-5.77,.68,.15,.44],
 [-4.55,.96,.20,.62],[-3.13,1.39,.24,.85],[-1.94,1.91,.14,.81]
],'royal');
// Angled overlapping 3D facial scales follow the skull's anatomy. The old
// smooth beak is deliberately replaced by layered lapis / turquoise armor.
const facialInstances=new Map();
function facialTile(kind,x,y,z,sx,sy,sz,ax=0,ay=0,az=0){
 if(!facialInstances.has(kind))facialInstances.set(kind,[]);
 const dummy=new THREE.Object3D();
 dummy.position.set(x,y,z);dummy.rotation.set(ax,ay,az);
 dummy.scale.set(sx,sy,sz);dummy.updateMatrix();
 facialInstances.get(kind).push(dummy.matrix.clone());
}
// Dorsal rows fan outwards from a dark indigo median skull ridge.
for(let col=0;col<29;col++){
 const x=-6.75+col*.205;
 const u=Math.max(0,Math.min(1,(x+6.75)/6.5));
 const spread=.20+u*1.21;
 const topY=.47+(x+6.75)*.30;
 for(let j=-3;j<=3;j++){
  const z=j/3*spread*.92;
  const y=topY-.14*Math.abs(j/3)**1.8+Math.sin(col*.36+j*.71)*.06;
  const flow=Math.sin(col*.27+j*.44);
  const color=j===0?'royal':
    u<.32?(flow>.60?'royal':'blue'):
    u<.60?(flow>.68?'turquoise':flow>.10?'royal':'blue'):
    flow>.77?'sea':flow>-.05?'turquoise':'royal';
  facialTile(color,x,y+.12,z,.39+.13*u,.40+.07*u,1.20,
    -Math.PI/2+(j/3)*.21,0,-.12);
 }
}
// Two cheek curtains overlap in the direction of the whisker roots.
// No scales are placed over the inset eye at y=1.17, x≈-2.2.
for(const s of [-1,1])for(let row=0;row<5;row++)for(let col=0;col<20;col++){
 const x=-5.30+col*.247, u=Math.max(0,Math.min(1,(x+5.3)/5));
 const y=-.04+row*.235 + .10*u;
 if(x>-2.95&&y>.86)continue;
 const edge=.65+u*1.07+(row/5)*.11;
 const z=s*(edge+.055);
 const phase=Math.sin(col*.21+row*.43);
 const kind=phase>.84?'sea':phase>.19?'turquoise':phase>-.59?'royal':'deep';
 facialTile(kind,x,y,z,.41+.13*u,.40,.94,0,0,-.12);
}
for(const [name,mats] of facialInstances){
 const im=new THREE.InstancedMesh(tile,mat[name],mats.length);
 for(let i=0;i<mats.length;i++)im.setMatrixAt(i,mats[i]);
 im.instanceMatrix.needsUpdate=true;im.frustumCulled=false;H.add(im);
}
// 2 side jowls carry the thick armor, rather than plane of loose tiles.
for(const s of [-1,1]){
 poly(-1.08,.50,s*1.05,1.31,.94,.83,'blue',H,1);
 poly(-2.19,.32,s*.84,1.06,.72,.67,'royal',H,1);
}
// Mouth cavity visible through fully separate UPPER and LOWER jaws.
poly(-2.5,-1.18,0,2.7,.57,.72,'mouth',H,2);
poly(-3.70,-2.17,0,1.72,.19,.41,'tongue',H,1);
loft([
 [-6.44,-2.96,.07,.34],[-5.98,-3.03,.27,.49],[-5.11,-3.07,.33,.66],
 [-4.04,-2.92,.38,.82],[-2.91,-2.60,.43,.94],[-1.86,-1.91,.49,.97],
 [-.92,-1.16,.48,.92],[.12,-.43,.36,.70]
],'blue');
// Gape framed by ribs at hinged jaw, smaller details protected by geometry.
for(const s of [-1,1]){
 rod([.05,-.13,s*.78],[-1.18,-1.25,s*.91],.34,.22,'deep',H);
 rod([-1.18,-1.25,s*.91],[-3.85,-2.72,s*.70],.25,.14,'royal',H);
 // canine teeth and naturally varied secondary teeth
 rod([-4.73,-.02,s*.62],[-5.05,-1.42,s*.74],.24,.09,'fang',H);
 rod([-5.05,-1.42,s*.74],[-4.80,-1.89,s*.75],.09,.007,'fang',H);
 rod([-2.10,-.06,s*.98],[-2.34,-1.33,s*1.05],.18,.010,'fang',H);
 for(let j=0;j<5;j++){
  const x=-5.93+j*.78;
  rod([x,-.12,s*(.36+j*.13)],[x-.04,-.67-(j%3)*.12,s*(.36+j*.13)],.10,.012,'fang',H);
  rod([x+.16,-2.84,s*(.37+j*.13)],[x+.15,-1.65,s*(.36+j*.13)],.10,.008,'fang',H);
 }
 // deep-set neon eye, shielded by a sharply sloped layered upper brow
 poly(-2.24,1.17,s*1.56,.75,.26,.21,'mouth',H,1);
 const eye=poly(-2.31,1.18,s*1.76,.43,.088,.08,'glow',H,1);eye.rotation.z=-.23;
 rod([-2.93,1.46,s*1.75],[-1.68,1.55,s*1.67],.18,.06,'deep',H);
 rod([-2.91,1.54,s*1.75],[-2.04,1.67,s*1.74],.075,.022,'ice',H);
 poly(-6.48,.33,s*.42,.15,.09,.07,'mouth',H,1);
 // Crown antlers: thick bony trunk, six asymmetric forks, rearward sweep.
 const horns=[
 [[-.84,2.10,s*1.02],[-.13,3.41,s*1.29],.36,.27],
 [[-.13,3.41,s*1.29],[.91,4.38,s*1.55],.27,.17],
 [[.91,4.38,s*1.55],[2.39,5.02,s*1.79],.17,.014],
 [[-.12,3.45,s*1.30],[-.65,4.82,s*2.00],.17,.01],
 [[.49,4.05,s*1.51],[.50,5.21,s*2.14],.15,.01],
 [[1.17,4.55,s*1.66],[2.05,5.70,s*1.36],.13,.01],
 [[1.61,4.82,s*1.78],[3.04,5.25,s*2.18],.12,.01],
 [[-.46,2.99,s*1.25],[-1.25,3.76,s*1.92],.13,.01]
 ];
 horns.forEach(([a,b,r,rt])=>rod(a,b,r,rt,'antler',H));
 // Long curling illuminated whiskers, root emerges beside the face.
 tube([[-6.30,-.05,s*.60],[-7.50,-.45,s*1.60],
 [-8.75,-1.10,s*2.75],[-9.70,-.53,s*3.83],
 [-10.58,.68,s*4.0],[-11.38,.93,s*3.08]],.053,'whisker',H);
 tube([[-5.36,-.32,s*.64],[-6.40,-.85,s*1.44],
 [-7.25,-1.13,s*2.46],[-8.44,-.38,s*2.91],
 [-9.30,.50,s*2.20]],.028,'sea',H);
 // Sculpted scale patches wrap around broad cheekbone; hierarchy is visible.
 for(let row=0;row<5;row++)for(let k=0;k<15;k++){
  const x=-4.5+k*.295+(row%2)*.14,y=.52+row*.205;
  const z=s*(x<-3.30?.68:x<-2.1?1.09:1.56) +s*(row*.085);
  const a=cub(x,y,z,.42,.23,.20,k%7===0?'ice':k%3===0?'turquoise':k%2===0?'royal':'blue',H);
  a.rotation.z=-.13;
 }
 // Three broad flowing cheek fins, subdivided into recognizable voxel leaves.
 for(let row=0;row<3;row++)for(let j=0;j<13;j++){
  const x=-.56+j*.23,y=.45+row*.33,z=s*(1.6+row*.20);
  const a=[x,y,z],b=[x+.70,y+.51+(j%3)*.17,z+s*.59];
  rod(a,b,.19,.026,j%3===0?'ice':j%2===0?'sea':'turquoise',H,5);
  if(j%3===0)cub(x+.22,y+.24,z+s*.28,.32,.35,.22,'royal',H);
 }
 // Trailing pale-blue lower cheek beard.
 for(let j=0;j<9;j++){
  const x=-1.80+j*.30;
  rod([x,-.87,s*1.02],[x+.28,-1.63-(j%3)*.19,s*1.26],.17,.013,j%2?'sea':'ice',H);
 }
}
// Overlapping armor tufts along top of head; sharp crown surrounded by leafy streamers.
for(let j=0;j<30;j++){
 const x=-1.75+j*.17,z=Math.sin(j*.76)*.68;
 const y=2.14+.14*Math.sin(j*.42);
 leaf([x,y,z],[x+.86,y+.72+(j%3)*.15,z+.35],.34,
 j%3===0?'ice':j%2?'royal':'turquoise',H);
}
// Exactly TWO forelegs: muscular bend and 3 visible hooked claws per foot.
const chest=spine.getPoint(.13),fore=spine.getTangent(.13);
const lateral=new THREE.Vector3().crossVectors(fore,UP).normalize();
for(const s of [-1,1]){
 const shoulder=chest.clone().addScaledVector(lateral,s*1.49);
 const elbow=shoulder.clone().add(V(-.53,-1.77,s*1.36));
 const wrist=elbow.clone().add(V(-1.30,-1.51,s*.67));
 rod(shoulder,elbow,.75,.53,'deep');
 rod(elbow,wrist,.56,.38,'royal');
 poly(wrist.x,wrist.y,wrist.z,.86,.47,.67,'blue',dragon,1);
 for(let k=-1;k<=1;k++){
  const start=wrist.clone().add(V(-.43,-.13,k*.40));
  rod(start,start.clone().add(V(-1.05,-.41,k*.10)),.24,.02,'fang');
 }
}
// Spreading tailbrush made of long curved semi-luminous strands.
const tail=spine.getPoint(1),last=rings[ringSegments-1];
for(let k=0;k<18;k++){
 const a=k*2*Math.PI/18,n=last.above.clone().multiplyScalar(Math.cos(a)).addScaledVector(last.side,Math.sin(a));
 const from=tail.clone().addScaledVector(n,.13);
 const to=from.clone().addScaledVector(n,2.7+(k%4)*.22).addScaledVector(last.tan,1.55);
 leaf(from,to,.46,k%4===0?'sea':k%3===0?'ice':'turquoise');
}
// Floating translucent water-cloud geometry, small environment elements only.
const cloudCenters=[[-2.1,2.5,-1.7],[0,1.3,-3.7],[6.7,2.5,3.7],[12.1,6.9,-5.5],[17.3,10.1,4.5]];
for(const [x,y,z] of cloudCenters)for(let k=0;k<31;k++){
 const a=k*2.39996,r=.25+(k%6)*.20;
 cub(x+Math.cos(a)*r,y+Math.sin(a*.7)*r*.56,z+Math.sin(a)*r,
 .23+(k%3)*.20,.24+(k%4)*.13,.28+(k%5)*.13,
 k%7===0?'cloudEdge':'cloud');
}
const floor=mesh(new THREE.PlaneGeometry(130,130),new THREE.MeshStandardMaterial({color:0x0b131d,roughness:1}),scene);
floor.rotation.x=-Math.PI/2;floor.position.y=-3.5;
const grid=new THREE.GridHelper(80,40,0x1a3a51,0x142938);
grid.position.y=-3.48;scene.add(grid);
// Stable camera presets, with full sculpture initially framed at heroic 3/4.
dragon.updateMatrixWorld(true);
const bounds=new THREE.Box3().setFromObject(dragon);
const whole=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3());
let yaw=-.50,pitch=.08,distance=31,focus=head.position.clone().add(V(-4.7,.55,0)),spin=false,mode='head';
function fit(){
 const aspect=Math.max(.45,camera.aspect),t=Math.tan(camera.fov*Math.PI/360);
 return Math.min(115,Math.max(size.x*.52/(t*aspect),size.y*.60/t)*1.14+size.z*.36);
}
function setView(which){
 mode=which;spin=false;document.getElementById('spin').classList.remove('active');
 if(which==='front'){yaw=-.42;pitch=.13;focus.copy(whole);distance=fit()}
 if(which==='side'){yaw=0;pitch=.045;focus.copy(whole);distance=fit()}
 if(which==='back'){yaw=Math.PI+.15;pitch=.14;focus.copy(whole);distance=fit()}
 if(which==='head'){
  yaw=-.50;pitch=.08;focus.copy(head.position).add(V(-4.7,.55,0));
  distance=(innerWidth/Math.max(1,innerHeight)<1.1?31:28.0);
 }
}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
document.getElementById('zoomin').onclick=()=>distance=Math.max(7,distance*.8);
document.getElementById('zoomout').onclick=()=>distance=Math.min(120,distance*1.25);
document.getElementById('spin').onclick=e=>{spin=!spin;e.currentTarget.classList.toggle('active',spin);e.currentTarget.textContent=spin?'自動回転 ON':'自動回転 OFF'};
const pointers=new Map();let pinch=0;
canvas.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;
 const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===1){yaw-=(e.clientX-old.x)*.006;pitch=Math.max(-1.0,Math.min(1.2,pitch+(e.clientY-old.y)*.005));spin=false}
 if(pointers.size===2){const pts=[...pointers.values()],p=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
  if(pinch)distance=Math.max(7,Math.min(115,distance*pinch/p));pinch=p}
});
for(const event of ['pointerup','pointercancel','lostpointercapture'])
 canvas.addEventListener(event,e=>{pointers.delete(e.pointerId);pinch=0});
canvas.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(7,Math.min(115,distance*(1+Math.sign(e.deltaY)*.11)))},{passive:false});
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 if(mode==='full')distance=fit()}
addEventListener('resize',resize);resize();setView('head');
document.getElementById('spin').classList.remove('active');document.getElementById('spin').textContent='自動回転 OFF';
document.getElementById('status').style.display='none';
function draw(){
 requestAnimationFrame(draw);if(spin)yaw+=.0016;
 const cp=Math.cos(pitch);
 camera.position.set(focus.x+distance*Math.sin(yaw)*cp,focus.y+distance*Math.sin(pitch),focus.z+distance*Math.cos(yaw)*cp);
 camera.lookAt(focus);renderer.render(scene,camera);
}draw();
window.seiryuModelRevision='sculpture-34-polish';

</script>
