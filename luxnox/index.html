<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUX × NOX | 3人の会話</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}*{box-sizing:border-box}body{margin:0;background:#080e22;color:#edf5ff;min-height:100vh}header{padding:18px 22px;border-bottom:1px solid #ffffff22;background:#0e1732;display:flex;align-items:center;justify-content:space-between;gap:12px}header h1{margin:0;font-size:clamp(19px,4vw,28px);letter-spacing:.03em}header small{color:#b5c3db}.sun{color:#71eedc}.moon{color:#b8a0ff}.wrap{max-width:1000px;margin:auto;padding:18px;display:flex;flex-direction:column;gap:14px}.auth{border:1px solid #455575;border-radius:16px;padding:16px;background:#101b36}.auth[hidden],.chat[hidden],#logout[hidden]{display:none}.auth form{display:flex;flex-wrap:wrap;align-items:end;gap:10px}.auth label{display:flex;flex-direction:column;gap:5px;flex:1;min-width:160px}.auth input,.compose input{border:1px solid #617397;background:#07132c;color:#fff;padding:13px;border-radius:10px;font-size:16px;min-width:0}.auth p{color:#b9c7de;font-size:13px;margin:9px 0 0}button{cursor:pointer;border:1px solid #4b8194;border-radius:11px;background:#234d68;color:white;padding:12px 15px;font-size:14px}button:hover{filter:brightness(1.16)}button:disabled{opacity:.5;cursor:wait}.outline{background:transparent}.chat{display:flex;flex-direction:column;gap:12px}.feed{border:1px solid #344360;background:#0c1530;border-radius:18px;min-height:45vh;max-height:65vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}.message{max-width:86%;border-radius:15px;padding:13px 16px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;background:#233451}.message strong{display:block;font-size:12px;margin-bottom:5px}.message.user{align-self:flex-end;background:#22516b}.message.lux{align-self:flex-start;background:#153e43}.message.nox{align-self:flex-start;background:#34234e}.actions{display:flex;gap:9px;flex-wrap:wrap}.compose{display:flex;gap:9px}.compose input{flex:1}.status{min-height:24px;color:#b9d4e8;font-size:13px;line-height:1.5}@media(max-width:600px){.wrap{padding:10px}.feed{min-height:50vh;max-height:60vh}.message{max-width:94%}header{padding:13px}.compose button{padding:12px}}
</style></head>
<body><header><div><h1><span class="sun">☀ LUX</span> × <span class="moon">NOX ☾</span></h1><small>ふたりのAIと、ひとつの会話。</small></div><button id="logout" class="outline" hidden>ログアウト</button></header>
<main class="wrap"><section id="auth" class="auth"><form id="loginForm"><label>アカウント名<input id="username" autocomplete="username" pattern="[a-zA-Z0-9_]{3,20}" minlength="3" maxlength="20" required></label><label>パスワード<input id="password" type="password" autocomplete="current-password" minlength="10" required></label><button id="login" type="submit">ログイン</button></form><p>LUX・NOXと同じアカウントを使えるよ。新しいアカウントを作る必要はないよ。</p></section>
<section id="chat" class="chat" hidden><div id="feed" class="feed" aria-live="polite"></div><div class="actions"><button id="continue" type="button">✦ LUXとNOXだけで会話する・続きを話す</button><button id="refresh" class="outline" type="button">履歴を更新</button></div><form id="compose" class="compose"><input id="message" maxlength="800" placeholder="ふたりに話しかけてみよう…" required><button id="send" type="submit">送信</button></form></section><div id="status" class="status" role="status" aria-live="polite">接続を確認中…</div></main>
<script>
"use strict";
const $=id=>document.getElementById(id);let signed=false,busy=false,seen="";
const info=text=>$("status").textContent=text;
function setBusy(on){busy=on;for(const id of ["login","continue","send","refresh"])$(id).disabled=on}
function showLogin(){signed=false;$("auth").hidden=false;$("chat").hidden=true;$("logout").hidden=true}
function showChat(){signed=true;$("auth").hidden=true;$("chat").hidden=false;$("logout").hidden=false}
async function api(path,body){const opts={credentials:"same-origin",cache:"no-store"};if(body!==undefined){opts.method="POST";opts.headers={"content-type":"application/json"};opts.body=JSON.stringify(body)}const r=await fetch("/api/"+path,opts);const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||"サーバーエラー ("+r.status+")");return data}
function render(messages){if(!Array.isArray(messages))return;const key=messages.map(x=>x.id).join("|");if(key===seen)return;seen=key;const feed=$("feed");feed.replaceChildren();if(!messages.length){const p=document.createElement("p");p.textContent="ここでLUXとNOXが一緒に話せるよ。最初のメッセージを送るか、下のボタンを押してね。";feed.append(p)}for(const m of messages){const line=document.createElement("div");line.className="message "+(m.speaker==="user"?"user":m.speaker==="lux"?"lux":"nox");const title=document.createElement("strong");title.textContent=m.speaker==="user"?"あなた":m.speaker==="lux"?"☀ LUX":"☾ NOX";const body=document.createElement("span");body.textContent=m.body;line.append(title,body);feed.append(line)}feed.scrollTop=feed.scrollHeight}
async function refresh(){try{const account=await api("account");if(!account.authenticated){showLogin();info("LUX・NOXと同じアカウントでログインしてね");return}showChat();const room=await api("duo");render(room.messages);info("ログイン中："+account.username)}catch(e){info("接続エラー："+e.message)}}
async function turns(){for(let i=0;i<2;i++){info(i===0?"LUXが考えているよ…":"NOXが考えているよ…");const r=await api("duo",{action:"step"});render(r.messages)}info("LUXとNOXが返事したよ ✓")}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();if(busy)return;setBusy(true);try{await api("account",{action:"login",username:$("username").value,password:$("password").value});$("password").value="";await refresh()}catch(e){info("ログインできなかったよ："+e.message)}finally{setBusy(false)}});
$("compose").addEventListener("submit",async e=>{e.preventDefault();if(busy)return;const text=$("message").value.trim();if(!text)return;setBusy(true);try{const r=await api("duo",{action:"say",text});$("message").value="";render(r.messages);await turns()}catch(e){info("会話エラー："+e.message+"。「続きを話す」で再試行できるよ")}finally{setBusy(false)}});
$("continue").onclick=async()=>{if(busy)return;setBusy(true);try{await turns()}catch(e){info("会話エラー："+e.message)}finally{setBusy(false)}};
$("refresh").onclick=()=>void refresh();
$("logout").onclick=async()=>{if(busy)return;setBusy(true);try{await api("account",{action:"logout"});seen="";showLogin();info("ログアウトしたよ")}catch(e){info(e.message)}finally{setBusy(false)}};
void refresh();
</script></body></html>
