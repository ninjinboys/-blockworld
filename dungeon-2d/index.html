<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>DUNGEON — THE FORGOTTEN DEPTHS</title><style>*{box-sizing:border-box}body{margin:0;background:#0a0c12;color:#e8e2d3;font-family:system-ui,sans-serif;touch-action:manipulation}main{max-width:760px;margin:auto;padding:12px;user-select:none}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}h1{font-size:23px;letter-spacing:4px;color:#e6c88a;margin:0}small{display:block;color:#9aa4b1;font-size:10px}#floor{font-size:22px;font-weight:bold;color:#f0c77b}.stats{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:6px;margin-bottom:8px}.stat{background:#20252d;border:1px solid #343b44;border-radius:7px;padding:7px;font-size:14px}.hpbar{height:5px;background:#443037;border-radius:5px;margin-top:5px;overflow:hidden}.hpbar i{display:block;height:100%;background:#e15c68}.screen{position:relative;border:2px solid #383c43;border-radius:8px;overflow:hidden}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:none}.overlay{position:absolute;inset:0;background:#0a0d14e8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px}.overlay h2{color:#f0cb83;font-size:clamp(20px,5vw,30px);letter-spacing:3px;margin:0}.overlay p{font-size:13px;line-height:1.65}.overlay button{background:#c49a53;color:#19130c;border:0;padding:10px 28px}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;margin:8px 0}.log{background:#191e26;border-radius:6px;padding:9px;min-height:42px;font-size:12px;color:#e7d2a9}.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0}.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,42px);gap:4px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;max-width:240px}button{color:#e3e5e8;background:#29 x;line-height:14px}main>.legend{margin:5px 0;line-height:14px}main>.foot{padding:0;line-height:14px}main .overlay{padding:4px;gap:4px}main .overlay p{margin:2px 0;line-height:1.3}main .overlay button{min-height:34px;padding:5px 20px}@media(max-width:380px){main .controls{gap:8px}main .dpad{grid-template-columns:repeat(3,40px)}}@media(max-height:500px){main{padding-top:4px;padding-bottom:4px}main>header{margin-bottom:3px}main h1{font-size:16px}main .stats{margin-bottom:3px}main .stat{padding:3px 5px}main>.legend{margin:2px 0;font-size:9px}main>.log{height:28px;min-height:28px;font-size:10px;line-height:11px;padding:2px 5px}main>.controls{padding:3px 0;gap:10px}main .dpad{grid-template-rows:repeat(3,27px);gap:2px}main .actions{gap:4px}main .actions button{min-height:34px}main>.foot{display:none}main .overlay h2{font-size:18px}main .overlay p{font-size:10px}main .overlay button{min-height:28px}}</style><style id="large-playfield">main{max-width:none;padding:4px 8px max(4px,env(safe-area-inset-bottom));gap:3px}main>header{margin:0;min-height:23px}main h1{font-size:16px;letter-spacing:2px;line-height:22px}main>header small{display:none}main #floor{font-size:17px;line-height:22px}main>.stats{margin:0;gap:4px}main .stat{padding:3px 6px;line-height:15px}main .stat small{font-size:9px;line-height:11px}main .hpbar{margin-top:2px;height:3px}main>.screen{flex:1 1 0;min-height:0;width:100%;max-width:none;margin:0;position:relative;display:block;border-width:1px}main>.screen canvas{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:fill}main>.legend{margin:0;font-size:9px;line-height:12px;gap:8px}main>.log{height:27px;min-height:27px;padding:3px 6px;font-size:11px;line-height:13px}main>.foot{display:none}main>.controls{padding:3px 0 2px}main .overlay{z-index:1}@media(max-height:500px){main{gap:2px}main>header{min-height:18px}main h1,main #floor{line-height:18px;font-size:14px}main>.legend{display:none}main>.log{height:22px;min-height:22px;line-height:12px}main>.controls{padding:2px 0}}</style></head><body><main><header><div><h1>DUNGEON</h1><small>THE FORGOTTEN DEPTHS</small></div><div id="floor">B1F</div></header><div class="stats"><div class="stat"><small>HP</small><b id="hp"></b><div class="hpbar"><i id="hpb"></i></div></div><div class="stat"><small>攻撃力</small><b id="atk"></b></div><div class="stat"><small>GOLD</small><b id="gold"></b></div><div class="stat"><small>鍵</small><b id="key"></b></div></div><div class="screen"><canvas id="canvas" width="608" height="416"></canvas><div id="overlay" class="overlay"><h2>⚔ DUNGEON</h2><p>忘れられた地下遺跡へ。<br>宝箱を探し、魔物を倒し、<br>地下3階に眠る守護者を討伐せよ。</p><button id="start">冒険を始める</button></div></div><div class="legend"><span style="color:#79c5ff">■ プレイヤー</span><span style="color:#db7376">■ 魔物</span><span style="color:#e9b756">■ 宝箱・鍵</span><span style="color:#ab98ec">■ 階段</span></div><div id="log" class="log"></div><div class="controls"><div class="dpad"><span></span><button data-m="0,-1">▲</button><span></span><button data-m="-1,0">◀</button><button id="wait2">•</button><button data-m="1,0">▶</button><span></span><button data-m="0,1">▼</button><span></span></div><div class="actions"><button class="attack" id="attack">⚔ 攻撃</button><button class="heal" id="heal">回復 ×2</button><button id="wait">待機</button><button id="reset">リセット</button></div></div><div class="foot">方向キー / WASD：移動　Space：攻撃　Q：回復</div></main><script>
(()=>{const $=s=>document.getElementById(s),c=$('canvas'),ctx=c.getContext('2d'),T=32,W=19,H=13;let p,map,enemies,items,seen,visible,floor=1,active=false,stairs,turn=0,dir=[1,0],msg='',kills=0;const rng=n=>Math.floor(Math.random()*n),cell=(x,y)=>x>=0&&x<W&&y>=0&&y<H&&map[y][x]===1,dist=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y);function carve(x,y,w,h){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)map[j][i]=1}function corridor(a,b){let x=a.x,y=a.y;while(x!==b.x){map[y][x]=1;x+=Math.sign(b.x-x)}while(y!==b.y){map[y][x]=1;y+=Math.sign(b.y-y)}map[y][x]=1}function build(){map=Array.from({length:H},()=>Array(W).fill(0));const rooms=[{x:1,y:1,w:6,h:4},{x:11,y:1,w:7,h:4},{x:1,y:8,w:6,h:4},{x:11,y:8,w:7,h:4},{x:7,y:5,w:5,h:3}],centers=rooms.map(r=>({x:r.x+Math.floor(r.w/2),y:r.y+Math.floor(r.h/2)}));rooms.forEach(r=>carve(r.x,r.y,r.w,r.h));for(let i=0;i<4;i++)corridor(centers[i],centers[4]);if(floor===2){corridor(centers[0],centers[2]);carve(8,2,2,2)}if(floor===3){carve(8,1,3,4);corridor(centers[1],centers[3])}p.x=2;p.y=2;p.key=false;stairs={x:16,y:10};enemies=[];items=[];seen=new Set;visible=new Set;function enemy(x,y,type){const boss=type==='boss',hp=boss?60:floor===1?10:floor===2?15:19;enemies.push({x,y,type,hp,max:hp,atk:boss?7:floor+1,key:type==='guard',awake:false})}enemy(13,3,'guard');enemy(4,9,'slime');enemy(13,9,'skeleton');if(floor>=2)enemy(9,6,'slime');if(floor===3){enemy(16,10,'boss');enemy(15,2,'skeleton')}items.push({x:5,y:3,type:'chest'},{x:2,y:10,type:'chest'},{x:15,y:3,type:'potion'});if(floor>=2)items.push({x:12,y:10,type:'potion'});msg=floor===3?'地下3階：古代の守護者が待ち構えている。':'地下'+floor+'階に到着。鍵を持つ魔物を探そう。'}
function newPlayer(){return{x:2,y:2,hp:40,max:40,atk:8,gold:0,potions:2,key:false}}function start(){floor=1;turn=0;kills=0;dir=[1,0];p=newPlayer();active=true;$('overlay').style.display='none';build();render()}
function lineVisible(x,y){let steps=Math.max(Math.abs(x-p.x),Math.abs(y-p.y));for(let i=1;i<steps;i++){let tx=Math.round(p.x+(x-p.x)*i/steps),ty=Math.round(p.y+(y-p.y)*i/steps);if(!cell(tx,ty))return false}return true}function vision(){visible.clear();for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(Math.hypot(x-p.x,y-p.y)<=5.6&&lineVisible(x,y)){let k=y*W+x;visible.add(k);seen.add(k)}}function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}function sprite(x,y,kind){const a=x*T,b=y*T,r=(x,y,w,h,col)=>rect(a+x,b+y,w,h,col);r(6,25,20,4,'#0007');if(kind==='hero'){r(9,5,14,8,'#d2dce4');r(6,10,20,7,'#87a3bb');r(10,12,12,5,'#233b54');r(11,13,3,2,'#d9f2ff');r(18,13,3,2,'#d9f2ff');r(7,17,18,9,'#497bb5');r(9,26,5,4,'#adc1d2');r(19,26,5,4,'#adc1d2');r(25,8,3,17,'#f3e6bd');r(22,20,9,3,'#cfa04b')}else if(kind==='slime'){r(7,12,18,14,'#4c966c');r(4,19,24,8,'#66b485');r(11,9,10,5,'#8bd5a0');r(10,17,3,4,'#10291e');r(20,17,3,4,'#10291e')}else if(kind==='skeleton'||kind==='guard'){r(8,4,16,13,kind==='guard'?'#d1a662':'#c6c5b8');r(11,9,4,4,'#352d36');r(19,9,4,4,'#352d36');r(11,17,10,3,'#b9b9ae');r(9,21,14,3,'#b9b9ae');r(10,25,4,5,'#ddd9c4');r(19,25,4,5,'#ddd9c4');r(25,9,3,18,'#a6adb5');if(kind==='guard')r(3,17,6,9,'#e9b34c')}else if(kind==='boss'){r(3,8,26,20,'#783347');r(7,3,5,9,'#d4bca4');r(21,3,5,9,'#d4bca4');r(6,10,20,13,'#b64b51');r(9,13,5,4,'#ffdc7e');r(20,13,5,4,'#ffdc7e');r(11,23,10,4,'#392233')}else if(kind==='chest'){r(5,12,22,15,'#9d5c2c');r(7,8,18,6,'#b77b3b');r(5,14,22,3,'#edb956');r(14,14,5,8,'#f5d77b');r(8,25,16,2,'#512f21')}else if(kind==='potion'){r(13,6,7,5,'#b7b7ae');r(11,11,11,4,'#c8d0ca');r(8,15,17,12,'#b83d63');r(11,17,4,7,'#f18ca7')}else if(kind==='stairs'){r(3,5,26,24,'#39334e');for(let i=0;i<4;i++)r(6+i*2,7+i*5,20-i*4,3,'#9e8bc9')}}
function render(){vision();const cssW=c.clientWidth,cssH=c.clientHeight,dpr=Math.min(2,window.devicePixelRatio||1);if(cssW>0&&cssH>0){const nw=Math.max(1,Math.round(cssW*dpr)),nh=Math.max(1,Math.round(cssH*dpr));if(c.width!==nw||c.height!==nh){c.width=nw;c.height=nh}}ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#090c12';ctx.fillRect(0,0,c.width,c.height);const worldW=W*T,worldH=H*T,z=Math.max(c.width/worldW,c.height/worldH,0.95*dpr),vw=c.width/z,vh=c.height/z;const ox=vw>=worldW?(worldW-vw)/2:Math.max(0,Math.min(worldW-vw,(p.x+.5)*T-vw/2)),oy=vh>=worldH?(worldH-vh)/2:Math.max(0,Math.min(worldH-vh,(p.y+.5)*T-vh/2));ctx.setTransform(z,0,0,z,-ox*z,-oy*z);ctx.imageSmoothingEnabled=false;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let k=y*W+x;if(!seen.has(k))continue;let a=x*T,b=y*T;if(cell(x,y)){rect(a,b,T,T,(x+y)%2?'#353841':'#30333b');rect(a,b+31,T,1,'#292d34');rect(a+8,b+9,7,1,'#41434b');rect(a+22,b+23,4,2,'#252831')}else{rect(a,b,T,T,'#1e232d');rect(a+1,b+2,30,13,'#424956');rect(a+1,b+18,30,12,'#333a46');rect(a+15,b+2,2,13,'#202630');rect(a+7,b+18,2,12,'#202630')}if(!visible.has(k))rect(a,b,T,T,'#070911a5')}const show=o=>visible.has(o.y*W+o.x);if(show(stairs))sprite(stairs.x,stairs.y,'stairs');items.forEach(o=>{if(show(o))sprite(o.x,o.y,o.type)});enemies.forEach(e=>{if(show(e)){sprite(e.x,e.y,e.type);rect(e.x*T+4,e.y*T+1,24,3,'#562d38');rect(e.x*T+4,e.y*T+1,24*e.hp/e.max,3,'#e06a6a')}});rect(p.x*T+1,p.y*T+1,30,30,'#6597c219');sprite(p.x,p.y,'hero');$('floor').textContent='B'+floor+'F';$('hp').textContent=p.hp+' / '+p.max;$('hpb').style.width=100*p.hp/p.max+'%';$('atk').textContent=p.atk;$('gold').textContent=p.gold;$('key').textContent=p.key?'あり':'なし';$('log').textContent=msg;$('heal').textContent='回復 ×'+p.potions}
function end(win){active=false;let o=$('overlay');o.innerHTML='<h2>'+(win?'DUNGEON CLEAR':'GAME OVER')+'</h2><p>'+(win?'古代の守護者を討伐した！':'地下遺跡で力尽きた。')+'<br>到達階層：B'+floor+'F<br>討伐数：'+kills+'　獲得ゴールド：'+p.gold+'</p><button>もう一度挑戦</button>';o.style.display='flex';o.querySelector('button').onclick=start}function strike(e){let damage=p.atk+rng(3);e.hp-=damage;msg='魔物に'+damage+'ダメージ。';if(e.hp<=0){kills++;p.gold+=e.type==='boss'?100:10+floor*5;enemies=enemies.filter(v=>v!==e);msg='魔物を倒した！';if(e.key){p.key=true;msg='守衛を倒し、階段の鍵を手に入れた！'}if(e.type==='boss'){render();end(true)}}}function enemyTurn(){if(!active)return;turn++;for(let e of enemies){if(dist(e,p)<=1){p.hp=Math.max(0,p.hp-e.atk);msg+=' 魔物から'+e.atk+'ダメージ。';if(p.hp<=0){render();end(false);return}continue}if(dist(e,p)>5&&!e.awake)continue;e.awake=true;if(e.type!=='boss'&&turn%2===0)continue;let choices=[[Math.sign(p.x-e.x),0],[0,Math.sign(p.y-e.y)]].filter(d=>d[0]||d[1]);if(Math.abs(p.y-e.y)>Math.abs(p.x-e.x))choices.reverse();for(let [dx,dy] of choices){let x=e.x+dx,y=e.y+dy;if(cell(x,y)&&!enemies.some(o=>o!==e&&o.x===x&&o.y===y)&&!(p.x===x&&p.y===y)){e.x=x;e.y=y;break}}}render()}function move(dx,dy){if(!active)return;dir=[dx,dy];let x=p.x+dx,y=p.y+dy;if(!cell(x,y)){msg='壁が行く手を阻んでいる。';render();return}let enemy=enemies.find(e=>e.x===x&&e.y===y);if(enemy){strike(enemy);enemyTurn();return}p.x=x;p.y=y;msg='遺跡を探索している。';let item=items.find(o=>o.x===x&&o.y===y);if(item){if(item.type==='chest'){p.atk+=2;p.gold+=20;p.hp=Math.min(p.max,p.hp+6);msg='宝箱発見！ 攻撃力+2、20G、HP+6。'}else{p.potions++;msg='回復薬を手に入れた。'}items=items.filter(o=>o!==item)}if(x===stairs.x&&y===stairs.y&&floor<3){if(p.key){floor++;p.hp=Math.min(p.max,p.hp+12);build();render();return}else msg='階段には鍵が必要だ。'}enemyTurn()}function attack(){if(!active)return;let e=enemies.find(e=>e.x===p.x+dir[0]&&e.y===p.y+dir[1])||enemies.find(e=>dist(e,p)===1);if(e){strike(e);enemyTurn()}else{msg='近くに攻撃できる敵がいない。';render()}}function heal(){if(!active)return;if(!p.potions){msg='回復薬がない。';render();return}if(p.hp===p.max){msg='HPは満タンだ。';render();return}p.potions--;p.hp=Math.min(p.max,p.hp+24);msg='回復薬を使用。HPが回復した。';enemyTurn()}function wait(){if(active){msg='その場で待機。';enemyTurn()}}document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>move(...b.dataset.m.split(',').map(Number)));$('wait2').onclick=wait;$('wait').onclick=wait;$('attack').onclick=attack;$('heal').onclick=heal;$('start').onclick=start;$('reset').onclick=start;document.addEventListener('keydown',e=>{if(!active)return;let k=e.key.toLowerCase(),m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];if(m){e.preventDefault();move(...m)}else if(k===' '){e.preventDefault();attack()}else if(k==='q')heal()});p=newPlayer();build();render();if(typeof ResizeObserver!=='undefined'){new ResizeObserver(()=>{if(p)render()}).observe(c.parentElement)}else{window.addEventListener('resize',()=>{if(p)render()})}})();
</script><script>(()=>{const fit=()=>{const h=window.visualViewport?window.visualViewport.height:window.innerHeight;document.documentElement.style.setProperty('--visible-height',Math.floor(h)+'px')};fit();window.addEventListener('resize',fit);window.addEventListener('orientationchange',fit);if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);window.addEventListener('pageshow',fit)})();</script></body></html>
