<style>
*{box-sizing:border-box}html{background:#0a171c}body{margin:0;color:#eaf8f3;font:14px system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#0a171c}

</style></head><body><main>
<header><div><h1>NEXACRAFT <span>WARP DEVICE</span></h1><small>ボス転送装置 3Dモデル　／　古代遺跡・円弧状ゲート・浮遊石・結晶・アイテム投入口</small></div><a class="back" href="./">← ゲームへ戻る</a></header>
<div id="frame"><div id="hud">WARP DEVICE ／ 3D MODEL</div><div id="stageStatus">指で回転・ピンチで拡大できます</div><div id="error">3D表示を読み込めませんでした。ゲームと同じブラウザ（SafariまたはChrome）で再度開いてください。</div></div>
<div class="controls"><button id="angle">斜め</button><button id="front">正面</button><button id="side">側面</button><button id="top">上面</button><button id="left">◀ 回転</button><button id="right">回転 ▶</button><button id="near">拡大＋</button><button id="far">縮小−</button></div>
<footer>ワールドへの設置やボス転送処理とは別に、外観を確認するための3Dモデルです。ゲーム本編への追加前の造形確認に使用します。</footer>
</main><script type="module">
(async()=>{
let T;const root=document.querySelector('#frame'),status=document.querySelector('#stageStatus');
try{T=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/+esm')}catch(e){root.classList.add('error');return}
try{
const scene=new T.Scene();scene.background=new T.Color(0x11252b);
const camera=new T.PerspectiveCamera(37,1,.1,120);
const renderer=new T.WebGLRenderer({antialias:false,alpha:false,powerPreference:'high-performance'});
renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.6;
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));root.prepend(renderer.domElement);
const hemi=new T.HemisphereLight(0xe6ffff,0x31403d,2.0);scene.add(hemi);
const sun=new T.DirectionalLight(0xffe1aa,2.6);sun.position.set(-7,14,11);scene.add(sun);
const rim=new T.DirectionalLight(0x21dfd2,1.6);rim.position.set(8,8,-9);scene.add(rim);
const g=new T.Group();scene.add(g);
const C={stone:0xa39e87,pale:0xc4b99b,cream:0xd8c7a6,gray:0x848982,shadow:0x536764,moss:0x536d3c,leaf:0x6c934b,crack:0x5c5750,teal:0x19d6c7,glow:0x65fff2};
const blocks=[],lights=[];
let seed=2421;function rnd(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
function b(x,y,z,w,h,d,color,rot=0){blocks.push({x,y,z,w,h,d,color,rot})}
function lit(x,y,z,w,h,d,color=C.teal,rot=0){lights.push({x,y,z,w,h,d,color,rot})}
function diamond(x,y,z,sx,sy,sz,bright=false){
 const material=new T.MeshStandardMaterial({color:bright?0xa4fffa:0x34dcda,metalness:.15,roughness:.16,transparent:true,opacity:bright?.90:.87,emissive:0x10c7c1,emissiveIntensity:bright?1.3:.8,depthWrite:true,flatShading:true});
 const o=new T.Mesh(new T.OctahedronGeometry(1,0),material);o.position.set(x,y,z);o.scale.set(sx,sy,sz);g.add(o);
 const wire=new T.LineSegments(new T.EdgesGeometry(o.geometry),new T.LineBasicMaterial({color:0xbffffa,transparent:true,opacity:.78}));
 wire.position.copy(o.position);wire.scale.copy(o.scale).multiplyScalar(1.003);g.add(wire);
}
const randomPalette=[C.stone,C.pale,C.gray,C.cream];
b(0,.18,0,11,.35,8.3,C.gray);b(0,.42,-.23,10.6,.18,7.7,C.shadow);
// Closely fitted individually carved flagstones with a visible grout grid.
for(let i=-10;i<=10;i++)for(let j=-7;j<=7;j++){
 const x=i*.49,z=j*.49-.33;if(Math.abs(x)>5.12||Math.abs(z)>3.75)continue;
 const col=randomPalette[Math.floor(rnd()*randomPalette.length)];
 b(x,.55,z,.466,.17,.47,col);
 if(rnd()<.20)b(x+.08,.65,z+.05,.23,.018,.16,C.moss);
}
for(const side of [-1,1]){
 for(let j=-7;j<=7;j++)b(side*5.14,.81,j*.50-.20,.48,.50,.46,j%3===0?C.pale:C.stone);
}
for(let i=-10;i<=10;i++)b(i*.5,.83,-3.77,.47,.60,.50,i%4===0?C.stone:C.gray);
// Four steps with substantial individual stones.
for(let k=0;k<4;k++)for(let i=-4;i<=4;i++){
 const z=4.30-k*.43,h=.22+k*.18;
 b(i*.45,.05+h/2,z,.44,h,.50,(i+k)%3===0?C.cream:C.stone);
 b(i*.45,h+.085,z,.43,.12,.46,i%3?C.gray:C.pale);
}
for(let i=-3;i<=3;i++)for(let j=-2;j<=2;j++)
 b(i*.48,.72,j*.48-.52,.46,.32,.46,(i+j)%3?C.stone:C.pale);
// Stone arch: segments create a broken, curving half-ring on each side.
for(const side of [-1,1]){
 b(side*3.88,1.04,1.52,1.05,1.25,1.02,C.gray);
 b(side*3.88,1.72,1.52,1.21,.19,1.15,C.cream);
 b(side*3.88,1.02,2.045,.57,.53,.055,C.shadow);
 diamond(side*3.88,1.06,2.12,.25,.40,.15);
 for(let j=0;j<15;j++){
  const angle=.04+j*.075;
  const x=side*4.04*Math.cos(angle),y=1.58+4.05*Math.sin(angle),rot=-side*angle;
  b(x,y,-1,.87,.86,.92,randomPalette[j%4],rot);
  if(j%2===0)b(x+side*.1,y+.1,-.515,.53,.045,.039,C.crack,rot);
  const a=side*3.57*Math.cos(angle),by=1.58+3.57*Math.sin(angle);
  lit(a,by,-.50,.17,.66,.16,C.teal,rot);
  if(j%3===0)b(x+side*.15,y+.30,-.54,.36,.15,.24,C.moss,rot);
 }
 for(let j=0;j<6;j++)b(side*(3.7+rnd()-.5),.92+rnd()*.55,-2.30+(rnd()-.5)*1.2,.48,.53,.58,j%2?C.gray:C.stone);
 for(let k=0;k<5;k++)b(side*(2+k*.22),.79+k*.06,3.5-k*.37,.55,.42,.57,C.stone);
 diamond(side*2.65,1.38,2.40,.16,.29,.18);
}
// Narrow monumental tower behind the magical center.
for(let j=0;j<15;j++){
 const y=1.1+j*.48,w=j<7?1.35:j<10?1.28:j<12?1.17:j<14?.95:.7;
 for(let i=0;i<3;i++)b((i-1)*w/3,y,-2.02,w/3-.023,.46,1.1,randomPalette[(j+i)%4]);
 if(j%2===0)lit(.52,y,-1.42,.10,.36,.09,C.teal);
 if(j%3===1)b(-w/2-.12,y,-1.85,.27,.52,.68,C.shadow);
 if(j===4||j===8||j===12)lit(0,y+.24,-1.41,.61,.071,.10);
}
for(const side of [-1,1])for(let j=0;j<8;j++){
 const y=1.16+j*.52;
 b(side*(1.10+.06*(j%2)),y,-2.46,.44,.49,.42,j%4?C.gray:C.pale);
 if(j%3===0)lit(side*1.11,y+.15,-2.14,.20,.12,.13);
}
const floating=[[-4.95,6.4,-1.35,.73],[4.95,6.1,-1.2,.78],[-3.18,7.2,-1.95,.65],[3.36,7.48,-2.06,.66],[-1.96,7.97,-2.22,.54],[1.92,7.99,-2.04,.57],[-4.73,4.5,1.12,.37],[4.78,4.53,1.02,.42],[1.20,6.13,0,.34],[-1.24,5.28,.21,.41]];
for(const [i,v] of floating.entries()){
 const [x,y,z,d]=v;
 b(x,y,z,d,d*.86,d,i%2?C.stone:C.cream,.15*(i%3-1));
 lit(x+.05,y,z+d*.52,d*.46,.07,.04,C.teal);
 if(i%2===0)b(x-.1,y+d*.40,z,.26,.09,.25,C.moss);
}
lit(0,3.56,-.97,.21,3.92,.23);
lit(0,3.7,-1.14,.45,2.7,.14,0x0d8488);
diamond(0,4,.20,.90,1.42,.70);
diamond(0,4.03,.78,.39,.88,.31,true);
for(let i=0;i<9;i++){const a=i*2.40;diamond(Math.cos(a)*1.25,4+Math.sin(a*.7)*1.05,.40+Math.sin(a)*.38,.12+(i%2)*.07,.16+(i%3)*.05,.16)}
b(0,.95,.52,1.48,.45,1.48,C.gray);b(0,1.20,.52,1.11,.11,1.08,C.cream);
lit(0,1.27,.52,.80,.065,.74);
b(0,1.31,.52,.49,.05,.45,C.shadow);
// Distinct item insertion pedestal at front-left of the warp device.
b(-1.65,.90,1.68,1.10,.77,1.15,C.stone);
b(-1.65,1.33,1.68,1.29,.17,1.34,C.cream);
lit(-1.65,1.43,1.68,.79,.06,.87);
b(-1.65,1.468,1.68,.52,.05,.55,C.shadow);
diamond(-1.65,1.08,2.28,.22,.37,.12);
for(const side of [-1,1]){
 for(let j=0;j<15;j++){
  const a=.14+(j%8)*.12;
  const x=side*(4.04*Math.cos(a)+(rnd()-.5)*.5),y=1.58+4.05*Math.sin(a)+(rnd()-.5)*.2,z=-.58+rnd()*.33;
  if(j%3===0)b(x,y,z,.29,.21,.3,C.leaf);
  if(j%5===0)for(let n=0;n<3;n++)b(x+.07,y-n*.17,z+.16,.1,.2,.14,C.moss);
 }
}
for(let j=0;j<68;j++){
 const x=(rnd()-.5)*9.8,z=(rnd()-.5)*6.6;if(Math.abs(x)<1.7&&z>.8)continue;
 const r=.10+rnd()*.18;
 b(x,.70+(r*.2),z,r*.55,r*.4,r*.63,rnd()<.6?C.moss:C.leaf);
}
// Use instancing rather than hundreds of draw calls, keeping iPad performance.
const boxGeo=new T.BoxGeometry(1,1,1),D=new T.Object3D();
function addBatch(list,material,perInstanceColors=true){
 const mesh=new T.InstancedMesh(boxGeo,material,list.length);mesh.instanceMatrix.setUsage(T.StaticDrawUsage);
 list.forEach((p,i)=>{D.position.set(p.x,p.y,p.z);D.rotation.set(0,0,p.rot||0);D.scale.set(p.w,p.h,p.d);D.updateMatrix();mesh.setMatrixAt(i,D.matrix);if(perInstanceColors)mesh.setColorAt(i,new T.Color(p.color))});
 mesh.instanceMatrix.needsUpdate=true;if(mesh.instanceColor)mesh.instanceColor.needsUpdate=true;
 mesh.frustumCulled=false;g.add(mesh);
}
addBatch(blocks,new T.MeshStandardMaterial({color:0xffffff,roughness:.85,metalness:0,flatShading:true,vertexColors:false}));
addBatch(lights,new T.MeshBasicMaterial({color:0xffffff,toneMapped:false}));
const ground=new T.Mesh(new T.CircleGeometry(19,48),new T.MeshLambertMaterial({color:0x10282b,transparent:true,opacity:.75}));ground.rotation.x=-Math.PI/2;ground.position.y=-.08;scene.add(ground);
let yaw=.62,pitch=.30,dist=20,changing=false,frames=0;
const center=new T.Vector3(0,3.54,0),relative=new T.Vector3(),touches=new Map();
function render(){
 const w=root.clientWidth,h=root.clientHeight;if(!w||!h)return;
 const width=Math.max(1,w),height=Math.max(1,h);
 if(renderer.domElement.width!==Math.round(width*renderer.getPixelRatio())||renderer.domElement.height!==Math.round(height*renderer.getPixelRatio())){
  renderer.setSize(width,height,false);camera.aspect=width/height;camera.updateProjectionMatrix();
 }
 camera.position.set(center.x+dist*Math.sin(yaw)*Math.cos(pitch),center.y+dist*Math.sin(pitch),center.z+dist*Math.cos(yaw)*Math.cos(pitch));
 camera.lookAt(center);renderer.render(scene,camera);frames++;
}
let pending=false;function req(){if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;render()})}
new ResizeObserver(req).observe(root);req();
function on(id,fn){document.getElementById(id).addEventListener('click',()=>{fn();req()})}
on('angle',()=>{yaw=.62;pitch=.30;dist=20});
on('front',()=>{yaw=0;pitch=.12;dist=21});
on('side',()=>{yaw=Math.PI/2;pitch=.13;dist=22});
on('top',()=>{yaw=.05;pitch=1.36;dist=22});
on('left',()=>yaw-=.35);on('right',()=>yaw+=.35);
on('near',()=>dist=Math.max(9,dist/1.2));on('far',()=>dist=Math.min(36,dist*1.2));
function pinch(){const p=[...touches.values()];return p.length<2?null:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}
let lastPinch=null;
renderer.domElement.addEventListener('pointerdown',e=>{touches.set(e.pointerId,{x:e.clientX,y:e.clientY});renderer.domElement.setPointerCapture(e.pointerId);lastPinch=pinch()});
renderer.domElement.addEventListener('pointermove',e=>{
 const prev=touches.get(e.pointerId);if(!prev)return;
 touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
 const next=pinch();
 if(next!==null&&lastPinch!==null&&next>0){dist=Math.min(36,Math.max(9,dist*lastPinch/next));lastPinch=next;}
 else if(next===null){yaw-=(e.clientX-prev.x)*.009;pitch=Math.max(-.10,Math.min(1.5,pitch+(e.clientY-prev.y)*.007));}
 req();
});
for(const type of ['pointerup','pointercancel'])renderer.domElement.addEventListener(type,e=>{touches.delete(e.pointerId);lastPinch=pinch()});
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(9,Math.min(36,dist*(e.deltaY>0?1.13:.88)));req()},{passive:false});
status.textContent='3Dモデル表示中 ／ ドラッグで回転・ピンチで拡大';
}catch(e){console.error(e);root.classList.add('error')}
})();
</script></body></html>
