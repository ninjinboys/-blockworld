</main><script type="module">
(async()=>{
let T;const root=document.querySelector('#frame'),status=document.querySelector('#stageStatus');
try{T=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/+esm')}catch(e){root.classList.add('error');return}
try{
const scene=new T.Scene();scene.background=new T.Color(0x11252b);
const camera=new T.PerspectiveCamera(37,1,.1,120);
const renderer=new T.WebGLRenderer({antialias:false,alpha:false,powerPreference:'high-performance'});
renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.55;
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));root.prepend(renderer.domElement);
const hemi=new T.HemisphereLight(0xc3d7d9,0x14191b,1.25);scene.add(hemi);
const sun=new T.DirectionalLight(0xc7d7dd,1.6);sun.position.set(-7,14,11);scene.add(sun);
const rim=new T.DirectionalLight(0x21dfd2,1.6);rim.position.set(8,8,-9);scene.add(rim);
const g=new T.Group();scene.add(g);

const C={
  basalt:0x252c30, stone:0x333b3e, slate:0x3e4649, light:0x4b5354,
  edge:0x171d21, deep:0x11171a, moss:0x365841, leaf:0x52774b,
  cyan:0x28c7be, bright:0x72fff0
};
const blocks=[],lights=[],floating=[];
const colorStones=[C.basalt,C.stone,C.slate,C.stone,C.light,C.basalt];
let seed=26731497;
function rnd(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
function choose(a){return a[Math.floor(rnd()*a.length)]}
function b(x,y,z,w,h,d,color=C.stone,rot=0){blocks.push({x,y,z,w,h,d,color,rot})}
function lit(x,y,z,w,h,d,color=C.cyan,rot=0){lights.push({x,y,z,w,h,d,color,rot})}
function diamond(x,y,z,sx,sy,sz,bright=false){
 const material=new T.MeshStandardMaterial({
  color:bright?0xbafff6:0x4aece0,emissive:0x18bcae,
  emissiveIntensity:bright?2.0:1.05,roughness:.22,metalness:.05,
  transparent:true,opacity:bright?.96:.84,flatShading:true
 });
 const gem=new T.Mesh(new T.OctahedronGeometry(1,0),material);
 gem.position.set(x,y,z);gem.scale.set(sx,sy,sz);g.add(gem);
 const edges=new T.LineSegments(new T.EdgesGeometry(gem.geometry),
   new T.LineBasicMaterial({color:0xaafff0,transparent:true,opacity:.55}));
 edges.position.copy(gem.position);edges.scale.copy(gem.scale).multiplyScalar(1.006);g.add(edges);
 return gem;
}
// Broken stone slabs use angular bevels and joint gaps: no rounded toy-like arcs.
const stoneMaterials=colorStones.map(hex=>new T.MeshStandardMaterial({
 color:hex,roughness:.96,metalness:0,flatShading:true
}));
const archGlow=new T.MeshBasicMaterial({color:0x21aa9e,toneMapped:false});
const fracturePositions=[];
function fracture(points){for(let i=1;i<points.length;i++){fracturePositions.push(...points[i-1],...points[i])}}
function archWedge(side,rInside,rOutside,a0,a1,z0,z1,material){
 const point=(r,a)=>new T.Vector2(side*r*Math.cos(a),2.12+2*r*Math.sin(a));
 const shape=new T.Shape();
 const q=[point(rInside,a0),point(rOutside,a0),point(rOutside,a1),point(rInside,a1)];
 shape.moveTo(q[0].x,q[0].y);
 for(let j=1;j<4;j++)shape.lineTo(q[j].x,q[j].y);
 shape.closePath();
 const geo=new T.ExtrudeGeometry(shape,{
  depth:z1-z0,bevelEnabled:material!==archGlow,steps:1,
  bevelSegments:1,bevelThickness:material===archGlow?0:.025,
  bevelSize:material===archGlow?0:.035,curveSegments:1
 });
 const piece=new T.Mesh(geo,material);
 piece.position.z=z0;
 g.add(piece);
 return piece;
}
// Wide, irregular stone plinth.  The front silhouette is stepped and
// interrupted by the central stair, as in the reference's ruined monument.
b(0,.20,-.40,11.15,.40,7.25,C.deep);
b(0,.49,-.60,10.75,.26,6.84,C.basalt);
for(let x=-10;x<=10;x++)for(let z=-6;z<=6;z++){
 if(Math.abs(x)>9 && Math.abs(z)>5)continue;
 const px=x*.51,pz=z*.48-.62;
 b(px,.71+(rnd()-.5)*.025,pz,.486,.18,.457,choose(colorStones));
 if(rnd()<.065)b(px,.805,pz,.16,.042,.26,C.moss);
}
for(const side of [-1,1]){
 for(let z=-6;z<=6;z++){
  b(side*5.36,.74,z*.52-.54,.60,.79,.50,choose(colorStones));
  if(z%3===0)b(side*5.36,1.17,z*.52-.54,.64,.13,.53,C.light);
 }
 // Uneven corner pylons, stone face carvings and recessed energy diamonds.
 for(const z of [-2.75,2.0]){
  b(side*4.46,1.16,z,.98,1.04,1.02,C.basalt);
  b(side*4.46,1.74,z,1.08,.14,1.06,C.light);
  b(side*4.46,1.05,z+.535,.76,.63,.10,C.edge);
  diamond(side*4.46,1.10,z+.61,.19,.30,.09);
  b(side*4.02,1.70,z+.10,.20,.06,.38,C.moss);
 }
}
for(let row=0;row<4;row++){
 const z=4.02-row*.49;
 for(let i=-4;i<=4;i++){
  const x=i*.51,height=.18+(row+1)*.17;
  b(x,height/2,z,.49,height,.54,choose(colorStones));
  b(x,height+.072,z,.48,.14,.50,C.light);
 }
}
// Stout pylons lead to the two broken arches.
for(const side of [-1,1]){
 for(let j=0;j<4;j++){
  const x=side*(4.46-j*.14);
  b(x,1.18+j*.30,-1.06,.91,.68,1.38,choose(colorStones));
 }
 // The giant arch on each side is a continuous stone curve, NOT a row of
 // individual square bricks. Thick wedge blocks have carved dark seams.
 const segments=14,angMax=1.155;
 for(let j=0;j<segments;j++){
  const a0=j*angMax/segments+.004,a1=(j+1)*angMax/segments-.009;
  const stone=stoneMaterials[(j+Math.floor(rnd()*4))%stoneMaterials.length];
  archWedge(side,4.06,5.13,a0,a1,-1.22,.25,stone);
  // Thin, continuous cyan inlay on the INNER curve, not a thick light ladder.
  archWedge(side,3.99,4.07,a0+.004,a1-.004,-.83,-.64,archGlow);
  if(j%3===1){
   const a=(a0+a1)*.5,r=5.20;
   const xx=side*r*Math.cos(a),yy=2.12+2*r*Math.sin(a);
   const mx=side*(r+.07)*Math.cos(a+.022),my=2.12+2*(r+.07)*Math.sin(a+.022);
   fracture([[xx,yy,.30],[mx,my,.31],
     [side*(r-.12)*Math.cos(a+.045),2.12+2*(r-.12)*Math.sin(a+.045),.32]]);
  }
  if(j%4===1){
   const a=(a0+a1)*.5;
   const x=side*5.22*Math.cos(a),y=2.12+2*5.22*Math.sin(a);
   b(x,y+.10,.13,.39,.15,.42,C.moss,-side*a);
  }
 }
 // The two ends have large, broken, offset capstones and missing fragments.
 const tip=angMax,tipX=side*4.60*Math.cos(tip),tipY=2.12+2*4.60*Math.sin(tip);
 b(tipX+side*.07,tipY+.45,-.51,1.36,.53,1.38,C.stone,-side*tip);
 b(tipX+side*.22,tipY+.73,-.68,.81,.32,.99,C.light,-side*(tip+.1));
 for(let k=0;k<12;k++){
  const a=.12+k*.070,r=5.06+(rnd()-.5)*.17;
  const x=side*r*Math.cos(a),y=2.12+2*r*Math.sin(a),z=.37;
  if(k%3===0){
   b(x,y,z,.23,.30,.25,C.moss,-side*a);
   b(x,y-.27,z+.04,.14,.32,.16,C.leaf,-side*a);
  }
 }
}
// Vertical tower: fractured and layered monolith that dominates the skyline.
b(0,1.1,-2.35,2.48,.9,2.00,C.deep);
for(let level=0;level<18;level++){
 const y=1.6+level*.48;
 const width=level<9?2.13:level<13?1.90:level<16?1.47:1.02;
 const count=level%3===0?4:3;
 for(let col=0;col<count;col++){
  const px=(col-(count-1)/2)*(width/count);
  const stone=choose(colorStones);
  const zz=-2.25+(rnd()-.5)*.09;
  b(px,y,zz,width/count-.044,.455,1.66-(level>14?.25:0),stone);
  if(rnd()<.20)b(px+.09,y+.236,-1.38,.17,.055,.05,C.edge);
  if(rnd()<.085)b(px+.12,y+.24,-1.31,.23,.075,.14,C.moss);
 }
 // A pair of recessed continuous vertical luminous channels.
 if(level>2&&level<14){
   for(const side of [-1,1])lit(side*.83,y,-1.33,.072,.38,.09,C.cyan);
 }
 if(level===7||level===12){
  b(0,y+.27,-2.26,width+.30,.16,1.90,C.basalt);
 }
}
for(let level=0;level<5;level++){
 const width=.76-level*.11;
 b(0,10.35+level*.32,-2.35,width,.34,.88,C.stone);
}
for(const side of [-1,1]){
 // Stone pinnacles and fractured defensive spires flank the monolith.
 for(let j=0;j<11;j++){
  const x=side*(1.62+.16*(j%3));
  const y=1.55+j*.52;
  b(x,y,-2.57,.61,.49,.83,choose(colorStones));
  if(j%3===1)lit(x-side*.08,y,-2.12,.13,.26,.08,C.cyan);
 }
 for(let j=0;j<4;j++){
  b(side*(2.26+j*.23),1.24+j*.31,-2.1,.67,.63,.79,C.basalt);
 }
}
// Ancient platform socket for materials, closer to the player than the core.
b(-1.65,1.02,1.25,1.46,.74,1.30,C.basalt);
b(-1.65,1.44,1.25,1.62,.14,1.44,C.light);
lit(-1.65,1.53,1.25,1.06,.049,.99);
b(-1.65,1.565,1.25,.72,.048,.67,C.edge);
b(-1.65,1.59,1.25,.40,.025,.37,C.deep);
diamond(-1.65,1.16,1.94,.23,.29,.1);
b(0,1.04,-.19,2.36,.52,1.56,C.basalt);
for(let j=0;j<5;j++)b(0,1.31+j*.16,-.19,2.20-j*.18,.15,1.48-j*.15,choose(colorStones));
lit(0,2.13,.10,1.04,.055,.90,C.cyan);
// Dark fractured stones floating around the tower: a deliberate halo of ruin
// fragments, varied in shape with glow emerging from fissures.
const debris=[
 [-6.02,4.95,-1.40,.62],[-5.54,7.18,-1.32,.91],
 [-3.52,8.72,-1.10,1.10],[-2.24,9.48,-1.64,.81],
 [2.33,9.52,-1.36,.84],[3.62,8.65,-1.42,.91],
 [5.49,7.22,-1.16,.87],[6.07,5.20,-1.37,.61],
 [-2.07,5.94,.61,.34],[2.06,6.17,.62,.38],
 [-1.50,4.06,.76,.25],[1.55,4.36,.60,.29]
];
for(const [i,v] of debris.entries()){
 const [x,y,z,size]=v;
 const phi=(rnd()-.5)*.40;
 b(x,y,z,size,size*.85,size*.93,choose(colorStones),phi);
 b(x+.12,y-size*.17,z+size*.48,size*.48,.07,.08,C.edge,phi);
 lit(x-.04,y-.17,z+size*.50,size*.42,.063,.045,C.cyan,phi);
 if(i%3===0)b(x-.12,y+size*.47,z,.27,.07,.22,C.moss,phi);
 if(size>.7)b(x+size*.35,y+.06,z-.05,.19,.35,.32,C.stone,phi);
}
// A four-pointed core like the title-art energy STAR. Long slender tapered
// arms (not a chunky crystal pendant) bloom out of a miniature white nucleus.
const starShape=new T.Shape();
starShape.moveTo(0,1.54);
starShape.lineTo(.29,.27);
starShape.lineTo(1.46,0);
starShape.lineTo(.29,-.27);
starShape.lineTo(0,-1.54);
starShape.lineTo(-.29,-.27);
starShape.lineTo(-1.46,0);
starShape.lineTo(-.29,.27);
starShape.closePath();
const starGeo=new T.ExtrudeGeometry(starShape,{
 depth:.20,bevelEnabled:true,bevelSize:.085,bevelThickness:.08,
 bevelSegments:1,steps:1
});
const starMat=new T.MeshBasicMaterial({color:0x91fff0,toneMapped:false});
const star=new T.Mesh(starGeo,starMat);
star.position.set(0,4.89,.78);g.add(star);
const innerStar=new T.Mesh(starGeo,new T.MeshBasicMaterial({color:0xffffff,toneMapped:false}));
innerStar.position.set(0,4.89,1.08);
innerStar.scale.set(.32,.34,1);g.add(innerStar);
const diamondBlade=new T.Mesh(new T.OctahedronGeometry(1),new T.MeshStandardMaterial({
 color:0x36dace,emissive:0x1cc9ba,emissiveIntensity:1.35,
 transparent:true,opacity:.75,flatShading:true,roughness:.1
}));
diamondBlade.position.set(0,4.92,.48);diamondBlade.scale.set(.50,.93,.39);g.add(diamondBlade);
lit(0,4.85,-1.22,.24,3.15,.19,C.cyan);
for(const side of [-1,1]){
 lit(side*.36,4.84,-1.12,.085,2.00,.09,C.cyan);
 for(let j=0;j<6;j++){
  const x=side*(1.22+j*.14),y=4.90+(j-2.5)*.26;
  if(j%2===0)diamond(x,y,.74,.11,.17,.13,true);
 }
}
for(let j=0;j<12;j++){
 const a=j*2.399,z=.87+.15*Math.sin(j),r=.98+((j%3)*.33);
 diamond(Math.cos(a)*r,4.89+Math.sin(a)*r*.81,z,
   .08+(j%2)*.05,.13+(j%3)*.07,.10,true);
}
// Subtle glow is a camera-facing sprite, not an all-scene neon flood.
const glowCanvas=document.createElement('canvas');glowCanvas.width=glowCanvas.height=64;
const gx=glowCanvas.getContext('2d');
const gradient=gx.createRadialGradient(32,32,3,32,32,32);
gradient.addColorStop(0,'rgba(88,255,229,.32)');
gradient.addColorStop(.35,'rgba(32,219,195,.10)');
gradient.addColorStop(1,'rgba(32,219,195,0)');
gx.fillStyle=gradient;gx.fillRect(0,0,64,64);
const corona=new T.Sprite(new T.SpriteMaterial({
 map:new T.CanvasTexture(glowCanvas),
 transparent:true,blending:T.AdditiveBlending,depthWrite:false
}));
corona.position.set(0,4.89,.36);corona.scale.set(4.6,4.6,1);g.add(corona);
// Vines, moss and rubble are structural accents, not randomly scattered grass.
for(const side of [-1,1]){
 for(let j=0;j<23;j++){
  const a=.17+(j%13)*.067;
  const r=5.18+(rnd()-.5)*.14;
  const x=side*r*Math.cos(a),y=2.12+2*r*Math.sin(a);
  if(j%3===0){
   b(x,y+.16,.29,.34,.15,.35,C.moss,-side*a);
   if(j%2===0)for(let k=0;k<3;k++)
    b(x+side*.10,y-k*.20,.37,.11,.23,.10,C.leaf,-side*a);
  }
 }
 for(let i=0;i<9;i++){
  const x=side*(2.8+rnd()*1.5),z=-2.58+rnd()*1.60;
  b(x,.92+rnd()*.19,z,.32+rnd()*.45,.27+rnd()*.25,
   .29+rnd()*.38,choose(colorStones));
 }
}
if(fracturePositions.length){
 const fractureGeo=new T.BufferGeometry();
 fractureGeo.setAttribute('position',new T.Float32BufferAttribute(fracturePositions,3));
 const fractures=new T.LineSegments(fractureGeo,new T.LineBasicMaterial({
  color:0x0b1013,transparent:true,opacity:.76
 }));
 g.add(fractures);
}
// Use instancing rather than hundreds of draw calls, keeping iPad performance.
const boxGeo=new T.BoxGeometry(1,1,1),D=new T.Object3D();
function addBatch(list,material,perInstanceColors=true){
 const mesh=new T.InstancedMesh(boxGeo,material,list.length);mesh.instanceMatrix.setUsage(T.StaticDrawUsage);
 list.forEach((p,i)=>{D.position.set(p.x,p.y,p.z);D.rotation.set(0,0,p.rot||0);D.scale.set(p.w,p.h,p.d);D.updateMatrix();mesh.setMatrixAt(i,D.matrix);if(perInstanceColors)mesh.setColorAt(i,new T.Color(p.color))});
 mesh.instanceMatrix.needsUpdate=true;if(mesh.instanceColor)mesh.instanceColor.needsUpdate=true;
 mesh.frustumCulled=false;g.add(mesh);
}
addBatch(blocks,new T.MeshStandardMaterial({color:0xffffff,roughness:.85,metalness:0,flatShading:true,vertexColors:false}));
addBatch(lights,new T.MeshBasicMaterial({color:0xffffff,toneMapped:false}));
const ground=new T.Mesh(new T.CircleGeometry(19,48),new T.MeshLambertMaterial({color:0x10282b,transparent:true,opacity:.75}));ground.rotation.x=-Math.PI/2;ground.position.y=-.08;scene.add(ground);
let yaw=.23,pitch=.13,dist=27,changing=false,frames=0;
const center=new T.Vector3(0,6.0,0),relative=new T.Vector3(),touches=new Map();
function render(){
 const w=root.clientWidth,h=root.clientHeight;if(!w||!h)return;
 const width=Math.max(1,w),height=Math.max(1,h);
 if(renderer.domElement.width!==Math.round(width*renderer.getPixelRatio())||renderer.domElement.height!==Math.round(height*renderer.getPixelRatio())){
  renderer.setSize(width,height,false);camera.aspect=width/height;camera.updateProjectionMatrix();
 }
 camera.position.set(center.x+dist*Math.sin(yaw)*Math.cos(pitch),center.y+dist*Math.sin(pitch),center.z+dist*Math.cos(yaw)*Math.cos(pitch));
 camera.lookAt(center);renderer.render(scene,camera);frames++;
}
let pending=false;function req(){if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;render()})}
new ResizeObserver(req).observe(root);req();
function on(id,fn){document.getElementById(id).addEventListener('click',()=>{fn();req()})}
on('angle',()=>{yaw=.38;pitch=.17;dist=27});
on('front',()=>{yaw=0;pitch=.06;dist=27});
on('side',()=>{yaw=Math.PI/2;pitch=.13;dist=27});
on('top',()=>{yaw=.05;pitch=1.36;dist=28});
on('left',()=>yaw-=.35);on('right',()=>yaw+=.35);
on('near',()=>dist=Math.max(9,dist/1.2));on('far',()=>dist=Math.min(36,dist*1.2));
function pinch(){const p=[...touches.values()];return p.length<2?null:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}
let lastPinch=null;
renderer.domElement.addEventListener('pointerdown',e=>{touches.set(e.pointerId,{x:e.clientX,y:e.clientY});renderer.domElement.setPointerCapture(e.pointerId);lastPinch=pinch()});
renderer.domElement.addEventListener('pointermove',e=>{
