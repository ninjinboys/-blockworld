name: Chimera 3D visual QA
on:
  push:
    paths:
      - '.github/workflows/chimera-visual-qa.yml'
      - 'chimera-sculpt-v4.js'
      - 'chimera-preview.html'
      - 'chimera-skeleton.js'
      - 'chimera-skeleton.html'
      - 'chimera-blockout.js'
      - 'chimera-blockout.html'
      - 'chimera-skin.js'
      - 'chimera-skin.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install browser automation
        run: |
          npm install --no-save playwright-core@1.55.0
          which google-chrome || which chromium || which chromium-browser
      - name: Render actual WebGL viewer
        run: |
          python3 -m http.server 8765 >/tmp/chimera-server.log 2>&1 &
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';
          const exe=fs.existsSync('/usr/bin/google-chrome')?'/usr/bin/google-chrome':
                    fs.existsSync('/usr/bin/chromium')?'/usr/bin/chromium':'google-chrome';
          const browser=await chromium.launch({
            headless:true,executablePath:exe,
            args:['--no-sandbox','--disable-dev-shm-usage','--ignore-certificate-errors',
              '--enable-webgl','--use-gl=angle','--use-angle=swiftshader',
              '--enable-unsafe-swiftshader']
          });
          const page=await browser.newPage({
            viewport:{width:1440,height:900},deviceScaleFactor:1,
            ignoreHTTPSErrors:true
          });
          page.on('pageerror',e=>console.log('PAGE ERROR:',e.stack||e.message));
          page.on('console',m=>{if(m.type()==='error')console.log('WEB CONSOLE:',m.text())});
          await page.goto('http://127.0.0.1:8765/chimera-preview.html?v=visual-check-r2',
            {waitUntil:'domcontentloaded',timeout:35000});
          await page.waitForFunction(()=>document.querySelector('#loadingOverlay')?.hidden,
            {timeout:70000});
          const err=await page.locator('#error').evaluate(el=>({
            display:getComputedStyle(el).display,text:el.textContent
          }));
          if(err.display!=='none')throw Error('3D viewer failed: '+err.text);
          await page.waitForTimeout(2500);
          await page.screenshot({path:'chimera-actual-v4.png',animations:'disabled'});
          await page.getByRole('button',{name:'正面'}).click();
          await page.waitForTimeout(1500);
          await page.screenshot({path:'chimera-front-v4.png',animations:'disabled'});
          console.log('Captured actual WebGL model',fs.statSync('chimera-actual-v4.png').size,
            fs.statSync('chimera-front-v4.png').size);
          // Verify the BONES-ONLY model separately from the sculpt.
          await page.goto('http://127.0.0.1:8765/chimera-skeleton.html?v=armature-qa-01',
            {waitUntil:'domcontentloaded',timeout:35000});
          await page.waitForFunction(()=>document.querySelector('#loadingOverlay')?.hidden,
            {timeout:70000});
          const errBone=await page.locator('#error').evaluate(el=>({
            display:getComputedStyle(el).display,text:el.textContent
          }));
          if(errBone.display!=='none')throw Error('Skeleton preview failed: '+errBone.text);
          await page.waitForTimeout(1200);
          await page.screenshot({path:'chimera-skeleton-hero.png',animations:'disabled'});
          await page.getByRole('button',{name:'正面'}).click();
          await page.waitForTimeout(750);
          await page.screenshot({path:'chimera-skeleton-front.png',animations:'disabled'});
          await page.getByRole('button',{name:'側面'}).click();
          await page.waitForTimeout(750);
          await page.screenshot({path:'chimera-skeleton-side.png',animations:'disabled'});
          await page.getByRole('button',{name:'3/4'}).click();
          await page.setViewportSize({width:1180,height:820});
          await page.waitForTimeout(850);
          await page.screenshot({path:'chimera-skeleton-ipad.png',animations:'disabled'});
          const info=await page.evaluate(()=>({
            title:document.title,
            scripts:[...document.querySelectorAll('script[src]')].map(x=>x.src),
            panel:document.querySelector('#error')?.textContent,
            hasCanvas:!!document.querySelector('#stage canvas')
          }));
          console.log('Skeleton headless WebGL verified',info);
          // Major body masses MUST actually render with no page exceptions:
          // this is the output to compare with the user's concept artwork.
          await page.goto('http://127.0.0.1:8765/chimera-blockout.html?v=blockout-03',
            {waitUntil:'domcontentloaded',timeout:35000});
          await page.waitForFunction(()=>document.querySelector('#loadingOverlay')?.hidden,
            {timeout:70000});
          const issue=await page.locator('#error').evaluate(el=>({
            display:getComputedStyle(el).display,text:el.textContent
          }));
          if(issue.display!=='none')throw Error('BODY BLOCKOUT FAILED '+issue.text);
          await page.waitForTimeout(1300);
          await page.screenshot({path:'chimera-blockout-hero.png',animations:'disabled'});
          await page.getByRole('button',{name:'正面'}).click();
          await page.waitForTimeout(850);
          await page.screenshot({path:'chimera-blockout-front.png',animations:'disabled'});
          await page.getByRole('button',{name:'側面'}).click();
          await page.waitForTimeout(850);
          await page.screenshot({path:'chimera-blockout-side.png',animations:'disabled'});
          await page.getByRole('button',{name:'3/4'}).click();
          await page.setViewportSize({width:1180,height:820});
          await page.waitForTimeout(850);
          await page.screenshot({path:'chimera-blockout-ipad.png',animations:'disabled'});
          const summary=await page.evaluate(()=>({
            loaded:document.querySelector('#loadingOverlay')?.hidden,
            canvas:!!document.querySelector('#stage canvas'),
            header:document.querySelector('.version-stamp')?.textContent
          }));
          console.log('Reference body blockout rendered:',summary);
          if(!summary.canvas||!summary.loaded)throw Error('missing 3D blockout canvas');

          // Verify ACTUAL canvas output, skin coverage and limb animation.
          // A JavaScript syntax check alone can pass for a broken WebGL mesh.
          await page.goto('http://127.0.0.1:8765/chimera-skin.html?v=skin01',
            {waitUntil:'domcontentloaded',timeout:35000});
          await page.waitForFunction(()=>document.querySelector('#loadingOverlay')?.hidden,
            null,{timeout:70000});
          const errorSkin=await page.locator('#error').evaluate(el=>({
            display:getComputedStyle(el).display,text:el.textContent
          }));
          if(errorSkin.display!=='none')throw Error('CHIMERA SKIN FAILED: '+errorSkin.text);
          const skinInfo=await page.evaluate(()=>window.chimeraSkinQA);
          if(!skinInfo||skinInfo.stage!=='skin-v1'||skinInfo.skinCount<28
              ||skinInfo.boneCount<45||!skinInfo.skinVisible)
            throw Error('Skin did not wrap the real bone rig: '+JSON.stringify(skinInfo));
          await page.waitForTimeout(1450);
          await page.screenshot({path:'chimera-skin-hero.png',animations:'disabled'});
          await page.getByRole('button',{name:'正面'}).click();
          await page.waitForTimeout(950);
          await page.screenshot({path:'chimera-skin-front.png',animations:'disabled'});
          await page.getByRole('button',{name:'側面'}).click();
          await page.waitForTimeout(950);
          await page.screenshot({path:'chimera-skin-side.png',animations:'disabled'});
          await page.getByRole('button',{name:'内部表示'}).click();
          const inside=await page.evaluate(()=>window.chimeraSkinQA.skinVisible);
          if(inside)throw Error('Internal anatomy overlay not working');
          await page.getByRole('button',{name:'内部表示'}).click();
          if(!(await page.evaluate(()=>window.chimeraSkinQA.skinVisible)))
            throw Error('Skin restore toggle not working');
          await page.getByRole('button',{name:'歩行 4.8'}).click();
          await page.waitForTimeout(850);
          if((await page.locator('#movementSpeed').textContent()).includes('STAND BY'))
            throw Error('Walking animation not enabled');
          await page.getByRole('button',{name:'歩行 4.8'}).click();
          await page.getByRole('button',{name:'3/4'}).click();
          await page.setViewportSize({width:1180,height:820});
          await page.waitForTimeout(950);
          await page.screenshot({path:'chimera-skin-ipad.png',animations:'disabled'});
          console.log('Skin WebGL render and interactive skeleton/skin switch PASSED',skinInfo);
          await browser.close();
          EOF
      - name: Store proof images in repo for 3D visual review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for name in chimera-actual-v4 chimera-front-v4 chimera-skeleton-hero chimera-skeleton-front chimera-skeleton-side chimera-skeleton-ipad chimera-blockout-hero chimera-blockout-front chimera-blockout-side chimera-blockout-ipad chimera-skin-hero chimera-skin-front chimera-skin-side chimera-skin-ipad; do
            current="$(gh api repos/${{ github.repository }}/contents/dev/${name}.png --jq .sha 2>/dev/null || true)"
            export NAME="$name" CURRENT_SHA="$current"
            python3 - <<'PY'
          import json,base64,os
          name=os.environ['NAME']
          data=base64.b64encode(open(name+'.png','rb').read()).decode()
          payload={'message':'Visual QA: render actual Chimera model/skeleton in Chromium','content':data}
          if os.environ.get('CURRENT_SHA'):
              payload['sha']=os.environ['CURRENT_SHA']
          with open(name+'.json','w') as f:
              json.dump(payload,f)
          PY
            gh api --method PUT repos/${{ github.repository }}/contents/dev/${name}.png --input "${name}.json" >/dev/null
          done
